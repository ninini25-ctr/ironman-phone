<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#faf5ec"/>
<title>STARK OS </title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307090d'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%2335d0ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23eafcff'/%3E%3C/svg%3E"/>
<style>
:root{
  --bg:#07090d; --panel:#10151c; --panel2:#171f2a; --line:#1e2a38;
  --text:#eaf4ff; --muted:#7c8da0;
  --cyan:#35d0ff; --cyanGlow:rgba(53,208,255,.5);
  --red:#e23636; --gold:#f5b942; --green:#4fd08a;
  --safe:env(safe-area-inset-bottom,16px);
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --font-en:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-body:var(--font-ui);
  --font-size-base:14px;
  --radius:16px;
  --wall:radial-gradient(circle at 50% 24%,rgba(53,208,255,.22),transparent 45%),radial-gradient(circle at 85% 90%,rgba(226,54,54,.11),transparent 55%),radial-gradient(circle at 12% 82%,rgba(245,185,66,.06),transparent 50%),linear-gradient(170deg,#0a111b 0%,#07090d 60%,#040608 100%);
  --icon-bg:linear-gradient(150deg,#15202d,#0c131c);
  --outer:#02040a;
  --brand-tint:rgba(53,208,255,.1);
  /* ---- 开场统一晨光色系：预加载 / 说明页 / 手机外围共用，不随 App 主题漂移 ---- */
  --dawn-hi:#fffaf2;   --dawn-1:#fff4e5;   --dawn-2:#ffe9cf;
  --dawn-3:#f8d8b5;   --dawn-4:#eec39a;   --dawn-5:#d5a171;
  --dawn-ink:#473325;  --dawn-ink2:#7a5e49;--dawn-ink3:#a5856a;
  --dawn-line:#e8d3b8; --dawn-panel:rgba(255,252,246,.84);
  --dawn-gold:#bd832c; --dawn-gold2:#e2b063;--dawn-rose:#e2a184;
  --dawn-sky:#c3dcdf;  --dawn-core:#fff7e2; --dawn-core2:#ffdc92;
}
body.theme-light{
  --bg:#f2f5f9; --panel:#ffffff; --panel2:#e9eef5; --line:#d9e2ed;
  --text:#17202c; --muted:#6c7b8d; --cyan:#0e7fb8; --cyanGlow:rgba(14,127,184,.35);
  --gold:#a97715; --red:#c62d2d; --green:#1d8a55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{display:flex;align-items:center;justify-content:center;background:#02040a;font-family:var(--font-body);color:var(--text);overflow:hidden;font-size:var(--font-size-base, 14px);}
body.theme-light{background:#dfe6ef;}
.device{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;margin:0 auto;font-size:var(--font-size-base, 14px);}
/* 强制气泡、卡片、世界线等关键区域直接挂钩根字号变量，杜绝写死像素导致滑块失效 */
.bub, .story, .card, .post .tx, .mail-detail, .opt, .field input, .field textarea {
  font-size: var(--font-size-base, 14px) !important;
}
.bubwrap .who {
  font-size: calc(var(--font-size-base, 14px) * 0.82) !important;
}
.bubwrap .tm {
  font-size: calc(var(--font-size-base, 14px) * 0.72) !important;
}
@media(min-width:500px){
  .device{width:392px;height:846px;max-height:96vh;border-radius:46px;
    box-shadow:0 0 0 2px #0c1118,0 0 0 11px #05070b,0 0 80px rgba(53,208,255,.18);}
  body.theme-light .device{box-shadow:0 0 0 2px #e6ebf2,0 0 0 11px #cbd5e2,0 0 80px rgba(0,0,0,.18);}
}
/* 顶部状态栏：平顺内嵌式微顶栏，彻底去除突兀下垂的刘海盒子 */
.statusbar{position:absolute;top:0;left:0;right:0;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:12px;font-weight:600;z-index:40;font-variant-numeric:tabular-nums;color:var(--text);letter-spacing:.3px;background:linear-gradient(180deg,rgba(7,9,13,.75) 0%,transparent 100%);pointer-events:none;}
.statusbar *{pointer-events:auto;}
.statusbar #clock{flex:0 0 auto;font-weight:700;}
.statusbar .sb-r{flex:0 0 auto;display:flex;align-items:center;gap:6px;}
.statusbar .dot{color:var(--cyan);font-size:9px;}
body.theme-light .brand{box-shadow:0 3px 14px rgba(14,127,184,.18);}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:46px;}
.screen.active{display:flex;}

/* 桌面 */
#home .wall{position:absolute;inset:0;background:var(--wall);}
#home .wall::after{content:"";position:absolute;inset:0;opacity:.4;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,transparent 0 38px,rgba(53,208,255,.04) 38px 39px),
  repeating-linear-gradient(90deg,transparent 0 38px,rgba(53,208,255,.04) 38px 39px);
  -webkit-mask-image:radial-gradient(circle at 50% 35%,#000,transparent 75%);}
/* 桌面反应堆 · 所有配色由 applyAppearance 按当前主题推导，深浅/冷暖皮肤下都协调 */
.reactor{position:relative;z-index:2;margin:26px auto 6px;width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 50% 44%,var(--rr-core,#eafcff) 0%,var(--rr-mid,#35d0ff) 26%,var(--rr-deep,#0a3b55) 68%,var(--rr-edge,#06141c) 100%);
  border:1px solid var(--rr-ring,rgba(53,208,255,.55));
  box-shadow:0 0 0 1px var(--rr-outline,rgba(53,208,255,.22)),
    0 0 0 6px var(--rr-halo,rgba(53,208,255,.09)),
    0 0 0 7px var(--rr-outline,rgba(53,208,255,.22)),
    0 0 34px var(--cyanGlow),
    inset 0 0 18px var(--rr-inner,rgba(0,0,0,.35)),
    inset 0 2px 10px var(--rr-hl,rgba(255,255,255,.45));
  display:flex;align-items:center;justify-content:center;animation:pulse 3.4s ease-in-out infinite;}
.reactor .rr-ticks{position:absolute;inset:3px;border-radius:50%;pointer-events:none;opacity:.7;
  background:repeating-conic-gradient(from 0deg,var(--rr-tick,rgba(53,208,255,.42)) 0deg 1deg,transparent 1deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 0 84%,#000 86% 100%);
  mask:radial-gradient(circle,transparent 0 84%,#000 86% 100%);}
.reactor::before{content:"";position:absolute;inset:12px;border-radius:50%;
  border:1px solid var(--rr-ring,rgba(53,208,255,.55));
  box-shadow:0 0 0 5px var(--rr-halo,rgba(53,208,255,.09)),
    inset 0 0 12px var(--rr-inner,rgba(0,0,0,.35)),0 0 12px var(--cyanGlow);}
.reactor::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,var(--rr-hl,rgba(255,255,255,.55)),var(--rr-core,#eafcff) 46%,var(--rr-mid,#35d0ff) 100%);
  box-shadow:0 0 16px var(--rr-core,#eafcff),0 0 30px var(--cyanGlow),0 0 0 1px var(--rr-ring,rgba(53,208,255,.55));}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.05);opacity:.9;}}
.hud-title{position:relative;z-index:2;text-align:center;font-size:12px;letter-spacing:5px;color:var(--cyan);font-weight:700;margin-bottom:2px;font-family:var(--font-en);}
.hud-sub{position:relative;z-index:2;text-align:center;font-size:9.5px;letter-spacing:3px;color:var(--muted);margin-bottom:8px;font-family:var(--font-en);}
/* 桌面图标 · 横向 scroll-snap 分页，左右滑动切屏，不再全部挤在一版 */
.grid{position:relative;z-index:2;flex:1;min-height:0;display:flex;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding:6px 0 4px;scrollbar-width:none;}
.grid::-webkit-scrollbar{display:none;}
.grid-page{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;
  display:grid;grid-template-columns:repeat(4,1fr);align-content:start;gap:20px 8px;padding:8px 18px 10px;}
.grid-dots{position:relative;z-index:4;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  gap:7px;padding:3px 0 calc(24px + var(--safe));}
.grid-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.22s;flex:0 0 auto;}
.grid-dots i.on{width:22px;border-radius:4px;background:var(--cyan);box-shadow:0 0 10px var(--cyanGlow);}
.gd-nav{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);
  color:var(--cyan);cursor:pointer;font-size:14px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.gd-nav:disabled{opacity:.25;cursor:default;}
.gd-swipe{position:absolute;right:10px;bottom:calc(30px + var(--safe));z-index:4;font-size:9px;
  color:var(--muted);letter-spacing:.5px;opacity:.8;pointer-events:none;}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--text);padding:0;}
.icon span{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;
  background:var(--icon-bg);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.45);transition:.15s;}
.icon:active span{transform:scale(.9);}
.icon svg{width:26px;height:26px;stroke:var(--cyan);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.icon label{font-size:10.5px;letter-spacing:.2px;color:#cdddf0;font-family:var(--font-serif);}
body.theme-light .icon label{color:#3d4b5c;}
.icon.locked span{filter:grayscale(.8);opacity:.55;}
.icon .badge{position:absolute;transform:translate(16px,-14px);min-width:16px;height:16px;line-height:16px;
  text-align:center;font-size:9.5px;font-weight:700;background:var(--red);color:#fff;border-radius:8px;
  padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.3);border:1.5px solid var(--bg);}
.icon .badge.lk{background:rgba(124,141,160,.9);transform:translate(16px,-14px);font-size:8px;padding:0 3px;}
.wm{position:absolute;bottom:calc(4px + var(--safe));left:50%;transform:translateX(-50%);z-index:3;font-size:10px;letter-spacing:3px;color:rgba(124,141,160,.6);font-family:var(--font-en);font-style:italic;}
#deskEdit{position:absolute;top:54px;right:12px;z-index:6;background:var(--panel2);border:1px solid var(--line);color:var(--cyan);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;}

/* App 容器 */
.appbar{display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:52px;
  background:rgba(10,15,22,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:10;}
body.theme-light .appbar{background:rgba(255,255,255,.86);}
.back{background:none;border:none;color:var(--cyan);font-size:28px;line-height:1;cursor:pointer;padding:0 4px;}
.appbar h1{flex:1;margin:0;font-size:16px;font-weight:650;text-align:center;letter-spacing:.5px;font-family:var(--font-serif);}
.appbar .act{background:none;border:none;color:var(--cyan);font-size:13px;cursor:pointer;font-weight:600;}
.body{flex:1;overflow-y:auto;position:relative;}
.body::-webkit-scrollbar{width:0;}

/* 通用组件 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;}
.card h3{margin:0 0 12px;font-size:14px;color:var(--cyan);letter-spacing:.5px;font-family:var(--font-serif);}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:11px;}
.field label{font-size:12px;color:var(--muted);}
.field input,.field select,.field textarea,.inp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;color:var(--text);font-size:14px;outline:none;width:100%;font-family:var(--font-body);}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(53,208,255,.14);}
.btn{background:linear-gradient(135deg,var(--cyan),#1b9fd0);border:none;color:#04121a;padding:11px 16px;
  border-radius:12px;font-weight:700;cursor:pointer;width:100%;font-size:13.5px;letter-spacing:.4px;font-family:var(--font-body);}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text);}
.btn.red{background:linear-gradient(135deg,var(--red),#a01f1f);color:#fff;}
.btn.gold{background:linear-gradient(135deg,var(--gold),#c8891f);color:#1a1204;}
.btn.sm{padding:8px 12px;font-size:12px;width:auto;border-radius:10px;}
.btn:disabled{opacity:.4;}
.row{display:flex;gap:8px;}
.row>*{flex:1;min-width:0;}
.pad{padding:14px;}
.hint{font-size:11.5px;color:var(--muted);line-height:1.7;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(16,24,34,.96);
  border:1px solid var(--cyan);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;
  opacity:0;transition:.3s;pointer-events:none;box-shadow:0 0 18px rgba(53,208,255,.3);max-width:88%;text-align:center;}
.toast.show{opacity:1;}
.loader{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px;color:var(--muted);font-size:13px;}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.switch{position:relative;width:46px;height:26px;display:inline-block;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#283544;border-radius:26px;transition:.3s;cursor:pointer;}
.slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s;}
input:checked+.slider{background:var(--cyan);}
input:checked+.slider:before{transform:translateX(20px);}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.srow:last-child{border-bottom:none;}
.srow .t{font-size:13.5px;font-weight:600;}
.srow .d{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
.seg{display:flex;gap:5px;background:var(--panel2);padding:4px;border-radius:12px;margin:0 0 12px;overflow-x:auto;}
.seg button{flex:1;padding:8px 10px;border:none;background:none;color:var(--muted);border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(53,208,255,.14);color:var(--cyan);margin-left:6px;vertical-align:middle;}
.tag.gold{background:rgba(245,185,66,.16);color:var(--gold);}
.tag.red{background:rgba(226,54,54,.16);color:var(--red);}
.tag.green{background:rgba(79,208,138,.16);color:var(--green);}
.divider{height:1px;background:var(--line);margin:12px 0;}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:30px 12px;line-height:1.8;}
.banner{position:fixed;top:104px;left:16px;right:16px;max-width:398px;margin:0 auto;background:rgba(16,24,34,.94);
  backdrop-filter:blur(14px);border:1px solid rgba(53,208,255,.7);border-radius:12px;padding:9px 12px;z-index:500;display:none;
  box-shadow:0 10px 26px rgba(0,0,0,.55);cursor:pointer;line-height:1.45;}
.banner b{color:var(--cyan);font-size:12px;}
.banner div{font-size:11.5px;color:#c5d3e4;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* 字体美化 */
.en{font-family:var(--font-en);font-style:italic;letter-spacing:.015em;color:var(--gold);
  text-shadow:0 0 14px rgba(245,185,66,.22);padding:0 1px;}
body.no-en-decor .en{font-family:inherit;font-style:normal;letter-spacing:inherit;color:inherit;text-shadow:none;padding:0;}
.en-line{display:inline;}
.zh{color:var(--text);opacity:.9;}
em{color:var(--gold);font-style:normal;background:linear-gradient(transparent 62%,rgba(245,185,66,.22) 62%);padding:0 2px;}
.serif{font-family:var(--font-serif);}
.mono{font-family:var(--font-mono);}
.eyebrow{font-family:var(--font-en);font-style:italic;letter-spacing:2px;color:var(--cyan);font-size:11px;text-transform:uppercase;}
.title-en{font-family:var(--font-en);font-style:italic;letter-spacing:1px;}

/* 聊天 */
.chatrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.av{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#04121a;background:linear-gradient(135deg,var(--cyan),var(--gold));font-family:var(--font-en);}
.chatrow .nm{font-weight:650;font-size:14.5px;}
.chatrow .ds{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;}
#thread{flex:1;overflow-y:auto;padding:14px 14px;display:flex;flex-direction:column;gap:12px;}
.bubwrap{display:flex;flex-direction:column;max-width:75%;min-width:40px;}
.bubwrap.me{align-self:flex-end;align-items:flex-end;}
.bubwrap.them{align-self:flex-start;align-items:flex-start;}
/* 名字移到气泡外上方，精简干练 */
.bubwrap .who{font-size:11px;color:var(--cyan);font-weight:600;margin-bottom:4px;padding-left:4px;letter-spacing:.3px;}
/* 气泡自适应文字宽度，不再撑破整行 */
.bub{display:inline-block;width:fit-content;padding:8px 12px;border-radius:16px;font-size:13px;line-height:1.45;word-break:break-word;white-space:pre-wrap;font-family:var(--font-body);box-shadow:0 1px 2px rgba(0,0,0,.06);}
.bub.me{background:linear-gradient(135deg,#209cee,#1479bd);color:#ffffff;border-bottom-right-radius:3px;}
body.theme-light .bub.me{background:linear-gradient(135deg,#0e7fb8,#0a5f8a);color:#ffffff;}
.bub.them{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:3px;}
/* 气泡底部的操作栏与时间戳 */
.bubwrap .action-bar{display:flex;gap:8px;align-items:center;margin-top:3px;padding:0 4px;font-size:9.5px;color:var(--muted);}
.bubwrap .action-bar span{cursor:pointer;}
.bubwrap .action-bar span:hover{color:var(--cyan);}
.composer{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(12px + var(--safe));background:var(--panel);border-top:1px solid var(--line);}
.composer input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:22px;padding:11px 15px;color:var(--text);outline:none;font-size:14px;font-family:var(--font-body);}
.composer button{background:var(--cyan);border:none;color:#04121a;border-radius:22px;padding:0 18px;font-weight:700;cursor:pointer;}
.notice{background:rgba(245,185,66,.09);border:1px solid rgba(245,185,66,.35);color:var(--gold);font-size:11.5px;padding:8px 12px;border-radius:10px;margin:8px 14px 0;line-height:1.6;}

/* 动态卡 */
.post{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.post .h{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.post .h .nm{font-weight:700;font-size:14px;}
.post .h .hd{color:var(--muted);font-size:11.5px;font-family:var(--font-en);font-style:italic;}
.post .tx{font-size:var(--font-size-base,14px);line-height:1.75;white-space:pre-wrap;margin-bottom:10px;font-family:var(--font-serif);}
.post img{width:100%;border-radius:12px;margin-bottom:10px;display:block;}
.post .ft{display:flex;gap:16px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;align-items:center;}
.post .ft span{cursor:pointer;}
.post .ft span.on{color:var(--gold);}
.cmt{font-size:12.5px;line-height:1.6;padding:4px 0;color:#c7d6e8;font-family:var(--font-serif);}
.cmt b{color:var(--cyan);}
.cmtbox{display:flex;gap:6px;margin-top:8px;}
.cmtbox input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:7px 12px;color:var(--text);outline:none;font-size:13px;}
.cmtbox button{background:var(--cyan);border:none;color:#04121a;border-radius:18px;padding:0 14px;font-weight:700;cursor:pointer;font-size:13px;}

/* 世界线 */
.story{font-size:calc(var(--font-size-base,14px) * 1.04);line-height:1.95;white-space:pre-wrap;margin:6px 0 16px;color:#dbeaff;font-family:var(--font-serif);}
body.theme-light .story{color:#26313f;}
.opt{text-align:left;white-space:normal;margin-bottom:9px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);padding:12px 14px;border-radius:12px;cursor:pointer;width:100%;font-size:var(--font-size-base,14px);line-height:1.6;font-family:var(--font-serif);}
.opt:active{border-color:var(--cyan);}
.statbar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:14px;padding:12px 14px;margin-bottom:12px;}
.affval{font-size:18px;font-weight:800;color:var(--gold);font-family:var(--font-en);}
.music-item{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);}
.music-item .play{color:var(--cyan);font-size:18px;cursor:pointer;}

/* 邮件 */
.mail-row{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;}
.mail-row.unread{background:rgba(53,208,255,.05);}
.mail-row .sub{font-size:13.5px;font-weight:650;}
.mail-row .fr{font-size:11.5px;color:var(--muted);}
.mail-row .prev{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px;margin-top:3px;}
.mail-detail{font-size:var(--font-size-base,14px);line-height:1.9;white-space:pre-wrap;font-family:var(--font-serif);}
.quote{border-left:2px solid var(--cyan);padding:8px 12px;background:var(--panel2);color:var(--muted);font-size:12.5px;line-height:1.7;border-radius:0 8px 8px 0;margin:10px 0;font-family:var(--font-serif);}
.chip{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:0 5px 5px 0;cursor:pointer;}
.chip.on{background:rgba(53,208,255,.16);color:var(--cyan);border-color:var(--cyan);}

/* 报纸 */
.paper{background:linear-gradient(180deg,#f7f3e9,#efe8d8);color:#1d1a14;border-radius:6px;padding:18px 16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-family:var(--font-serif);}
.paper .masthead{text-align:center;border-bottom:3px double #1d1a14;padding-bottom:10px;margin-bottom:6px;}
.paper .masthead .n{font-family:var(--font-en);font-size:24px;font-weight:700;letter-spacing:1px;font-style:italic;}
.paper .masthead .s{font-family:var(--font-en);font-size:10px;letter-spacing:3px;color:#6a5f4b;margin-top:3px;}
.paper .dateline{display:flex;justify-content:space-between;font-size:10.5px;color:#6a5f4b;border-bottom:1px solid #b9ac93;padding:6px 0;margin-bottom:12px;font-family:var(--font-en);}
.paper h2{font-size:19px;line-height:1.45;margin:0 0 6px;font-weight:800;}
.paper .kicker{font-size:11px;color:#8a2b22;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-family:var(--font-en);}
.paper .lead{font-size:13.5px;line-height:1.85;text-indent:2em;margin:0 0 10px;}
.paper .bodytx{font-size:12.5px;line-height:1.85;column-count:2;column-gap:14px;text-align:justify;}
.paper .ednote{margin-top:12px;border-top:1px solid #b9ac93;padding-top:8px;font-size:11px;color:#6a5f4b;line-height:1.6;}
.paper.bugle{background:linear-gradient(180deg,#f2efe6,#e8e2d3);}

/* 群聊 / 终端 / 日记 */
.gmsg{display:flex;gap:9px;margin-bottom:12px;align-items:flex-start;}
.gmsg .gav{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#04121a;}
.gmsg .gbd{flex:1;min-width:0;}
.gmsg .gnm{font-size:11.5px;color:var(--cyan);font-weight:700;margin-bottom:3px;}
.gmsg .gtx{font-size:13.5px;line-height:1.7;background:var(--panel2);border:1px solid var(--line);padding:9px 12px;border-radius:12px;font-family:var(--font-serif);white-space:pre-wrap;}
.term{background:#050a0f;border:1px solid #123;border-radius:12px;padding:14px;font-family:var(--font-mono);font-size:12px;line-height:1.8;color:#8fe3ff;min-height:190px;max-height:340px;overflow-y:auto;white-space:pre-wrap;}
.term .ok{color:#4fd08a;}.term .warn{color:var(--gold);}.term .err{color:var(--red);}
.diary-paper{background:linear-gradient(180deg,#f4ecd8,#e9dfc6);color:#2b2318;border-radius:10px;padding:18px;min-height:180px;font-family:var(--font-serif);line-height:2;font-size:14px;white-space:pre-wrap;box-shadow:inset 0 0 40px rgba(120,90,40,.12);}
.diary-paper.blue{background:linear-gradient(180deg,#eaf1f7,#dce7f1);}
.diary-paper.dark{background:linear-gradient(180deg,#20242c,#161a21);color:#dbe6f2;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px;}
.cal-grid .h{color:var(--muted);font-size:10.5px;padding:4px 0;}
.cal-grid .d{padding:9px 0;border-radius:9px;background:var(--panel2);border:1px solid transparent;cursor:pointer;}
.cal-grid .d.has{border-color:var(--cyan);color:var(--cyan);}
.cal-grid .d.today{background:var(--cyan);color:#04121a;font-weight:700;}
.mini{font-size:11.5px;color:var(--muted);line-height:1.7;}
.lockbox{text-align:center;padding:46px 22px;}
.lockbox .lk{font-size:42px;margin-bottom:14px;}

/* 开屏弹窗 */
.onboard-layer{position:fixed;inset:0;z-index:900;background:rgba(3,6,11,.94);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto;}
.ob-card{width:100%;max-width:410px;max-height:94vh;overflow-y:auto;background:linear-gradient(170deg,#101822,#0a0f16);border:1px solid #24405a;border-radius:22px;padding:20px;box-shadow:0 0 60px rgba(53,208,255,.16);}
.ob-card::-webkit-scrollbar{width:0;}
.ob-head{text-align:center;margin-bottom:14px;}
.ob-head .rr{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;background:radial-gradient(circle,#eafcff,var(--cyan) 36%,#0a3b55 72%,#06141c);box-shadow:0 0 26px var(--cyanGlow);}
.ob-head h2{font-family:var(--font-en);font-style:italic;letter-spacing:2px;font-size:18px;color:var(--cyan);margin:0;}
.ob-head p{font-size:10.5px;color:var(--muted);letter-spacing:2px;margin:4px 0 0;font-family:var(--font-en);}
.ob-sec{margin-bottom:14px;}
.ob-sec>.lb{font-size:12px;color:var(--gold);letter-spacing:1px;margin-bottom:8px;font-family:var(--font-serif);font-weight:700;}
.era-card{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);margin-bottom:7px;cursor:pointer;}
.era-card.on{border-color:var(--cyan);background:rgba(53,208,255,.1);}
.era-card .t{font-size:13px;font-weight:700;}
.era-card .d{font-size:11px;color:var(--muted);line-height:1.55;margin-top:3px;}
.agebox{background:linear-gradient(135deg,rgba(53,208,255,.09),rgba(245,185,66,.07));border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;}
.agebox table{width:100%;border-collapse:collapse;font-size:12px;}
.agebox td{padding:4px 0;color:var(--muted);}
.agebox td:last-child{text-align:right;color:var(--text);font-weight:700;font-family:var(--font-en);}
.agebox .cmp{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--gold);line-height:1.7;}
.step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px;}
.step-dots i{width:22px;height:4px;border-radius:3px;background:var(--line);}
.step-dots i.on{background:var(--cyan);}

/* 桌面 · 外观设置入口与面板（外观设置移至桌面） */
.skinbar{position:relative;z-index:7;align-self:center;display:flex;align-items:center;gap:6px;
  margin:0 0 10px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;
  background:rgba(16,24,34,.62);color:var(--muted);font-size:10.5px;letter-spacing:.3px;cursor:pointer;
  font-family:var(--font-body);backdrop-filter:blur(8px);}
body.theme-light .skinbar{background:rgba(255,255,255,.72);}
.skinbar b{color:var(--cyan);font-weight:700;}
.skinbar .ar{color:var(--gold);font-size:9px;}
.skin-panel{position:absolute;top:176px;left:12px;right:12px;bottom:52px;z-index:25;overflow-y:auto;
  background:var(--panel);border:1px solid var(--cyan);border-radius:16px;padding:13px;
  box-shadow:0 18px 46px rgba(0,0,0,.68),0 0 0 1px rgba(53,208,255,.12);}
.skin-panel::-webkit-scrollbar{width:0;}
.skin-panel h3{margin:0 0 9px;font-size:13px;color:var(--cyan);font-family:var(--font-serif);letter-spacing:.5px;}
.skin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.skin-card{border:1.5px solid var(--line);border-radius:12px;padding:8px 9px;background:var(--panel2);cursor:pointer;transition:.15s;}
.skin-card.on{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(53,208,255,.2);}
.skin-card .sn{font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:4px;}
.skin-card .sn em{font-style:normal;font-size:9px;color:var(--muted);font-family:var(--font-en);}
.skin-card .sd{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.45;}
.swatches{display:flex;gap:4px;margin-top:7px;}
.swatches i{width:17px;height:17px;border-radius:5px;border:1px solid rgba(255,255,255,.2);}
.skin-close{position:sticky;top:0;float:right;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;z-index:2;}

/* 开局 · 操作与内容说明 */
.gd-sec{margin-bottom:12px;}
.gd-sec h3{margin:0 0 8px;font-size:13px;color:var(--gold);font-family:var(--font-serif);letter-spacing:.5px;}
.gd-hint{font-size:12.5px;line-height:1.95;color:#c7d6e8;margin:0;padding-left:18px;}
.gd-hint li{margin-bottom:5px;}
.gd-hint b{color:var(--text);}
.gd-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.gd-item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:10.5px;line-height:1.55;color:var(--muted);}
.gd-item b{display:block;color:var(--cyan);font-size:11.5px;margin-bottom:2px;font-family:var(--font-serif);}
.gd-note{background:rgba(53,208,255,.07);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.85;color:#c7d6e8;}
.gd-foot{display:flex;align-items:center;gap:8px;margin-top:6px;}
.gd-foot .btn{flex:1;}
.gd-foot .btn.ghost{flex:0 0 112px;}
.gd-check{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:11px;font-size:11px;color:var(--muted);cursor:pointer;}
.gd-check input{accent-color:var(--cyan);}
/* 开局说明配色统一迁移到下方「开场统一晨光色系」块 */

/* ============================================================
   扩展层：J.A.R.V.I.S. HUD / FX / 全文检索 / 工坊 / 世界树 / 多维关系
   ============================================================ */
/* HUD 胶囊（全站悬浮） */
.jhud{position:absolute;right:12px;bottom:calc(102px + var(--safe));z-index:45;display:flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:20px;cursor:pointer;background:rgba(10,16,24,.8);backdrop-filter:blur(10px);border:1px solid rgba(53,208,255,.5);box-shadow:0 4px 22px rgba(53,208,255,.22);transition:.18s;}
.jhud:active{transform:scale(.93);}
.jhud .rr2{width:20px;height:20px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle,#eafcff,var(--cyan) 40%,#0a3b55 76%);box-shadow:0 0 10px var(--cyanGlow);animation:pulse 3.2s ease-in-out infinite;}
.jhud .jl{font-family:var(--font-en);font-style:italic;font-weight:700;font-size:10px;letter-spacing:1.5px;color:var(--cyan);}
body.theme-light .jhud{background:rgba(255,255,255,.82);border-color:rgba(14,127,184,.5);}
/* HUD 问答浮窗 */
.jwin{position:absolute;left:10px;right:10px;bottom:calc(86px + var(--safe));z-index:62;max-height:64vh;display:flex;flex-direction:column;background:rgba(8,13,20,.97);backdrop-filter:blur(18px);border:1px solid var(--cyan);border-radius:18px;box-shadow:0 18px 54px rgba(0,0,0,.72),0 0 26px rgba(53,208,255,.16);overflow:hidden;}
.jw-h{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);flex-shrink:0;}
.jw-h .rr2{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#eafcff,var(--cyan) 40%,#0a3b55 76%);box-shadow:0 0 12px var(--cyanGlow);}
.jw-h b{font-family:var(--font-en);font-style:italic;letter-spacing:1.5px;font-size:13px;color:var(--cyan);}
.jw-h .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1;}
.jw-vt{font-size:9.5px;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:2px 8px;margin-left:auto;}
.jw-h b+.jw-vt{margin-left:0;}
.jw-vt.on{color:var(--cyan);border-color:var(--cyan);}
.jw-b{flex:1;overflow-y:auto;padding:11px 13px;}
.jw-b::-webkit-scrollbar{width:0;}
.jw-q{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:rgba(10,16,24,.6);flex-shrink:0;}
.jw-q input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:9px 14px;color:var(--text);outline:none;font-size:13px;font-family:var(--font-body);}
.jw-q button{background:var(--cyan);border:none;color:#04121a;border-radius:18px;padding:0 16px;font-weight:700;cursor:pointer;}
.jw-a{font-size:13px;line-height:1.85;white-space:pre-wrap;font-family:var(--font-serif);color:#dbeaff;}
body.theme-light .jw-a{color:#26313f;}
.jw-sys{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);line-height:1.7;}
.jw-stk{font-family:var(--font-mono);font-size:12px;line-height:2;}
.jw-stk .up{color:var(--red);}.jw-stk .dn{color:var(--green);}
body.theme-light .jwin{background:rgba(246,250,254,.97);}
body.theme-light .jw-h,body.theme-light .jw-q{background:rgba(246,250,254,.97);}
/* 状态栏 · 托尼实时状态 */
.sb-tony{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--cyan);max-width:76px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.sb-tony .st{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:pulse 2.6s ease-in-out infinite;flex-shrink:0;}
/* 环境微日志 ticker */
#envTicker{position:relative;z-index:2;margin:0 auto 6px;max-width:330px;overflow:hidden;white-space:nowrap;font-size:9.5px;color:var(--muted);font-family:var(--font-mono);}
#envTicker .ti{display:inline-block;padding-left:100%;animation:tk 30s linear infinite;}
@keyframes tk{to{transform:translateX(-100%)}}
/* FX：扫描线 / 故障 / 粒子 */
#fxScan{position:absolute;inset:0;z-index:71;pointer-events:none;opacity:0;transition:opacity .5s;background:repeating-linear-gradient(0deg,rgba(120,220,255,.03) 0 1px,transparent 1px 3px);}
#fxScan.on{opacity:1;}
#fxCanvas{position:absolute;inset:0;z-index:70;pointer-events:none;}
@keyframes fxGlitch{0%{transform:translate(0)}18%{transform:translate(-2px,1px) skewX(.7deg)}38%{transform:translate(2px,-1px) skewX(-.6deg)}60%{transform:translate(-1px,2px)}82%{transform:translate(1px,-1px) skewX(.4deg)}100%{transform:translate(0)}}
.device.fx-glitch{animation:fxGlitch .34s steps(2,end) 1;}
/* 全文检索 */
.ft-hit{padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;background:var(--panel2);}
.ft-hit b{color:var(--cyan);font-size:12.5px;}
.ft-hit .sn{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:3px;word-break:break-all;}
.ft-hit .sn i{color:var(--gold);font-style:normal;background:rgba(245,185,66,.16);padding:0 2px;border-radius:3px;}
/* 多维关系 */
.relgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:8px;}
.relrow{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);}
.relrow .bar{flex:1;height:4px;border-radius:3px;background:var(--panel2);overflow:hidden;}
.relrow .bar i{display:block;height:100%;border-radius:3px;}
.relrow .v{font-family:var(--font-mono);font-size:10px;width:24px;text-align:right;flex-shrink:0;}
/* 世界线分支树高对比重构，杜绝黑底黑字与文字看不清 */
.wt-node rect {
  fill: var(--panel2) !important;
  stroke: var(--line);
  stroke-width: 1.2px;
  rx: 8px;
  transition: .15s;
}
.wt-node:hover rect {
  stroke: var(--cyan);
}
.wt-node.cur rect {
  stroke: var(--cyan) !important;
  stroke-width: 2px !important;
  filter: drop-shadow(0 0 5px var(--cyanGlow));
}
.wt-node.key rect {
  stroke: var(--gold) !important;
  stroke-width: 1.8px;
}
.wt-node text {
  font-family: var(--font-body) !important;
  fill: var(--text) !important;
  pointer-events: none;
}
.wt-node .lbl {
  font-size: 8.5px !important;
  font-weight: 700;
  fill: var(--cyan) !important;
}
.wt-node .choice-txt {
  font-size: 9.5px !important;
  fill: var(--text) !important;
}
body.theme-light .wt-node rect {
  fill: #ffffff !important;
  stroke: #cbd5e2;
}
body.theme-light .wt-node .choice-txt {
  fill: #17202c !important;
}
/* 战甲工坊 */
.mk-line{stroke:var(--cyan);stroke-width:1.1;fill:none;opacity:.85;}
.mk-rot{animation:mkspin 9s ease-in-out infinite alternate;}
@keyframes mkspin{from{transform:rotateY(-16deg)}to{transform:rotateY(16deg)}}
@keyframes mkscan2{from{transform:translateY(-70px)}to{transform:translateY(70px)}}
@keyframes mkdmg{0%,100%{opacity:.2}50%{opacity:1}}
.mk-dmg{animation:mkdmg 1.6s infinite;}
.mk-card{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel2);margin-bottom:8px;cursor:pointer;transition:.15s;}
.mk-card.on{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(53,208,255,.18);}
.mk-card.lk{opacity:.45;filter:grayscale(.7);}
.mk-card .no{font-family:var(--font-en);font-style:italic;font-size:15px;font-weight:700;color:var(--cyan);}
.mk-wire{background:radial-gradient(circle at 50% 35%,rgba(53,208,255,.14),transparent 60%),#050a10;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;height:260px;display:flex;align-items:center;justify-content:center;perspective:520px;}
.tune-row{margin-bottom:11px;}
.tune-row label{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px;}
.tune-row input[type=range]{width:100%;accent-color:var(--cyan);}
/* 时间胶囊 / 策略草案 */
.cap-card{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:12px;background:var(--panel2);margin-bottom:9px;}
.cap-card.locked{filter:grayscale(.5);opacity:.7;}
/* 消息撤回 / 系统注记 */
.bub.recalled{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12px;font-style:italic;}
.chip.mini{font-size:9.5px;padding:2px 7px;}

/* ============================================================
   修复层：高对比提示 / HUD 可关闭 / 音色切换 / 预设入口
   ============================================================ */
.toast{background:var(--panel);color:var(--text);border-color:var(--cyan);font-weight:600;
  text-shadow:none;box-shadow:0 8px 30px rgba(0,0,0,.28),0 0 18px var(--cyanGlow);}
body.theme-light .toast{background:var(--panel);color:var(--text);border-color:var(--cyan);}
.banner{background:var(--panel);color:var(--text);border-color:var(--cyan);}
.banner b{color:var(--cyan);}
.banner div{color:var(--muted);}
body.theme-light .banner{background:var(--panel);border-color:var(--cyan);}
body.theme-light .banner b{color:var(--cyan);}
body.theme-light .banner div{color:var(--muted);}
/* modal：全屏底与文字由同一主题变量配对，杜绝黑底黑字；按钮继承高对比文字色 */
.so-modal{background:var(--panel);color:var(--text);}
.so-modal .card{color:var(--text);}
.so-modal .story{color:var(--text);}
.so-modal .hint{color:var(--muted);}
body.theme-light .so-modal .story{color:var(--text);}
.so-res-ok{background:rgba(79,208,138,.12);border:1px solid var(--green);color:var(--text);
  border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.7;margin-top:8px;word-break:break-all;}
/* HUD 胶囊：显式关闭按钮 */
.jhud-x{width:17px;height:17px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1;cursor:pointer;margin-left:1px;}
.jhud-x:hover,.jhud-x:active{color:#fff;background:var(--red);border-color:var(--red);}
body.theme-light .jhud-x{background:rgba(0,0,0,.06);}
/* 状态栏 HUD 显隐徽标 */
.sb-hud{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle,#eafcff,var(--cyan) 42%,#0a3b55 78%);border:1px solid var(--cyan);
  cursor:pointer;flex-shrink:0;box-shadow:0 0 8px var(--cyanGlow);position:relative;margin-right:1px;}
.sb-hud:active{transform:scale(.9);}
.sb-hud.off{background:var(--panel2);border-color:var(--line);box-shadow:none;filter:grayscale(.6);opacity:.8;}
.sb-hud.off::after{content:'✕';position:absolute;font-size:10px;color:var(--muted);line-height:1;}
/* 浮窗：音色选择 / 试听 / 隐藏 */
.jw-vrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 13px 0;}
.jw-vseg{display:inline-flex;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;}
.jw-vseg button{border:none;background:none;color:var(--muted);font-size:10px;padding:4px 9px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.jw-vseg button.on{background:var(--cyan);color:#04121a;font-weight:700;}
.jw-vinfo{font-size:9.5px;color:var(--muted);font-family:var(--font-mono);line-height:1.6;}
.jw-link{font-size:10px;color:var(--cyan);cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:3px 8px;background:var(--panel2);}
/* 预设：下拉入口 / 命名输入 / 计数 */
.s-pres-row{display:flex;gap:6px;align-items:center;margin-top:8px;}
.s-pres-row select,.s-pres-row input{flex:1;min-width:0;}
.s-pres-badge{font-size:10px;color:var(--cyan);font-family:var(--font-mono);white-space:nowrap;}
.s-pres-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.s-pres-list .chip{cursor:pointer;}
.s-pres-list .chip.active{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(53,208,255,.2);}
/* ============================================================
   V2 扩展层：术语粗体 / 今日简报 / 世界事件 / 周目对比 / 开机动画 / 语音输入
   ============================================================ */
/* 长剧情术语：粗体英文 + 中文括号翻译 */
.en-strong{font-family:var(--font-en);font-weight:800;font-style:normal;letter-spacing:.4px;color:var(--gold);
  text-shadow:0 0 12px rgba(245,185,66,.25);padding:0 1px;}
body.no-en-decor .en-strong{font-family:inherit;color:inherit;text-shadow:none;font-weight:700;}
.en-line .zh{white-space:nowrap;}
/* 短信：已读 / 正在输入 / 撤回 */
.read-tick{color:var(--cyan);font-size:9.5px;letter-spacing:.2px;}
.read-tick.pending{color:var(--muted);}
.typing-bub{display:inline-block;padding:8px 12px;border-radius:16px;border-bottom-left-radius:3px;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:13px;font-style:italic;}
.typing-bub i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin-right:3px;
  animation:typingDot 1.1s infinite;}
.typing-bub i:nth-child(2){animation-delay:.18s}.typing-bub i:nth-child(3){animation-delay:.36s}
@keyframes typingDot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.bubwrap .action-bar .restr{cursor:pointer;border-bottom:1px dashed var(--muted);}
/* 语音输入按钮 + 降级提示 */
.mic{flex:0 0 38px!important;width:38px;padding:0!important;border:1px solid var(--line);
  background:var(--panel2);color:var(--cyan);border-radius:50%!important;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.18s;}
.mic.on{background:var(--red);border-color:var(--red);color:#fff;animation:micPulse 1s infinite;}
.mic.unsupported{opacity:.5;filter:grayscale(.6);}
/* 提升优先级：覆盖 .composer button / .row>* 的默认按钮与伸缩样式 */
.composer .mic,.row .mic{flex:0 0 38px!important;width:38px;padding:0!important;
  border-radius:50%!important;background:var(--panel2)!important;border:1px solid var(--line)!important;
  color:var(--cyan)!important;font-weight:400;}
.composer .mic.on,.row .mic.on{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important;}
/* 未解锁皮肤 */
.skin-card.locked{opacity:.55;filter:grayscale(.65);}
.skin-card.locked .sn{color:var(--muted);}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(226,54,54,.55)}50%{box-shadow:0 0 0 6px rgba(226,54,54,0)}}
.voice-fallback{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px;}
.voice-fallback b{color:var(--gold);}
/* 今日简报 */
.br-hero{background:linear-gradient(135deg,rgba(53,208,255,.13),rgba(245,185,66,.08));
  border:1px solid var(--cyan);border-radius:16px;padding:14px;margin-bottom:12px;}
.br-hero .dt{font-family:var(--font-en);font-style:italic;letter-spacing:2px;font-size:11px;color:var(--cyan);}
.br-hero h2{font-family:var(--font-serif);font-size:17px;margin:5px 0 6px;}
.br-hero .sm{font-size:11.5px;color:var(--muted);line-height:1.7;}
.br-kpi{display:flex;gap:8px;margin-top:10px;}
.br-kpi div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;}
.br-kpi b{display:block;font-family:var(--font-en);font-size:19px;color:var(--gold);}
.br-kpi span{font-size:10px;color:var(--muted);}
.br-sec{margin-bottom:12px;}
.br-sec>h3{margin:0 0 8px;font-size:13px;color:var(--gold);font-family:var(--font-serif);letter-spacing:.5px;display:flex;justify-content:space-between;}
.br-item{display:flex;gap:9px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--cyan);border-radius:11px;padding:10px 11px;margin-bottom:7px;cursor:pointer;transition:.15s;}
.br-item:active{transform:scale(.99);border-color:var(--cyan);}
.br-item .bi{font-size:17px;flex:0 0 22px;text-align:center;}
.br-item .bt{flex:1;min-width:0;}
.br-item .bt b{display:block;font-size:12.5px;font-weight:650;line-height:1.45;}
.br-item .bt span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.55;}
.br-item .bg{font-size:10px;color:var(--cyan);flex:0 0 auto;align-self:center;}
.br-item.done{opacity:.55;border-left-color:var(--green);}
.br-item.gold{border-left-color:var(--gold);}
.br-tag{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:7px;background:rgba(53,208,255,.14);color:var(--cyan);margin-right:4px;}
.br-tag.gold{background:rgba(245,185,66,.16);color:var(--gold);}
.br-tag.red{background:rgba(226,54,54,.16);color:var(--red);}
/* 世界事件引擎配置行 */
.ev-row{display:flex;gap:8px;align-items:center;margin-top:8px;}
.ev-row select{flex:1;}
.ev-log{font-size:11px;color:var(--muted);line-height:1.75;}
.ev-log b{color:var(--cyan);}
/* 里程碑卡片 */
.ms-card{border:1px solid var(--gold);background:linear-gradient(135deg,rgba(245,185,66,.1),transparent);
  border-radius:14px;padding:13px;margin-bottom:10px;}
.ms-card .lv{font-family:var(--font-en);font-style:italic;letter-spacing:2px;color:var(--gold);font-size:11px;}
.ms-card h3{font-family:var(--font-serif);font-size:15px;margin:5px 0;}
/* 周目对比 */
.cmp-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.cmp-pick select{width:100%;}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.cmp-col{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
.cmp-col.a{border-top:3px solid var(--cyan);}
.cmp-col.b{border-top:3px solid var(--gold);}
.cmp-col h4{margin:0 0 8px;font-size:12.5px;color:var(--cyan);font-family:var(--font-serif);word-break:break-all;}
.cmp-col.b h4{color:var(--gold);}
.cmp-line{display:flex;justify-content:space-between;gap:5px;font-size:11px;padding:5px 0;border-bottom:1px dashed var(--line);}
.cmp-line:last-child{border-bottom:none;}
.cmp-line span{color:var(--muted);flex:0 0 auto;}
.cmp-line b{font-family:var(--font-en);text-align:right;word-break:break-all;}
.cmp-bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:3px 0 7px;}
.cmp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));}
.cmp-delta{font-size:10px;padding:1px 5px;border-radius:6px;background:rgba(53,208,255,.14);color:var(--cyan);}
.cmp-delta.plus{background:rgba(226,54,54,.14);color:var(--red);}
.cmp-delta.minus{background:rgba(79,208,138,.14);color:var(--green);}
.cmp-choices{font-size:11px;color:var(--muted);line-height:1.75;margin-top:7px;word-break:break-all;}
.cmp-choices b{color:var(--text);}
/* 开机剧情解锁动画 */
.bootfx{position:fixed;inset:0;z-index:1200;background:radial-gradient(circle at 50% 42%,#0b2233,#03070c 68%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#eaf4ff;
  animation:bootIn .5s ease both;}
@keyframes bootIn{from{opacity:0}to{opacity:1}}
.bootfx .rr3{width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle,#eafcff 0%,var(--cyan) 28%,#0a3b55 68%,#06141c 100%);
  box-shadow:0 0 70px var(--cyanGlow),inset 0 0 26px rgba(255,255,255,.6);animation:bootPulse 1.7s ease-in-out infinite;}
@keyframes bootPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.09);filter:brightness(1.35)}}
.bootfx .bt{font-family:var(--font-en);font-style:italic;letter-spacing:4px;font-size:17px;color:var(--cyan);}
.bootfx .bs{font-family:var(--font-serif);font-size:13.5px;letter-spacing:1px;color:#f5b942;min-height:22px;}
.bootfx .bx{font-size:11px;color:#7c8da0;letter-spacing:2px;font-family:var(--font-en);}
.bootfx .bl{width:180px;height:2px;background:rgba(53,208,255,.2);border-radius:2px;overflow:hidden;}
.bootfx .bl i{display:block;height:100%;width:0;background:var(--cyan);animation:bootLoad 2.9s linear forwards;}
@keyframes bootLoad{to{width:100%}}
.bootfx.out{animation:bootOut .6s ease forwards;}
@keyframes bootOut{to{opacity:0;visibility:hidden}}
/* 隐藏图标（高好感彩蛋） */
.icon.secret span{border-color:var(--gold);box-shadow:0 0 18px rgba(245,185,66,.4),inset 0 1px 0 rgba(255,255,255,.06);}
.icon.secret svg{stroke:var(--gold);}
.icon.secret label{color:var(--gold);}
/* 里程碑剧本标签 */
.ms-quest{border-left:3px solid var(--gold)!important;}
/* 关系网 · 以玩家为中心的雷达图 */
.rel-radar{position:relative;width:100%;height:340px;margin:4px 0 8px;}
.rel-radar svg{width:100%;height:100%;overflow:visible;}
.rel-node{cursor:pointer;}
.rel-node circle{transition:.15s;}
.rel-node:active circle{transform:scale(.92);}
.rel-node text{font-family:var(--font-body);fill:var(--text);pointer-events:none;}
.rel-center circle{fill:url(#relCore);stroke:var(--cyan);stroke-width:2;}
.rel-center text{fill:#04121a;font-weight:800;font-family:var(--font-en);}
.rel-line{stroke-linecap:round;transition:.15s;}
.rel-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:9px;
  background:rgba(53,208,255,.12);color:var(--cyan);border:1px solid var(--line);}
.rel-chip.none{background:var(--panel2);color:var(--muted);}
.rel-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;cursor:pointer;transition:.15s;}
.rel-card:active{border-color:var(--cyan);}
.rel-card .rh{display:flex;align-items:center;gap:10px;}
.rel-card .rbar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:7px;}
.rel-card .rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));}
.rel-preset{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;}
/* ============================================================
   开场统一晨光色系 · 开局说明（全屏）/ 逐 App 真实界面截图 / 预加载反应堆
   ============================================================ */
body.booting{background:linear-gradient(168deg,#fff8ed 0%,#ffe9cf 46%,#f1c9a4 100%) !important;}
body.guide-open{background:
  radial-gradient(circle at 20% 10%,#fffaf0 0%,transparent 46%),
  radial-gradient(circle at 84% 86%,rgba(226,161,132,.34) 0%,transparent 48%),
  linear-gradient(165deg,#fff6e9 0%,#ffe9cf 44%,#f4d2b1 100%) !important;}

/* ---------- 开局说明：全屏晨光，手机界面以外不再有底色割裂 ---------- */
#guideLayer.onboard-layer{position:fixed;inset:0;z-index:950;display:flex;
  align-items:flex-start;justify-content:center;padding:0;overflow-y:auto;overflow-x:hidden;
  background:
    radial-gradient(circle at 16% 8%,rgba(255,255,255,.94) 0%,transparent 42%),
    radial-gradient(circle at 86% 14%,rgba(255,214,168,.72) 0%,transparent 40%),
    radial-gradient(circle at 8% 92%,rgba(195,220,223,.55) 0%,transparent 44%),
    radial-gradient(circle at 92% 88%,rgba(226,161,132,.4) 0%,transparent 42%),
    linear-gradient(168deg,#fff8ed 0%,#ffeed9 38%,#f8dabb 72%,#f1c9a4 100%);
  backdrop-filter:none;}
#guideLayer::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;
  background-image:repeating-linear-gradient(0deg,transparent 0 46px,#e6cdae 46px 47px),
                   repeating-linear-gradient(90deg,transparent 0 46px,#e6cdae 46px 47px);
  -webkit-mask-image:radial-gradient(ellipse at 50% 28%,#000,transparent 78%);
  mask-image:radial-gradient(ellipse at 50% 28%,#000,transparent 78%);}
#guideLayer::after{content:"";position:fixed;left:50%;top:46%;width:min(90vw,720px);height:min(90vw,720px);
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:.28;
  border:1px solid rgba(189,131,44,.32);
  box-shadow:0 0 0 40px rgba(255,255,255,.12),0 0 0 82px rgba(255,255,255,.08),0 0 0 124px rgba(255,255,255,.05);}
#guideLayer .ob-card{position:relative;z-index:2;width:100%;max-width:none;max-height:none;min-height:100%;
  overflow:visible;background:transparent;border:0;border-radius:0;box-shadow:none;
  color:var(--dawn-ink);padding:0;display:block;}
#guideLayer .gd-sheet{width:min(100%,736px);margin:0 auto;padding:24px 20px 46px;}
#guideLayer .ob-head{text-align:center;margin:0 0 16px;padding:6px 0 12px;position:relative;}
#guideLayer .ob-head::after{content:"";display:block;width:92px;height:1px;margin:12px auto 0;
  background:linear-gradient(90deg,transparent,var(--dawn-gold2),transparent);}
#guideLayer .ob-head .rr{width:46px;height:46px;margin:0 auto 9px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fffdf5,#ffe3a6 34%,#e2a85f 68%,#b9752f 100%);
  box-shadow:0 0 0 5px rgba(255,255,255,.6),0 0 28px rgba(224,168,84,.62);}
#guideLayer .ob-head h2{color:var(--dawn-ink) !important;letter-spacing:2.4px;font-size:19px;margin:0;}
#guideLayer .ob-head p{color:var(--dawn-ink3) !important;letter-spacing:1.5px;margin:5px 0 0;}
#guideLayer .gd-sec{margin-bottom:14px;}
#guideLayer .gd-sec h3{color:var(--dawn-gold) !important;font-size:13.5px;letter-spacing:.6px;margin:0 0 8px;}
#guideLayer .gd-mini{color:var(--dawn-gold) !important;font-size:12.5px;letter-spacing:.5px;margin:0 0 8px;
  font-family:var(--font-serif);font-weight:700;}
#guideLayer .gd-note{background:var(--dawn-panel) !important;border:1px solid var(--dawn-line) !important;
  color:var(--dawn-ink) !important;font-size:12.5px;line-height:2;box-shadow:0 3px 14px rgba(160,110,60,.07);}
#guideLayer .gd-note b,#guideLayer .gd-shot-note b{color:var(--dawn-gold);}
#guideLayer .gd-hint{color:var(--dawn-ink2) !important;font-size:12.5px;line-height:2.05;}
#guideLayer .gd-hint b{color:var(--dawn-ink) !important;}
#guideLayer .gd-item{background:var(--dawn-panel) !important;border:1px solid var(--dawn-line) !important;
  color:var(--dawn-ink2) !important;font-size:11px;}
#guideLayer .gd-item b{color:var(--dawn-gold) !important;}
#guideLayer .step-dots{margin-bottom:16px;}
#guideLayer .step-dots i{background:rgba(189,131,44,.22);width:24px;height:4px;}
#guideLayer .step-dots i.on{background:var(--dawn-gold);}
#guideLayer .chip{background:rgba(255,255,255,.72);border:1px solid var(--dawn-line);color:var(--dawn-ink2);}
#guideLayer .tag{background:rgba(226,176,99,.22);border-color:rgba(189,131,44,.35);color:var(--dawn-gold);}
#guideLayer .hint{color:var(--dawn-ink3) !important;}
#guideLayer .btn.ghost{background:rgba(255,255,255,.72);border:1px solid var(--dawn-line);color:var(--dawn-ink2);}
#guideLayer .btn{background:linear-gradient(135deg,#e2b063,#bd832c);color:#fff;border-color:transparent;}
/* ---------- 校时 / 开局（时间线 + 身份填写）· 统一晨光底，字色适配 ---------- */
#onboardLayer.onboard-layer{
  background:
    radial-gradient(circle at 16% 8%,rgba(255,255,255,.92) 0%,transparent 42%),
    radial-gradient(circle at 86% 14%,rgba(255,214,168,.64) 0%,transparent 42%),
    radial-gradient(circle at 8% 92%,rgba(195,220,223,.5) 0%,transparent 44%),
    linear-gradient(168deg,#fff8ed 0%,#ffeed9 40%,#f6d3b0 100%);
  backdrop-filter:none;
}
#onboardLayer .ob-card{
  background:linear-gradient(170deg,#fffaf2,#f6e6cf) !important;
  border:1px solid var(--dawn-line) !important;
  box-shadow:0 0 60px rgba(160,110,60,.2) !important;
  color:var(--dawn-ink);
}
#onboardLayer .ob-head h2{color:var(--dawn-ink) !important;letter-spacing:2.2px;}
#onboardLayer .ob-head p{color:var(--dawn-ink3) !important;}
#onboardLayer .ob-head .rr{
  background:radial-gradient(circle at 38% 32%,#fffdf5,#ffe3a6 34%,#e2a85f 68%,#b9752f 100%) !important;
  box-shadow:0 0 0 5px rgba(255,255,255,.6),0 0 26px rgba(224,168,84,.6) !important;}
#onboardLayer .ob-sec>.lb{color:var(--dawn-gold) !important;}
#onboardLayer .card{background:var(--dawn-panel) !important;border-color:var(--dawn-line) !important;color:var(--dawn-ink);}
#onboardLayer .card h3{color:var(--dawn-gold) !important;}
#onboardLayer .era-card{background:var(--dawn-panel) !important;border-color:var(--dawn-line) !important;}
#onboardLayer .era-card.on{border-color:var(--dawn-gold) !important;background:rgba(226,176,99,.16) !important;}
#onboardLayer .era-card .t{color:var(--dawn-ink) !important;}

@keyframes arCoreIn{0%{opacity:0;transform:scale(.42)}62%{opacity:1;transform:scale(1.13)}100%{opacity:1;transform:scale(1)}}
@keyframes arCorePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.075)}}

.bi-title{font-family:var(--font-en);font-style:italic;letter-spacing:8px;font-size:24px;font-weight:700;

  .bi-svg .ar-rot,.bi-rays,.bi-aura,.bi-svg .ar-wave,.bi-svg .ar-core-wrap,.bi-svg .ar-halo{animation:none}
}

/* ============================================================
   STARK OS

   内置 22 个 App 与完整可操作按钮，覆盖通讯、情报、剧情与日常场景。

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2300);}
/* 文本美化：*强调* + 托尼对白格式 *"English"*（中文） + 裸英文引号。
   注意：esc 会把 " 和 ' 转成实体，需先还原再匹配英文，否则英文无法套用 .en 样式。 */
/* 文本美化：*强调* + 托尼对白格式 *"English"*（中文） + 裸英文引号
   + V2：粗体英文术语 **Worldline**（世界线）→ 粗体英文 + 中文括号翻译。
   注意：esc 会把 " 和 ' 转成实体，需先还原再匹配英文，否则英文无法套用 .en 样式。 */
function fmt(t){
  let s=esc(t).replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  // ① 粗体英文术语（带中文括号译文）——必须先于单星号规则处理，避免被 *...* 吞掉
  s=s.replace(/\*\*([A-Za-z][A-Za-z0-9 .'\-&]{1,60})\*\*[（(]([^）)]+)[）)]/g,
    '<span class="en-line"><strong class="en-strong">$1</strong><span class="zh">（$2）</span></span>');
  s=s.replace(/\*\*([A-Za-z][A-Za-z0-9 .'\-&]{1,60})\*\*/g,'<strong class="en-strong">$1</strong>');
  // ② 原有：英文对白 + 强调 + 裸英文引号
  s=s.replace(/\*"([^"]+)"\*[（(]([^）)]+)[）)]/g,'<span class="en-line"><span class="en">"$1"</span><span class="zh">（$2）</span></span>');
  s=s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  s=s.replace(/(^|[\s>])"([A-Za-z][A-Za-z0-9 ,.'!?\-:]{2,160})"/g,'$1<span class="en">"$2"</span>');
  return s;
}
/* 长剧情对话统一术语表：粗体英文 + 中文括号翻译。
   每篇文本每个术语只美化首次出现，其余保持中文，避免括号内翻译堆叠影响阅读。
   已写成 **English**（中文）的文本不会重复处理。 */
const STORY_GLOSS=[
  ['世界线','Worldline'],['约饭','Dinner Date'],['时间跳跃','Time Jump'],
  ['时间胶囊','Time Capsule'],['分支树','Branch Tree'],['小剧场','One-Act Play'],
  ['好感度','Affinity'],['实验室物品','Lab Item'],['深夜消息','Late-Night Message'],
  ['平行存档','Parallel Save']
];
function fmtStory(t){
  let s=String(t??'');
  const holds=[];
  const hold=x=>{const k='\u0001'+holds.length+'\u0002';holds.push(x);return k;};
  STORY_GLOSS.forEach(([zh,enW])=>{
    if(s.indexOf('**'+enW+'**')>=0)return;
    const i=s.indexOf(zh);
    if(i<0)return;
    s=s.slice(0,i)+hold('**'+enW+'**（'+zh+'）')+s.slice(i+zh.length);
  });
  let out=fmt(s);
  holds.forEach((h,i)=>{out=out.replace('\u0001'+i+'\u0002',fmt(h));});
  return out;
}
function en(s){return '<span class="en">'+esc(s)+'</span>';}
function nowTime(){
  const f = flags();
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  // 显示格式：设定年份/月/日 时:分，例如 "2008/05/29 14:30"
  return `${f.year}/${mm}/${dd} ${hh}:${min}`;
}
// 短信专用的剧情时间戳：严格带上设定年份，如 "08年 11/20 09:41"
function storyMsgTime(){
  const f = flags();
  const d = new Date();
  const yr = f.year; // 严格输出 2007、2008、2012 等纯数字年份
  const mm = String(d.getMonth() + 1).padStart(2, '0');

  const hh = String(d.getHours()).padStart(2, '0');

}

function worldDate(){const f=flags();const d=new Date();return f.year+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';}
let clockReady=false;
function realClockText(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function syncClock(){
  const el=$('#clock');if(!el)return false;
  const t=realClockText();el.textContent=t;
  try{el.dataset.real=t;}catch(e){}
  clockReady=true;return true;
}
function clockMatchesReality(){
  const el=$('#clock');if(!el||!clockReady)return false;
  const t=realClockText();
  return el.textContent===t&&(!el.dataset||el.dataset.real===undefined||el.dataset.real===t);
}

/* ---------- 世界状态（事件按公元年推导，时间跳跃后自动生效） ---------- */
function flags(){
  const s=store.state()||{};const e=WORLD.eras.find(x=>x.id===s.era)||WORLD.eras[2];
  const year=s.customYear||e.year;
  const ultronAfter=(s.ultronPhase||(e.flags.ultron?'after':'before'))==='after';
  return {
    era:e,year,tonyAge:year-WORLD.tonyBirthYear,
    avengers1:!!(year>=2012||e.flags.avengers1||s.forceAvengers1),
    ultronAfter,
    civilWar:!!(year>=2016||e.flags.civilWar),
    snap:!!(year>=2018||e.flags.snap),
    pepperExists:s.pepperExists!==false,
    visionExists:ultronAfter,fridayExists:ultronAfter,
    groupUnlocked:!!(year>=2012||e.flags.avengers1||s.forceAvengers1),
  };
}
function tonyAgeAt(year){return year-WORLD.tonyBirthYear;}
function eraName(){const f=flags();return f.era.name+(store.state()?.customYear?'（自定义 '+f.year+'）':'');}
function castText(name){
  const c=WORLD.cast[name];if(!c)return '';
  return `【角色卡 · ${name} / ${c.en}】身份：${c.role}\n语气：${c.voice}\n禁忌：${c.taboo}`;
}
function isAI(name){return ['贾维斯','星期五','幻视'].includes(name);}

function userAgeNow(){
  const p = store.profile() || {};
  const s = store.state() || {};
  const e = WORLD.eras.find(x => x.id === s.era) || WORLD.eras[2];
  const curY = s.customYear || e.year;
  const startY = s.startYear || e.year;
  const baseAge = +(p.currentAge || p.startAge || 0);
  if(!baseAge) return p.startAge || '—';
  // 随着时间线跳跃或年份推进自动累加年龄差
  return baseAge + (curY - startY);
}

/* ============================================================
   AI 调用层（无 Key / 失败时自动降级为本地预置内容）
   分栏配置：text 文本 / image 生图 / summary 总结（缺省回落 text）
   ============================================================ */
function apiCfg(kind){
  kind=kind||'text';
  const c=store.cfg();
  const t={baseUrl:(c.text&&c.text.baseUrl)||'',apiKey:(c.text&&c.text.apiKey)||'',model:(c.text&&c.text.model)||'',temperature:(c.text&&c.text).temperature};
  if(kind==='text')return t;
  const s=c[kind]||{};
  let r={baseUrl:s.baseUrl||'',apiKey:s.apiKey||'',model:s.model||''};
  if(!r.apiKey)r={baseUrl:r.baseUrl||t.baseUrl,apiKey:t.apiKey,model:r.model};
  return r;
}
async function callAI(messages,system,kind){
  const c=apiCfg(kind||'text');
  if(!c.apiKey) throw new Error('未配置 API Key，请至「设置」中检查');
 const url=(c.baseUrl||'').replace(/\/+$/,'')+'/chat/completions';

// 长篇场景（世界线 / 约饭）放宽 token 上限，避免正文被掐断触发兜底
const isLong=/世界线深度文学模式|3000~4000|300~500 字|400~700/.test(system||'');
const body={
  model:c.model,
  messages:[{role:'system',content:system},...messages.filter(m=>m.content&&String(m.content).trim())],
  max_tokens: isLong ? 8192 : 4096
};
  
  if((kind||'text')==='text'){
    const t=parseFloat(c.temperature);
    if(!isNaN(t)) body.temperature=t;
  }

  // 针对长篇世界线剧情，将超时大幅延展至 180 秒（3 分钟），防止生成到一半被掐断触发兜底
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(), 180000);

  try{
    const r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.apiKey},
      body:JSON.stringify(body),
      signal:ctrl.signal
    });
    clearTimeout(to);
    if(!r.ok){
      const tx=await r.text().catch(()=>'');
      throw new Error(`API 报错 ${r.status}: ${tx.slice(0,180)}`);
    }
    const d=await r.json();
    const content = d.choices?.[0]?.message?.content;
    if(!content) throw new Error('API 成功返回，但内容为空');
    return content.trim();
  }catch(e){
    clearTimeout(to);
    if(e.name==='AbortError') throw new Error('长文本生成耗时超过 180 秒被截断，请检查网络或更换更快的模型');
    if(/load failed|failed to fetch/i.test(e.message)) throw new Error('网络连接中断或中转站未开启跨域（CORS）');
    throw e;
  }
}
async function ai(messages,system,fallback,kind){
  const fb=()=>typeof fallback==='function'?fallback():(fallback||'');
  if(!apiCfg(kind||'text').apiKey){
    toast('未检测到 API Key，正在呈现本地预设内容');
    return fb();
  }
  try{
    const r=await callAI(messages,system,kind);
    return r || fb();
  }catch(e){
    // 将真实错误直接吐在界面上（如 401 密钥失效、超时、或者 CORS 拦截），不再盲目兜底
    console.error('AI Call Error:', e);
    toast('⚠️ ' + e.message);
    return fb();
  }
}
async function fetchModels(kind){
  const c=apiCfg(kind||'text');
  if(!c.apiKey)throw new Error('未配置 API Key');
  const r=await fetch((c.baseUrl||'').replace(/\/+$/,'')+'/models',{headers:{'Authorization':'Bearer '+c.apiKey}});
  if(!r.ok)throw new Error('拉取失败 '+r.status);const d=await r.json();return (d.data||[]).map(m=>m.id).sort();
}
async function genImage(prompt){
  const c=apiCfg('image');const url=(c.baseUrl||'').replace(/\/+$/,'')+'/images/generations';
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.apiKey},body:JSON.stringify({model:c.model||'dall-e-3',prompt,n:1,size:'1024x1024'})});
  if(!r.ok)throw new Error('生图 '+r.status);const d=await r.json();const it=d.data[0];
  if(it.url)return it.url;if(it.b64_json)return 'data:image/png;base64,'+it.b64_json;
  throw new Error('图片解析失败');
}

function needGuide(){return !store.get('guideSeenV2',false);}
function showGuide(force){
  guideState={step:1,force:!!force};
  document.body.classList.add('guide-open');
  /* 音乐 App 的 render 需等 IndexedDB，先离屏渲染一次，翻到该页时真实界面已就绪 */

function hideGuide(){
  $('#guideLayer').style.display='none';
  document.body.classList.remove('guide-open');
  store.set('guideSeenV2',true);
  if(guideState.force)return;          // 从设置里回看：关闭后直接回到当前界面
  if(needOnboard()||store.get('alwaysOnboard',false))showOnboard(!needOnboard());
  else{goHome();setTimeout(showBriefingBanner,700);}
}
function guideGoTo(step){guideState.step=Math.max(1,Math.min(GUIDE_PAGES.length,step));renderGuide();}

/* 只读化：给所有 id 加 App 前缀，去掉内联事件与脚本，避免和引导层 / 真实 DOM 冲突 */
function guideShotSanitize(html,id){
  const p='gs-'+id+'-';
  return String(html||'')
    .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'')
    .replace(/\son[a-z]+="[^"]*"/gi,'').replace(/\son[a-z]+='[^']*'/gi,'')
    .replace(/\bid="([^"]*)"/g,(m,x)=>'id="'+p+x+'"')
    .replace(/\bid='([^']*)'/g,(m,x)=>"id='"+p+x+"'")
    .replace(/\bfor="([^"]*)"/g,(m,x)=>'for="'+p+x+'"')
    .replace(/\baria-controls="([^"]*)"/g,(m,x)=>'aria-controls="'+p+x+'"');
}
/* 异步 render 完成后，把真实界面回填到当前正在看的那一页 */
function guideShotPaint(id){
  const page=GUIDE_PAGES[guideState.step-1];
  if(!page||page.kind!=='app'||page.id!==id)return;
  const box=document.querySelector('#gdShotBody');
  if(!box)return;
  box.innerHTML=GUIDE_SHOTS[id].html||'';
  if(typeof guideFitShot==='function')guideFitShot();
}
function guideFitShot(){
  const vp=$('#gdShotViewport'),cv=$('#gdShotCanvas');
  if(!vp||!cv)return;
  const w=vp.clientWidth||330;
  const s=Math.min(1,w/392);
  cv.style.width='392px';
  cv.style.transform='scale('+s+')';
}
function guideShot(id){
  if(GUIDE_SHOTS[id]&&GUIDE_SHOTS[id].ok)return GUIDE_SHOTS[id];
  const a=apps[id];
  const shot={title:(a&&a.title)||'',html:'',ok:false,err:''};
  GUIDE_SHOTS[id]=shot;
  if(!a){shot.err='App 未注册';return shot;}
  const host=document.createElement('div');
  host.setAttribute('aria-hidden','true');
  host.style.cssText='position:fixed;left:-20000px;top:0;width:392px;height:900px;overflow:hidden;pointer-events:none;';
  const v=document.createElement('div');v.className='body';
  host.appendChild(v);
  if(document.body&&document.body.appendChild)document.body.appendChild(host);

  /* 有些 render 会操作全局 appbar（actBtn / appTitle），渲染前后完整还原 */
  const guards=['#actBtn','#backBtn','#appTitle'].map(s=>$(s)).filter(Boolean).map(el=>({
    el,display:el.style.display,text:el.textContent,onclick:el.onclick
  }));
  const keys=['state','profile','set','setState','setProfile','setContacts','setChats','setPosts','posts'];
  const prev={};keys.forEach(k=>{prev[k]=store[k];});
  /* 离屏只读视图：新玩家用临时演示档；老玩家用真实存档的浅拷贝。
     两种情况都禁用一切写入，绝不改动真实存档，也不会触发 AI 生成或联网。 */
  let viewState=null,viewProfile=null;
  if(needOnboard()){
    viewState=guideDemoState();viewProfile=guideDemoProfile();
  }else{
    const rs=store.state(),rp=store.profile();
    viewState=rs?{...rs}:null;viewProfile=rp?{...rp}:null;
    if(id==='worldline'&&viewState&&!viewState.story){
      const d=guideDemoState();
      viewState.story=d.story;viewState.options=d.options;
      if(!viewState.history)viewState.history=[];
    }
  }
  if(viewState){
    store.state=()=>viewState;store.profile=()=>viewProfile;
    const noop=()=>{};
    ['set','setState','setProfile','setContacts','setChats','setPosts'].forEach(k=>{store[k]=noop;});
  }
  const feed=GUIDE_FEED_DEMO[id];
  if(feed){
    let real={};try{real=prev.posts.call(store)||{};}catch(e){real={};}
    if(!((real[id]||[]).length))store.posts=()=>({...real,[id]:feed});
  }
  const restore=()=>{
    keys.forEach(k=>{store[k]=prev[k];});
    guards.forEach(g=>{g.el.style.display=g.display;g.el.textContent=g.text;g.el.onclick=g.onclick;});
    if(host.parentNode)host.parentNode.removeChild(host);
  };
  const capture=()=>{
    const raw=v.innerHTML||'';
    if(raw.length<40)return;
    shot.html=guideShotSanitize(raw,id);shot.ok=true;
    guideShotPaint(id);
  };
  let r=null;
  try{r=a.render(v);}catch(e){shot.err=String((e&&e.message)||e);}
  capture();                                  // 绝大多数 App 同步渲染
  restore();                                  // 同步还原，杜绝连续翻页时的状态交错污染
  if(r&&typeof r.then==='function')r.then(()=>{capture();},()=>{});  // 异步 render 落地后再抓一次
  return shot;
}

  const headTitle=page.kind==='app'?`${page.icon} ${esc(page.label)}`:({intro:'OPERATOR\'S BRIEFING',calibrate:'TIMELINE CALIBRATION',index:'APP DIRECTORY',rules:'WORLD RULES'}[page.kind]||'OPERATOR\'S BRIEFING');
  l.innerHTML=`<div class="ob-card"><div class="gd-sheet">
    <div class="ob-head"><div class="rr"></div><h2>${headTitle}</h2><p>STARK OS · 操作与内容说明 · ${s} / ${total}</p></div>
    ${dots}
    <div class="gd-sheet-body">${h}</div>
    <div class="gd-foot"><button class="btn ghost" id="gd_skip">跳过说明</button><button class="btn ghost sm" id="gd_prev" style="flex:0 0 62px" ${s===1?'disabled':''}>←</button><button class="btn" id="gd_next">${s===total?'⚡ 进入 STARK OS':'下一个 →'}</button></div>

    <p class="hint" style="text-align:center;margin:9px 0 0">${en('Read it, or skip it. Your call.')} · 之后可在「设置」里重看</p>
  </div></div>`;
  const q=x=>l.querySelector(x);
  q('#gd_skip').onclick=hideGuide;
  q('#gd_next').onclick=()=>{if(s<total)guideGoTo(s+1);else hideGuide();};
  const pv=q('#gd_prev');if(pv)pv.onclick=()=>guideGoTo(s-1);
  l.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>guideGoTo(+el.dataset.goto));
  const gp=q('#gd_preview');if(gp)gp.onclick=()=>guidePreview(page.id);
  guideFitShot();
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(guideFitShot);
}

    if(a)a.disabled=gridPage<=0;if(b)b.disabled=gridPage>=pages.length-1;
  };
  const go=p=>{
    gridPage=Math.max(0,Math.min(pages.length-1,p));
    try{grid.scrollTo({left:gridPage*pageW(),behavior:'smooth'});}
    catch(e){grid.scrollLeft=gridPage*pageW();}
    paintDots();
  };
  if(dots){
    const nav=(d,dis)=>`<button class="gd-nav" data-nav="${d}" ${dis?'disabled':''} aria-label="${d<0?'上一屏':'下一屏'}">${d<0?'‹':'›'}</button>`;
    dots.innerHTML=nav(-1,gridPage<=0)+
      pages.map((_,i)=>`<i data-p="${i}" class="${i===gridPage?'on':''}" title="第 ${i+1} 屏"></i>`).join('')+
      nav(1,gridPage>=pages.length-1);
    dots.onclick=e=>{
      const d=e.target.closest('[data-nav]');
      if(d){go(gridPage+Number(d.dataset.nav));return;}
      const p=e.target.closest('i[data-p]');if(p)go(+p.dataset.p);
    };
  }
  const sw=$('#gridSwipe');if(sw)sw.style.display=pages.length>1?'':'none';
  /* 事件用 on* 覆盖式绑定：每次重渲染都刷新闭包，页数变化后依然正确 */
  grid.onscroll=()=>{
    if(grid._restoring)return;
    // 平滑滚动 / 惯性滑动期间防抖，停下后再据实际位置定页，避免指示点来回跳
    clearTimeout(grid._scrollT);
    grid._scrollT=setTimeout(()=>{
      const p=Math.round(grid.scrollLeft/pageW());
      if(p===gridPage||p<0||p>=pages.length)return;
      gridPage=p;paintDots();
    },120);
  };
  grid.onwheel=e=>{
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
    const now=Date.now();
    if(grid._wheelAt&&now-grid._wheelAt<520)return;
    grid._wheelAt=now;go(gridPage+(e.deltaY>0?1:-1));
  };
  grid.onpointerdown=e=>{
    if(e.pointerType==='touch')return;   // 触摸交给原生 scroll-snap
    grid._drag={x:e.clientX,left:grid.scrollLeft,moved:false};
  };
  if(!window._gridDragBound){
    window._gridDragBound=true;
    window.addEventListener('pointermove',e=>{
      const g=$('#grid'),d=g&&g._drag;if(!d)return;
      const dx=e.clientX-d.x;if(Math.abs(dx)>5)d.moved=true;
      g.scrollLeft=d.left-dx;
    },{passive:true});
    window.addEventListener('pointerup',()=>{
      const g=$('#grid'),d=g&&g._drag;if(!d)return;
      g._suppressClick=d.moved;g._drag=null;
      if(g._suppressClick)setTimeout(()=>{g._suppressClick=false;},90);
    });
  }
  try{grid._restoring=true;grid.scrollLeft=gridPage*pageW();}catch(e){}
  setTimeout(()=>{grid._restoring=false;},80);
  paintDots();
  // 高好感 HUD 问候语：桌面副标题随好感档位变化
  const sub=$('.hud-sub');
  if(sub){const g=hudGreeting();sub.textContent=(g.tier.key==='t1')?'IRON MAN WORLD SIMULATOR':g.tier.en.toUpperCase()+' · '+g.tier.name;}
}

/* 说明 / 校时浮层：任何导航都先收起，避免残留遮罩挡住界面 */
function hideLayers(){
  ['#guideLayer','#onboardLayer'].forEach(s=>{const e=$(s);if(e&&e.style.display!=='none')e.style.display='none';});
  if(!window.__guidePreview)document.body.classList.remove('guide-open');

function openApp(id) {
  closeModals();
  closeSkinPanel();
  hideLayers();
  if(Math.random()<.3)FX.glitch();

  if (!apps[id]) return toast('该应用尚未就绪');
  if (id !== 'settings' && id !== 'appearance' && needOnboard() && !window.__guidePreview) {
    showOnboard();
    return;
  }
  
  // 清理 appBody 的事件与残留内容，避免内容闪烁叠加
  const body = $('#appBody');
  body.scrollTop = 0;
  body.innerHTML = '';

  currentApp = id;
  $('#home').classList.remove('active');
  $('#view').classList.add('active');
  $('#appTitle').textContent = apps[id].title;
  
  const a = $('#actBtn');
  a.style.display = 'none';
  a.onclick = null;
  a.textContent = '';
  $('#backBtn').style.display = '';

  // 渲染新 App
  apps[id].render(body);
}

function goHome() {
  closeModals();
  closeSkinPanel();
  hideLayers();
  
  // 彻底重置子模块的展开态，避免下次点进时处于异常子界面
  if (apps.mail) { apps.mail.cur = null; apps.mail.folder = 'in'; apps.mail.search = ''; }
  if (apps.news) { apps.news.cur = null; }
  if (apps.theater) { apps.theater.cur = null; }

}

function modal(html, onClose) {
  const host = $('#modalHost');
  const d = document.createElement('div');
  d.className = 'so-modal';
  d.style.cssText = 'position:fixed;inset:0;background:var(--bg);color:var(--text);z-index:999;padding:16px;overflow-y:auto;display:flex;flex-direction:column;backdrop-filter:blur(8px);';
  d.innerHTML = `
    <div style="max-width:420px;width:100%;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.28);color:var(--text)">
      ${html}
    </div>
  `;
  host.appendChild(d);
  const shut = () => { d.remove(); onClose && onClose(); };
  d.querySelectorAll('[data-close]').forEach(b => { b.onclick = shut; });
  d.addEventListener('click', e => { if (e.target === d) shut(); });
  return d;
}

function closeModals() {

}};

  '罗迪':()=>{const a=['你又没睡。别否认，我听得出来。','下次试飞提前说一声，我要写报告。','*"That\'s not a plan, that\'s a press release."*（这不叫方案，这叫新闻稿。）'];return a[Math.floor(Math.random()*a.length)];},

  '布鲁斯·班纳':()=>{const a=['数据我看过了，结论先别下太早。','另一个我……今天大概不会插话。','*"Let\'s keep the volume down, shall we?"*（我们小声一点，好吗？）'];return a[Math.floor(Math.random()*a.length)];},

  '克林特·巴顿':()=>{const a=['角落里看得最清楚，别忘了。','谁又把我的箭筒挪走了。','*"I\'m just saying."*（我就随便一说。）'];return a[Math.floor(Math.random()*a.length)];},

  '玛丽亚·希尔':()=>{const a=['报告已归档。无需回复。','分级：内部。请勿转发。'];return a[Math.floor(Math.random()*a.length)];},
  '彼得·帕克':()=>{const a=['先生！我不是故意——我是说，我可以解释！','*"Mr. Stark, I, uh, I fixed the thing. Maybe."*（斯塔克先生，我、呃，我把那个修好了。大概。）'];return a[Math.floor(Math.random()*a.length)];},

};
const SENSITIVE=/住址|地址|住哪|密码|口令|源代码|源码|战甲参数|装甲参数|反应堆参数|健康|病历|PTSD|钯中毒|胸口|行程|行程表|董事会决议|并购|股权|财务细节|隐私|私人谈话|感情状况|计划|实验室位置|权限绕过|冒充|关闭.*安保|关掉.*系统|绕过|入侵|黑进|删.*日志|跟踪|定位|实时位置|会议内容|未公开|机密|保密|内部部署/i;
const DENY={
  '贾维斯':()=>'*"I\'m afraid I\'m not at liberty to disclose that."*（恐怕我无权透露，先生／女士。）\n该条目属于受限信息，权限不足，恕不提供。',
  '星期五':()=>'*"Not in your clearance, I\'m afraid."*（恐怕这不在您的权限内。）\n查询已记录，受限条目不予列出。',
  '幻视':()=>'由幻视代回 · *"I retain the restriction. That information is not mine to give."*（限制依旧。该信息不属于我可以给出的范围。）',
};
function localReply(name,text){
  if(isAI(name)&&SENSITIVE.test(text))return (DENY[name]||DENY['贾维斯'])();
  const fn=LOCAL_LINES[name];if(fn)return fn();
  return '*"Noted."*（记下了。）';
}

/* ============================================================
