apps.messages={title:'信息',view:'list',cur:'',last:'',langMode:'zh',
  render(v){
    const self=this,f=flags();
    if(this.view==='list'){
      $('#actBtn').style.display='none';
      const cs=store.contacts().filter(c=>{
        if(c.cond==='pepper'&&!f.pepperExists)return false;
        if(c.cond==='friday'&&!f.fridayExists)return false;
        if(c.cond==='vision'&&!f.visionExists)return false;
        return true;
      });
      const chats=store.chats();
      v.innerHTML=`<div class="pad"><div class="card" style="padding:12px"><div class="row"><button class="btn" id="m_add">＋ 添加联系人</button><button class="btn ghost" id="m_group">👥 群聊</button></div>
        <div class="row" style="margin-top:8px"><button class="btn ghost" id="m_fts">🔍 全文检索（IndexedDB）</button></div>
        <div class="hint" style="margin-top:8px">当前宇宙：${esc(eraName())} · 托尼 ${f.tonyAge} 岁 · 好感上限 200</div></div></div>
        ${cs.map(c=>{const last=(chats[c.name]||[]).slice(-1)[0];return `<div class="chatrow" data-n="${esc(c.name)}"><div class="av">${esc(c.name[0])}</div>
          <div style="flex:1;min-width:0"><div class="nm">${esc(c.name)}${c.isTony?' <span class="tag">核心</span>':''}${isAI(c.name)?' <span class="tag gold">保密权限</span>':''}${c.cond==='jarvis'&&f.ultronAfter?' <span class="tag red">幻视代回</span>':''}</div>
          <div class="ds">${esc(last?last.content.slice(0,42):(c.desc||''))}</div></div><span style="color:var(--muted)">好感 ${c.affinity||0} ›</span></div>`;}).join('')}`;
      v.querySelectorAll('.chatrow').forEach(r=>r.onclick=()=>{self.cur=r.dataset.n;self.view='chat';self.render(v);});
      v.querySelector('#m_add').onclick=()=>self.addFlow(v);
      v.querySelector('#m_group').onclick=()=>openApp('avengers');
      v.querySelector('#m_fts').onclick=()=>{ftIndexAll();openFTSearch();};
      return;
    }

    const cs=store.contacts();const c=cs.find(x=>x.name===self.cur)||{name:self.cur,affinity:0};
    const chats=store.chats();const arr=chats[self.cur]||[];
    const a=$('#actBtn');a.style.display='block';a.textContent='档案';a.onclick=()=>self.settings(v,c);
    let responder=self.cur,notice='';
    if(self.cur==='贾维斯'&&f.ultronAfter){responder='幻视';notice='奥创事件后：贾维斯已升格为幻视，不再直接回复。发给贾维斯的消息由幻视代回。';}

    v.innerHTML=`<div style="display:flex;flex-direction:column;height:100%">
      <div style="flex-shrink:0;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px">
        <button class="back" id="m_bl" style="color:var(--cyan);font-size:24px">‹</button>
        <div class="av" style="width:28px;height:28px;font-size:12px">${esc(self.cur[0])}</div>
        <div style="flex:1;min-width:0"><b style="font-size:13px">${esc(self.cur)}</b> <span class="hint" style="font-size:10px">好感 ${c.affinity||0}/200</span></div>
        <button class="btn ghost sm" id="m_lang" style="padding:3px 8px;font-size:10px">${self.langMode==='zh'?'中 / EN':'EN / 译'}</button>
        <button class="btn ghost sm" id="m_transall" style="padding:3px 8px;font-size:10px">全屏对照</button>
        <button class="back" id="m_clr" style="color:var(--red);font-size:14px" title="清空">🗑</button>
      </div>
      ${notice?`<div class="notice">🔒 ${esc(notice)}</div>`:''}
      <div id="thread" style="flex:1"></div>
      <div class="composer"><input id="m_in" placeholder="发送给 ${esc(self.cur)}…"><button class="mic" id="m_mic" type="button" title="语音输入">🎤</button><button id="m_snd">发送</button></div>
      ${VoiceInput.supported()?'':'<div class="voice-fallback" style="padding:5px 13px">🎤 当前浏览器不支持语音输入（Safari 等）· <b>已自动降级为手动输入</b>，直接在上方输入框打字即可</div>'}</div>`;

    const th=v.querySelector('#thread');
    th.innerHTML=arr.map((m,i)=>{
      if(m.recalled) return `<div class="bubwrap" style="align-self:${m.role==='me'?'flex-end':'flex-start'}"><div class="bub recalled" data-restr="${i}" title="点击查看撤回原文"><i>${esc(m.recalledBy||'')}撤回了一条消息</i></div></div>`;
      
      // 双语模式渲染：若处于英文模式，且消息内包含英文或中英文混合，则进行上下分层排版
      let contentHtml = '';
      if(self.langMode==='en' && m.role==='them'){
        // 尝试提取其中的英文原句与中文翻译
        const match = m.content.match(/\*"([^"]+)"\*[（(]([^）)]+)[）)]/) || m.content.match(/"([^"]+)"\s*[（(]([^）)]+)[）)]/);
        if(match){
          contentHtml = `<div style="font-family:var(--font-en);font-style:italic;color:var(--gold);font-size:13.5px;letter-spacing:0.5px;margin-bottom:6px">${esc(match[1])}</div>
                         <div style="border-top:1px dashed var(--line);padding-top:5px;font-size:12.5px;color:var(--text);opacity:0.85">${esc(match[2])}</div>`;
        } else {
          contentHtml = fmt(m.content);
        }
      } else {
        contentHtml = fmt(m.content);
      }

      // 中文模式下，万一后台依然返回了双语括号，前端做最后一道纯中文提取防护
      let finalContent = contentHtml;
      if (self.langMode === 'zh') {
        finalContent = finalContent.replace(/\*"[^"]+"\*[（(]([^）)]+)[）)]/g, '$1')
                                   .replace(/"[A-Za-z0-9 ,.'!?\-:]{2,}"\s*[（(]([^）)]+)[）)]/g, '$1');
      }

      return `<div class="bubwrap ${m.role==='me'?'me':'them'}">
        ${(m.role==='them' && (m.who || self.cur)) ? `<div class="who">${esc(m.who || self.cur)}</div>` : ''}
        <div class="bub ${m.role==='me'?'me':'them'}">${finalContent}</div>
        <div class="action-bar">
          <span class="tm">${esc(m.time||'')}</span>
          ${m.role==='me'?`<span class="read-tick ${m.read?'':'pending'}">${m.read?'已读':'已送达'}</span>`:''}
          ${m.role==='me'?`<span data-recall="${i}">撤回</span>`:''}
          <span data-delmsg="${i}">删除</span>
        </div>
      </div>`;
    }).join('');

// 检查该角色是否满足主动搭话规则

      async send(v,text){
    const self=this,f=flags();self.last=text;
    let responder=self.cur;
    const chats=store.chats();const arr=chats[self.cur]||[];
    arr.push({role:'me',content:text,time:storyMsgTime(),read:false,delivered:true});
    chats[self.cur]=arr;store.setChats(chats);
    self.render(v);
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));

    /* V2 拟真节奏：已读 → 正在输入 → 回复。
       好感度决定回复延迟：低好感慢回（约 6 秒），高好感秒回（约 0.6 秒）。 */
    const c0=(store.contacts().find(x=>x.name===self.cur)||{affinity:0});
    const aff=Math.max(0,Math.min(200,c0.affinity||0));
    const readDelay=600+Math.round((200-aff)/200*1400);
    const replyDelay=Math.max(400,Math.round(6200-aff*28));

    let isTonyProxy=false,proxyAI=f.ultronAfter?'星期五':'贾维斯';
    let replyPromise;
    try{
      const cs=store.contacts();const c=cs.find(x=>x.name===self.cur)||{affinity:0};
      const recent=arr.slice(-14).map(m=>({role:m.role==='me'?'user':'assistant',content:m.content}));
      let promptExtra=`你现在扮演【${responder}】。${castText(responder)}`;
      const targetCount=c.replyCount||2;
      promptExtra+=`\n【回复条数要求】：请务必输出刚好 ${targetCount} 条简短消息，每条之间必须严格用 || 隔开！`;
      isTonyProxy=(self.cur==='托尼·斯塔克')&&(Math.random()<0.38);
      if(isTonyProxy){
        promptExtra+=`\n【重要形式要求】：托尼此时正在忙或者没空打字，由【${proxyAI}】进行语音转文字代录发送！
代发格式必须严格遵循："｛语音转文字｝……" 的格式。托尼语气带疲惫、自大或吐槽。`;
      }else if(self.langMode==='zh'){
        promptExtra+=`\n【当前处于纯中文模式】：严禁输出任何英文句子、英文单词或括号双语！必须全篇输出纯正、地道、带托尼口吻的纯中文短消息！`;
      }else{
        promptExtra+=`\n【当前处于英文模式】：原句写成地道简短的英文原句，中文翻译放在后面，格式如：*"English"*（中文解释）。`;
      }
      promptExtra+=`\n当前好感度：${c.affinity||0}/200。只输出短信内容，严禁动作神态描写，2~3 条可用 || 分隔。`;
      const sys=buildSystem('chat',promptExtra);
      replyPromise=ai(recent,sys,()=>{
        if(isTonyProxy)return `｛语音转文字｝好得很，根本没睡。幸好${proxyAI}能打字，否则你话多到斯塔克工业科研部要停工了，你付得起这个吗？`;
        return localReply(responder,text);
      });
    }catch(e){replyPromise=Promise.resolve(null);}

    // ① 已读回执：局部更新，不整块重绘，避免打断输入态
    await sleep(readDelay);
    const cc=store.chats(),a0=cc[self.cur]||[];
    const last=a0.length?a0[a0.length-1]:null;
    if(last&&last.role==='me'){last.read=true;store.setChats(cc);}
    const th0=v.querySelector('#thread');
    if(th0){
      const marks=th0.querySelectorAll('.read-tick');
      const mk=marks.length?marks[marks.length-1]:null;
      if(mk){mk.textContent='已读';mk.classList.remove('pending');}
      // ② 正在输入（带三点动画）
      const typing=document.createElement('div');
      typing.className='bub them typing-bub';typing.id='typing';
      typing.innerHTML='<i></i><i></i><i></i> 正在输入…';
      th0.appendChild(typing);th0.scrollTop=th0.scrollHeight;
    }

    // ③ 按好感度延迟后落回复
    await sleep(replyDelay);
    let res=null;
    try{res=await replyPromise;}catch(e){res=null;}
    const t=v.querySelector('#typing');if(t)t.remove();
    if(!res||!String(res).trim())res=localReply(responder,text);
    const msgs=String(res).split('||').map(x=>x.trim()).filter(Boolean);
    for(let i=0;i<msgs.length;i++){
      const ch=store.chats();const a2=ch[self.cur]||[];
      a2.push({role:'them',who:isTonyProxy?`${proxyAI}代录`:responder,content:msgs[i],time:storyMsgTime()});
      ch[self.cur]=a2;store.setChats(ch);
      self.render(v);
      if(i<msgs.length-1)await sleep(600);
    }

    // ④ 偶发撤回：复用现有撤回 UI（.bub.recalled + 受限日志入口 data-restr）
    if(Math.random()<0.12&&msgs.length){
      await sleep(1100);
      const ch=store.chats(),a3=ch[self.cur]||[];
      for(let j=a3.length-1;j>=0;j--){
        const m=a3[j];
        if(m&&m.role==='them'&&!m.recalled&&m.content){
          m.orig=m.content;m.content='';m.recalled=true;m.recalledBy=responder;
          ch[self.cur]=a3;store.setChats(ch);
          self.render(v);toast(responder+' 撤回了一条消息');
          break;
        }
      }
    }
  },
  onBack(){if(this.view==='chat'){this.view='list';this.render($('#appBody'));return true;}return false;}
};

/* 转载给托尼（推特 / 邮件 / 报纸共用）并触发托尼邮件回信 */
function repostToTony(source,text){
  const d=modal(`<h2 style="color:var(--cyan);font-size:16px;margin-top:0">⇄ 转载给托尼</h2>
    <div class="card"><div class="hint" style="margin-bottom:8px">来源：${esc(source)}</div>
      <div class="quote">${fmt(text)}</div>
      <div class="field"><label>附言（随时可写，随转载一起送出）</label><textarea id="rp_note" rows="3" placeholder="例如：这条我觉得你会想看，尤其是第二段。"></textarea></div>
      <label class="srow" style="border:none;padding:6px 0"><span><span class="t">同步发到我的推特</span></span><label class="switch"><input type="checkbox" id="rp_tw"><span class="slider"></span></label></label>
      <button class="btn gold" id="rp_send">✉️ 转给托尼并附言</button>
      <button class="btn ghost" data-close style="margin-top:8px">取消</button></div>`);

  d.querySelector('#rp_send').onclick=()=>{
    const note=d.querySelector('#rp_note').value.trim();
    const mails=mailAll();
    const sub = 'Fwd: '+(source.length>24?source.slice(0,24)+'…':source);
    mails.unshift({id:'m'+Math.random().toString(36).slice(2,9),owner:'user',box:'sent',
      from:'you@starkmail.com',to:'tony@starkindustries.com',subject:sub,
      body:(note||'（无附言）')+'\n\n—— 以下为转载内容 ——\n来源：'+source+'\n'+text,quote:source,unread:false,star:false,time:nowTime(),tag:'转载'});
    mailSave(mails);

    if(d.querySelector('#rp_tw').checked){
      const ps=store.posts();ps.twitter=ps.twitter||[];
      ps.twitter.unshift({name:store.profile().name||'我',handle:'@me',text:'⇄ 转载 · '+source+'\n'+(note?note+'\n':'')+text.slice(0,120)+(text.length>120?'…':''),likes:0,comments:[]});
      store.setPosts(ps);
    }
    d.remove();
    toast('已转给托尼并附言 · 正在抄送实验室…');

    // 触发托尼的回信
    setTimeout(async ()=>{
      try{
        const sys = buildSystem('mail', `你是托尼·斯塔克。玩家向你转载了一则情报/新闻并附言。
请以托尼极其简短、挑剔、自嘲但认真的口吻回复一封邮件（4~7行）。文末落款 T.S.。禁止套话。`);
        const replyText = await ai([{role:'user',content:`玩家向你转发了：【${source}】\n内容摘要：${text.slice(0,180)}\n玩家附言：${note||'（未附言）'}`}], sys, ()=>{
          return `收到了。第二段我早让贾维斯标红了，你反射弧比推进器延迟还长。\n\n另外，别在公用线路发这种东西，公关部那帮人血压又要升高了。\n蓝色的那个放回原位。\n\nT.S.`;
        }, 'text');

        const curMails = mailAll();
        curMails.unshift({
          id:'m'+Math.random().toString(36).slice(2,9),
          owner:'user',
          box:'in',
          from:'托尼·斯塔克 <tony@starkindustries.com>',
          to:'you@starkmail.com',
          subject:'Re: '+sub,
          body:replyText,
          tag:'私人',
          unread:true,
          star:true,
          time:nowTime(),
          quote:source
        });
        mailSave(curMails);
        banner('托尼·斯塔克 · 新邮件', `Re: ${sub}（已收到托尼的回复）`, ()=>{
          openApp('mail');
          apps.mail.account='user';
          apps.mail.folder='in';
          apps.mail.cur=curMails[0].id;
          apps.mail.render($('#appBody'));
        });
      }catch(err){}
    }, 9000);
  };
}

function userRelations(){return store.get('userRelations',{});}
function relationOf(name){return userRelations()[name]||null;}
function setUserRelation(name,rel){const r=userRelations();r[name]={...r[name],...rel};store.set('userRelations',r);}
function delUserRelation(name){const r=userRelations();delete r[name];store.set('userRelations',r);}
/* 过滤掉当前宇宙不存在的角色，统一出口 */
function visibleContacts(){
  const f=flags();
  return store.contacts().filter(c=>{
    if(c.cond==='pepper'&&!f.pepperExists)return false;
    if(c.cond==='friday'&&!f.fridayExists)return false;
    if(c.cond==='vision'&&!f.visionExists)return false;
    return true;
  });
}

    const r=rels[k]||{};

}

/* ============================================================
   全文检索（IndexedDB · 独立库 StarkFTX）· 推特 / 邮件 / 短信
   ============================================================ */
const _hstr=s=>{let h=0;for(let i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))>>>0;return h.toString(36);};
const FT={db:null,_cache:{},
  init(){return new Promise(res=>{const r=indexedDB.open('StarkFTX',1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs',{keyPath:'k'});};
    r.onsuccess=e=>{this.db=e.target.result;res();};r.onerror=()=>res();});},
  add(type,id,text,meta){
    if(!this.db||!text)return;const k=type+':'+id;const s=String(text);
    const h=s.length+'|'+s.slice(0,32);
    if(this._cache[k]===h)return;this._cache[k]=h;
    try{const t=this.db.transaction('docs','readwrite');t.objectStore('docs').put({k,type,id,meta:meta||'',text:s,t:Date.now()});}catch(e){}},
  async search(q){
    if(!this.db)return[];
    const all=await new Promise(res=>{try{const t=this.db.transaction('docs','readonly');const rq=t.objectStore('docs').getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([]);}catch(e){res([]);}});
    const ks=q.toLowerCase().split(/\s+/).filter(Boolean);
    return all.map(d=>{const tx=d.text.toLowerCase();if(!ks.every(k=>tx.includes(k)))return null;
      const i=tx.indexOf(ks[0]);const st=Math.max(0,i-24);
      return{...d,snip:d.text.slice(st,st+72).replace(/\n/g,' ')};}).filter(Boolean).sort((a,b)=>b.t-a.t).slice(0,60);}
};

/* ============================================================
   Web Audio：触控音效 + 4 套 Stark Ambience 声景（实时合成）
   ============================================================ */
const SFX={ctx:null,on:true,
  ensure(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
  tap(kind){if(!this.on)return;const c=this.ensure();if(!c)return;const t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    const f=kind==='nav'?[720,1180]:kind==='warn'?[420,300]:[1150,1500];
    o.type='sine';o.frequency.setValueAtTime(f[0],t);o.frequency.exponentialRampToValueAtTime(f[1],t+.05);
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.07,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.12);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+.14);},
};
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('button,.icon,.chip,.opt,.skin-card,.era-card,.ft-hit,.mk-card'))return;
  SFX.tap('tap');
},true);
const AMB={cur:null,nodes:[],master:null,
  stop(){this.nodes.forEach(n=>{try{n.stop?n.stop():n.disconnect();}catch(e){}});this.nodes=[];
    if(this.master){try{this.master.disconnect();}catch(e){}this.master=null;}this.cur=null;},
  start(id){
    this.stop();const c=SFX.ensure();if(!c)return;
    const g=c.createGain();g.gain.value=0;g.connect(c.destination);this.master=g;
    g.gain.linearRampToValueAtTime(.15,c.currentTime+2.5);
    const noise=()=>{const buf=c.createBuffer(1,c.sampleRate*4,c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return buf;};
    const keep=n=>this.nodes.push(n);
    if(id==='lab'){ // 实验室低鸣
      const o=c.createOscillator();o.type='sine';o.frequency.value=54;const og=c.createGain();og.gain.value=.4;o.connect(og).connect(g);o.start();keep(o);
      const o2=c.createOscillator();o2.type='triangle';o2.frequency.value=108.3;const og2=c.createGain();og2.gain.value=.08;o2.connect(og2).connect(g);o2.start();keep(o2);
      const ns=c.createBufferSource();ns.buffer=noise();ns.loop=true;
      const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
      const ng=c.createGain();ng.gain.value=.028;ns.connect(f).connect(ng).connect(g);ns.start();keep(ns);
    }else if(id==='reactor'){ // 反应堆脉冲
      const o=c.createOscillator();o.type='sine';o.frequency.value=98;
      const og=c.createGain();og.gain.value=.5;o.connect(og).connect(g);o.start();keep(o);
      const lfo=c.createOscillator();lfo.frequency.value=.45;const lg=c.createGain();lg.gain.value=.42;lfo.connect(lg);lg.connect(og.gain);lfo.start();keep(lfo);
      const o2=c.createOscillator();o2.type='sine';o2.frequency.value=196.5;const og2=c.createGain();og2.gain.value=.06;o2.connect(og2).connect(g);o2.start();keep(o2);
    }else if(id==='malibu'){ // 马里布海岸
      const ns=c.createBufferSource();ns.buffer=noise();ns.loop=true;
      const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=650;
      const ng=c.createGain();ng.gain.value=.09;ns.connect(f).connect(ng).connect(g);ns.start();keep(ns);
      const lfo=c.createOscillator();lfo.frequency.value=.11;const lg=c.createGain();lg.gain.value=380;lfo.connect(lg);lg.connect(f.frequency);lfo.start();keep(lfo);
    }else if(id==='tower'){ // 大厦之夜
      const ns=c.createBufferSource();ns.buffer=noise();ns.loop=true;
      const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=300;f.Q.value=.6;
      const ng=c.createGain();ng.gain.value=.05;ns.connect(f).connect(ng).connect(g);ns.start();keep(ns);
      const o=c.createOscillator();o.type='sine';o.frequency.value=61.5;const og=c.createGain();og.gain.value=.22;o.connect(og).connect(g);o.start();keep(o);
    }else return;
    this.cur=id;},
  toggle(id){if(this.cur===id)this.stop();else this.start(id);return this.cur;}
};

/* ============================================================
   FX：扫描线 / 故障光效 / 粒子转场
   ============================================================ */
const FX={
  glitch(){if(!store.get('fxOn',true))return;const d=document.querySelector('.device');if(!d)return;d.classList.remove('fx-glitch');void d.offsetWidth;d.classList.add('fx-glitch');},
  scan(on){const s=$('#fxScan');if(s)s.classList.toggle('on',!!on);},
  _ps:[],_raf:0,
  burst(x,y){if(!store.get('fxOn',true))return;const cv=$('#fxCanvas');if(!cv)return;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;
    const cx=(x??r.left+r.width/2)-r.left,cy=(y??r.top+r.height/2)-r.top;
    const cols=['#35d0ff','#8fe3ff','#f5b942','#ffffff'];
    for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,v=(1.6+Math.random()*3.4)*dpr;
      this._ps.push({x:cx*dpr,y:cy*dpr,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2*dpr,life:1,c:cols[i%4],r:(1+Math.random()*2.2)*dpr});}
    if(!this._raf)this._loop();},
  _loop(){const cv=$('#fxCanvas');if(!cv){this._raf=0;return;}
    const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
    this._ps=this._ps.filter(p=>p.life>0);
    this._ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=.02;
      ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(.2,p.life),0,7);ctx.fill();});
    ctx.globalAlpha=1;
    if(this._ps.length)this._raf=requestAnimationFrame(()=>this._loop());
    else{this._raf=0;ctx.clearRect(0,0,cv.width,cv.height);}},
  transit(x,y){this.burst(x,y);if(Math.random()<.4)this.glitch();}
};

  /* 按真实时间间隔掷骰：由 EnvLog.tick / setInterval 驱动，用户不操作时世界仍运转 */
  roll(source){
    try{
      const c=this.CONFIG;
      if(!c.enabled||!store.state()||document.hidden)return;
      const now=Date.now();
      if(now-(store.get('lastWorldEventAt',0)||0)<c.minGapMs)return;
      if(Math.random()>c.rollChance)return;
      const pool=this.EVENTS.filter(e=>{try{return !e.when||e.when();}catch(x){return false;}});
      if(!pool.length)return;
      const total=pool.reduce((a,e)=>a+(typeof e.weight==='function'?e.weight():e.weight),0);
      let r=Math.random()*total,pick=pool[pool.length-1];
      for(const e of pool){r-=typeof e.weight==='function'?e.weight():e.weight;if(r<=0){pick=e;break;}}
      const cd=store.get('eventCooldown',{});
      if(now-(cd[pick.id]||0)<(pick.cooldownMs||c.minGapMs))return;
      store.set('lastWorldEventAt',now);cd[pick.id]=now;store.set('eventCooldown',cd);
      this.deliver(pick.id,pick.build());
    }catch(e){console.warn('EventEngine.roll:',e);}

const Milestones={
  done(){return store.get('affMilestones',[]);},
  check(oldVal,newVal,opts){
    opts=opts||{};
    const a=tierIndex(oldVal),b=tierIndex(newVal);
    if(a===b||b<=a)return;                 // 只在跨入更高档时派发，下降不派发也不清记录
    const done=this.done();
    for(let i=a+1;i<=b;i++){
      const t=AFF_TIERS[i];
      if(done.includes(t.key))continue;
      done.push(t.key);store.set('affMilestones',done);   // 记录已触发项，防重复
      if(opts.silent)continue;
      this.grant(t);
    }
  },
  grant(t){
    const def=MILESTONE_DEFS[t.key];if(!def)return;
    // ① 小剧场：解锁专属剧本，由 apps.theater 直接复用 renderQuest
    if(def.quest){const u=store.get('theaterUnlocked',[]);if(!u.includes(def.quest)){u.push(def.quest);store.set('theaterUnlocked',u);}}
    // ② 实验室物品：复用 labItems / addLabItem
    (def.items||[]).forEach(id=>{const it=(typeof LAB_ITEMS_DEF!=='undefined'?LAB_ITEMS_DEF:[]).find(x=>x.id===id);
      if(it&&typeof addLabItem==='function')addLabItem({...it});});
    // ③ 托尼信件：复用 mailAll / mailSave
    if(def.mail){
      const l=mailAll();l.unshift({id:'m'+Math.random().toString(36).slice(2,9),owner:'user',box:'in',
        from:'托尼·斯塔克 <tony@starkindustries.com>',to:'you@starkmail.com',
        subject:def.mail.subject,body:def.mail.body,tag:'私人',unread:true,star:true,
        time:nowTime(),quote:'',milestone:t.key});
      mailSave(l);
    }
    EventEngine.record({type:'milestone',icon:t.emoji,title:'好感里程碑 · '+t.name,
      detail:'解锁专属小剧场 / 托尼来信 / 实验室物品（'+t.en+'）',target:'theater'});
    banner('里程碑解锁 · '+t.emoji+' '+t.name,'专属小剧场、信件或实验室物品已送达',()=>openApp('briefing'));
    toast('已跨入「'+t.name+'」· 专属内容已解锁');
    if(def.bootFx)bootAnimation(t);
    try{renderGrid();}catch(e){}
  },
  /* 开机补检：老存档升级到 V2 后按当前档位补齐记录（不打扰地静默补齐，仅补最高档动画） */
  bootCheck(){
    const s=store.state();if(!s)return;
    const aff=s.affinity||0,done=this.done(),idx=tierIndex(aff);
    let changed=false;
    for(let i=1;i<=idx;i++){if(!done.includes(AFF_TIERS[i].key)){done.push(AFF_TIERS[i].key);changed=true;}}
    if(changed)store.set('affMilestones',done);
  }
};
/* 统一好感写入口：同步 state + 通讯录，并派发里程碑 */
function applyAffinity(v,opts){
  opts=opts||{};
  const s=store.state();if(!s)return 0;
  const old=s.affinity||0,nv=Math.max(0,Math.min(200,Math.round(+v||0)));
  if(nv===old)return nv;
  s.affinity=nv;store.setState(s);
  const cs=store.contacts(),t=cs.find(x=>x.isTony);
  if(t){t.affinity=nv;store.setContacts(cs);}
  if(!opts.silent)Milestones.check(old,nv);
  try{renderGrid();}catch(e){}
  return nv;
}

/* ---------- Web Speech API 语音输入 + 不支持时的可见降级 ---------- */
const VoiceInput={
  active:null,
  supported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);},
  attach(btn,input,opts){
    if(!btn||!input)return;
    opts=opts||{};
    if(!this.supported()){
      btn.classList.add('unsupported');
      btn.title='当前浏览器不支持语音识别（Safari 等）· 已自动降级为手动输入';
      btn.onclick=()=>toast('当前浏览器不支持语音输入 · 已降级，直接在输入框打字即可');
      return;
    }
    btn.title='点击开始语音输入（说完自动停止）';
    btn.onclick=()=>this.start(btn,input,opts);
  },
  start(btn,input,opts){
    if(this.active){this.stop();return;}
    const C=window.SpeechRecognition||window.webkitSpeechRecognition;
    let r;try{r=new C();}catch(e){toast('无法启动麦克风 · 请手动输入');return;}
    r.lang=opts.lang||'zh-CN';r.interimResults=false;r.maxAlternatives=1;r.continuous=false;
    let got=false;
    r.onresult=e=>{let txt='';for(let i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript;
      txt=txt.trim();if(!txt)return;got=true;
      input.value=(input.value?input.value.replace(/\s+$/,'')+' ':'')+txt;
      input.focus();if(opts.onText)opts.onText(txt);};
    r.onerror=e=>{
      const msg={'no-speech':'没听到声音','not-allowed':'麦克风权限被拒绝','service-not-allowed':'语音服务不可用',
        'network':'语音服务需要网络','aborted':'已取消','audio-capture':'未找到麦克风'}[e.error]||e.error;
      toast('语音输入不可用：'+msg+' · 已降级为手动输入');this._reset(btn);
    };
    r.onend=()=>{this._reset(btn);if(got&&opts.autoSend)opts.autoSend();};
    try{r.start();this.active=r;btn.classList.add('on');btn.textContent='⏹';toast('正在聆听… 说完自动停止');}
    catch(e){toast('无法启动麦克风 · 请手动输入');this._reset(btn);}
  },
  stop(){if(this.active){try{this.active.stop();}catch(e){}this.active=null;}},
  _reset(btn){if(btn){btn.classList.remove('on');btn.textContent='🎤';}this.active=null;}
};

const ParallelData={
  /* 所有可选来源：当前进度 / 人设档 / 剧情槽 / 分支节点 / 自存快照 */
  options(){
    const out=[{value:'current',label:'◉ 当前进度'}];
    const ps=store.get('profileSlots',{});
    Object.keys(ps).forEach(i=>{if(ps[i])out.push({value:'ps:'+i,label:'人设档 '+( +i+1)+' · '+esc((ps[i].profile||{}).name||'—')});});
    const ws=store.get('wl_slots',[]);
    ws.forEach((s,i)=>{if(s)out.push({value:'ws:'+i,label:'剧情槽 '+(i+1)+' · '+esc(s.eraName||'—')+' T'+(s.state||{}).turn});});
    const wt=WT.nodes();
    wt.nodes.slice(-12).forEach(n=>out.push({value:'wt:'+n.id,label:'分支 · '+n.year+' T'+n.turn+' '+esc(String(n.choice).slice(0,10))}));
    const sn=store.get('parallelSnaps',[]);
    sn.forEach((s,i)=>out.push({value:'sn:'+i,label:'快照 · '+esc(s.label||('快照'+(i+1)))}));
    return out;
  },
  raw(value){
    if(value==='current')return {label:'当前进度',state:store.state(),profile:store.profile()};
    const [k,i]=String(value).split(':');
    if(k==='ps'){const s=(store.get('profileSlots',{}))[i];return s?{label:'人设档 '+(+i+1),state:s.state,profile:s.profile}:null;}
    if(k==='ws'){const s=(store.get('wl_slots',[]))[+i];return s?{label:'剧情槽 '+(+i+1),state:s.state,profile:s.profile,eraName:s.eraName}:null;}
    if(k==='wt'){const n=WT.nodes().nodes.find(x=>x.id===i);return n?{label:'分支 · '+(n.choice||'').slice(0,14),snap:n.snap,year:n.year,turn:n.turn,choice:n.choice,tags:n.tags}:null;}
    if(k==='sn'){const s=(store.get('parallelSnaps',[]))[+i];return s?{label:s.label,snap:s.snap}:null;}
    return null;
  },
  normalize(value){
    const r=this.raw(value);if(!r)return null;
    const s=r.snap||r.state||{},p=r.profile||{},f=flags();
    const rel=s.rel||{trust:12,anxiety:18,guard:72,truth:8};
    let year=s.customYear||(WORLD.eras.find(e=>e.id===s.era)||{}).year||f.year;
    if(r.year)year=r.year;
    const eraName=((WORLD.eras.find(e=>e.id===s.era)||{}).name)||r.eraName||'—';
    const hist=s.history||[];
    const choices=[];
    (s.keyChoices||[]).forEach(k=>choices.push('【关键】'+(k.tags||[]).join('/')));
    (r.tags||[]).forEach(t=>choices.push('【标记】'+t));
    if(r.choice)choices.push('【本节点】'+r.choice);
    hist.slice(-3).forEach(h=>{if(h.choice)choices.push(String(h.choice).slice(0,26));});
    return {label:r.label||'—',affinity:s.affinity||0,rel,turn:s.turn||r.turn||1,year,eraName,
      age:p.currentAge||p.startAge||'—',choices:choices.slice(-6),
      universe:{pepper:s.pepperExists!==false,ultron:(s.ultronPhase||'before')==='after',av1:!!s.forceAvengers1},
      t:r.t||s.t||''};
  },
  saveSnapshot(){
    const s=store.state()||{},p=store.profile()||{};
    const snap={label:nowTime()+' · '+eraName(),snap:{turn:s.turn||1,affinity:s.affinity||0,rel:{...relGet()},
      era:s.era,customYear:s.customYear,pepperExists:s.pepperExists,ultronPhase:s.ultronPhase,
      forceAvengers1:s.forceAvengers1,keyChoices:(s.keyChoices||[]).slice(),
      history:(s.history||[]).slice(-30).map(h=>({...h}))}};
    const a=store.get('parallelSnaps',[]);a.unshift(snap);store.set('parallelSnaps',a.slice(0,12));
    return snap.label;
  }
};

const REL_DIMS=[['trust','信任','#4fd08a'],['anxiety','焦虑','#f5b942'],['guard','防备','#7c8da0'],['truth','真实','#35d0ff']];
function relGet(){const s=store.state()||{};if(!s.rel){s.rel={trust:12,anxiety:18,guard:72,truth:8};store.setState(s);}return s.rel;}
function relSummary(){const r=relGet();return `信任${r.trust}·焦虑${r.anxiety}·防备${r.guard}·真实${r.truth}`;}
function relApply(choice){
  const r=relGet();const t=choice||'';
  if(/帮|护|留|递|救|信|陪|护住/.test(t)){r.trust=Math.min(100,r.trust+2);r.guard=Math.max(0,r.guard-2);}
  if(/问|追|逼|揭|查|试探|戳/.test(t)){r.anxiety=Math.min(100,r.anxiety+2);r.guard=Math.min(100,r.guard+1);}
  if(/坦白|真话|承认|告诉|说出|说实话/.test(t)){r.truth=Math.min(100,r.truth+2);r.anxiety=Math.min(100,r.anxiety+1);}
  if(/离开|转身|走开|冷|不理|挂断|沉默/.test(t)){r.guard=Math.min(100,r.guard+2);r.trust=Math.max(0,r.trust-1);}
  const s=store.state();s.rel=r;store.setState(s);
}
function relHTML(){const r=relGet();return `<div class="relgrid">${REL_DIMS.map(([k,n,c])=>`
  <div class="relrow"><span style="width:26px;flex-shrink:0">${n}</span><div class="bar"><i style="width:${r[k]}%;background:${c}"></i></div><span class="v">${r[k]}</span></div>`).join('')}</div>`;}

      return a[Math.floor(Math.random()*a.length)];});
    this._done(fmt(ans));this.speak(ans);

const StarkVoice={
  cache:[],ready:false,
  profiles:{
    jarvis:{
      label:'J.A.R.V.I.S.',
      tag:'英伦男低音',
      pitch:0.2,       // 偏低沉稳的管家男中低音
      rate:1.00,
      fallbackLang:'en-GB',
      // 正向只匹配纯正英音、男声关键词
      pos:['daniel','george','arthur','oliver','ryan','alex','fred','david','rishi','male','guy','british','united kingdom','en-gb'],
      // 坚决剔除所有女声关键词
      neg:['kate','serena','samantha','zira','victoria','susan','karen','moira','fiona','tessa','female','girl','woman','en-ie']
    },
    friday:{
      label:'F.R.I.D.A.Y.',
      tag:'爱尔兰 / 清脆女声',
      pitch:0.82,       // 爱尔兰/英式女声
      rate:1.00,
      fallbackLang:'en-IE',
      // 正向匹配爱尔兰、英式及标准女声
      pos:['moira','fiona','kate','serena','samantha','tessa','karen','victoria','susan','zira','female','girl','woman','ireland','irish','en-ie'],
      // 剔除男声
      neg:['daniel','george','arthur','oliver','ryan','alex','fred','david','rishi','male','guy','british']
    }
  },
  init(){
    if(!window.speechSynthesis)return;
    const load=()=>{try{this.cache=window.speechSynthesis.getVoices()||[];this.ready=this.cache.length>0;}catch(e){}};
    load();
    try{if('onvoiceschanged' in window.speechSynthesis)window.speechSynthesis.onvoiceschanged=load;}catch(e){}
    setTimeout(load,250);setTimeout(load,1200);
  },
  voices(){if(!window.speechSynthesis)return [];return this.cache.length?this.cache:(window.speechSynthesis.getVoices()||[]);},
  pick(who){
    const p=this.profiles[who]||this.profiles.jarvis,vs=this.voices();
    if(!vs.length)return {voice:null,profile:p,mode:'音高区分（系统未提供音色列表）'};
    const nm=v=>String(v.name||'').toLowerCase(),lg=v=>String(v.lang||'').toLowerCase().replace('_','-');
    const en=vs.filter(v=>/^en/i.test(lg(v))),pool=en.length?en:vs;
    const hit=(v,a)=>a.some(x=>(nm(v)+' '+lg(v)).indexOf(x)>=0);
    const score=v=>{
      let s=0;const L=lg(v);
      if(who==='jarvis'){
  if(L.indexOf('en-gb')===0)s+=30;
  if(hit(v,p.pos))s+=60;if(hit(v,p.neg))s-=80;
}else{
  if(L.indexOf('en-ie')===0)s+=40;else if(L.indexOf('en-gb')===0)s+=20;
  if(hit(v,p.pos))s+=60;if(hit(v,p.neg))s-=80;
}
      if(v.localService)s+=2;return s;};
    const best=pool.slice().sort((a,b)=>score(b)-score(a))[0];
    return {voice:best||null,profile:p,mode:best?'系统音色':'音高区分（无可用英文音色）'};
  },
  info(who){const r=this.pick(who);
    return r.voice?r.profile.label+' · '+r.profile.tag+' · '+r.voice.name+' ['+r.voice.lang+'] · pitch '+r.profile.pitch
      :r.profile.label+' · '+r.profile.tag+' · '+r.mode+' · pitch '+r.profile.pitch;},
  speak(text,who){
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return null;
    const r=this.pick(who||'jarvis');
    try{
      window.speechSynthesis.cancel();   // 清空队列，两个 AI 的语音绝不叠在一起
      const clean=String(text).replace(/<[^>]*>/g,' ').replace(/&[a-z#0-9]+;/gi,' ')
        .replace(/[*'（）()]/g,' ').trim().slice(0,220);
      if(!clean)return r;
      const u=new window.SpeechSynthesisUtterance(clean);
      if(r.voice){u.voice=r.voice;u.lang=r.voice.lang;}else u.lang=r.profile.fallbackLang;
      u.pitch=r.profile.pitch;u.rate=r.profile.rate;u.volume=1;
      window.speechSynthesis.speak(u);return r;
    }catch(e){return r;}
  }
};

function doTimeJump(y){
  const f=flags();const p=store.profile()||{};const s=store.state();
  const delta=y-f.year;
  const era=WORLD.eras.filter(e=>e.year<=y).pop()||f.era;
  s.era=era.id;s.customYear=(y===era.year)?null:y;
  if(y>=2012)s.forceAvengers1=true;
  if(y>=2015)s.ultronPhase='after';
  s.gameYear=y;store.setState(s);
  if(p.currentAge){p.currentAge=Math.max(+(p.startAge||1),+p.currentAge+delta);store.setProfile(p);}
  // 战甲解锁新机型的完整度
  const ar=store.get('armor',{});(ar.integrity=ar.integrity||{});
  MARKS.forEach(m=>{if(m.year<=y&&ar.integrity[m.no]==null)ar.integrity[m.no]=55+Math.floor(Math.random()*40);});
  store.set('armor',ar);
  // 跨越的历史事件 → 突发简报（EventEngine 可配置链：归档报纸 + 邮件 + 事件日志）
  const crossed=HIST_EVENTS.filter(e=>e.year>f.year&&e.year<=y);
  crossed.forEach(e=>EventEngine.flashBrief(e,{fromYear:f.year,toYear:y,crossed}));
  // 时间胶囊解封
  const caps=store.get('capsules',[]);let opened=0;
  caps.forEach(c=>{if(c.unlockYear<=y&&!c.opened){c.opened=true;opened++;}});
  if(caps.length)store.set('capsules',caps);
  TonyStatus.refresh();
  FX.glitch();
  toast(`时间跳跃完成 · ${f.year} → ${y}（+${delta} 年）`);
  banner('J.A.R.V.I.S. · 时间校准',`已推进至 ${y} 年。托尼 ${tonyAgeAt(y)} 岁；你 ${store.profile()?.currentAge||'—'} 岁。${crossed.length?'跨越 '+crossed.length+' 个历史节点，简报已送入报纸与邮件。':''}`,()=>openApp('news'));
  if(opened)setTimeout(()=>toast(opened+' 个时间胶囊已解封（工作笔记 → 时间胶囊）'),1500);
  renderGrid();
  if(currentApp==='worldline')apps.worldline.render($('#appBody'));
}

const WT={
  nodes(){return store.get('wtree',{nodes:[],active:null});},
  save(t){store.set('wtree',t);},
  snap(){const s=store.state()||{};const p=store.profile()||{};
    return {turn:s.turn||1,affinity:s.affinity||0,rel:{...relGet()},curAge:p.currentAge||null,
      era:s.era,customYear:s.customYear,pepperExists:s.pepperExists,ultronPhase:s.ultronPhase,forceAvengers1:s.forceAvengers1,
      story:s.story||'',options:s.options||'',history:(s.history||[]).slice(-30).map(h=>({...h})),keyChoices:(s.keyChoices||[]).slice()};},
  addNode(choice,tags){
    const t=this.nodes();const snap=this.snap();
    const n={id:'w'+Date.now()+Math.random().toString(36).slice(2,5),parent:t.active,year:flags().year,turn:snap.turn,
      choice:String(choice).slice(0,60),tags:tags||[],snap,t:nowTime()};
    t.nodes.push(n);if(t.nodes.length>40)t.nodes=t.nodes.slice(-40);
    t.active=n.id;this.save(t);return n;},
  keyTag(choice,story){
    const t=(choice||'')+' '+(story||'');const tags=[];
    if(/钯|中毒|血毒|帕拉迪/.test(t))tags.push('钯提醒');
    if(/站队|史蒂夫那边|队长那边|协议|注册|内战|西伯利亚/.test(t))tags.push(/史蒂夫|队长|反注册|反协议/.test(t)?'内战·队长线':'内战·托尼线');
    if(/告白|爱你|留下|别走|求婚/.test(t))tags.push('里程碑');
    if(tags.length){const s=store.state();s.keyChoices=(s.keyChoices||[]);s.keyChoices.push({tags,year:flags().year,turn:s.turn});store.setState(s);}
    return tags;},
  restore(nodeId){
    const t=this.nodes();const n=t.nodes.find(x=>x.id===nodeId);if(!n)return;
    if(!confirm('回溯到「'+n.choice.slice(0,18)+'…」（'+n.year+' 年 · 第 '+n.turn+' 回合）？\n当前进度会先被保存为一个平行分支。'))return;
    const cur=this.snap();
    t.nodes.push({id:'w'+Date.now()+'p',parent:n.parent,year:flags().year,turn:cur.turn,choice:'（平行分叉 · '+nowTime()+'）',tags:['平行'],snap:cur,t:nowTime()});
    const sn=n.snap;const st=store.state()||{};
    st.turn=sn.turn;st.affinity=sn.affinity;st.rel={...(sn.rel||relGet())};st.era=sn.era;st.customYear=sn.customYear;
    st.pepperExists=sn.pepperExists;st.ultronPhase=sn.ultronPhase;st.forceAvengers1=sn.forceAvengers1;
    st.story=sn.story;st.options=sn.options;st.history=sn.history;st.keyChoices=sn.keyChoices;
    store.setState(st);
    const p=store.profile()||{};if(sn.curAge){p.currentAge=sn.curAge;store.setProfile(p);}
    const c=store.contacts().find(x=>x.isTony);if(c){c.affinity=sn.affinity;store.setContacts(store.contacts());}
    t.active=n.id;this.save(t);
    toast('已回溯 · 当前进度已另存为平行分支');FX.glitch();
    renderGrid();
    if(currentApp==='worldline')apps.worldline.render($('#appBody'));},
  treeHTML(){
    const t=this.nodes();
    if(!t.nodes.length)return '<div class="empty">还没有分支节点。在世界线里做出选择后，这里会长出一棵树。</div>';
    const map={};t.nodes.forEach(n=>map[n.id]=n);
    const rows={};t.nodes.forEach(n=>{let d=0,p=n.parent;while(p&&map[p]&&d<30){d++;p=map[p].parent;}(rows[d]=rows[d]||[]).push(n);});
    const ds=Object.keys(rows).map(Number).sort((a,b)=>a-b);
    const W=Math.max(160,Math.max(...ds.map(d=>rows[d].length))*86+20);
    const H=ds.length*54+20;
    let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">`;
    ds.forEach(d=>{rows[d].forEach((n,i)=>{
      const x=14+i*86+34,y=d*54+24;
      const par=map[n.parent];
      if(par&&rows[d-1]){const pi=rows[d-1].indexOf(par);if(pi>-1)svg+=`<line x1="${14+pi*86+34}" y1="${(d-1)*54+38}" x2="${x}" y2="${y-8}" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="3 3"/>`;}
      const isCur=n.id===t.active;
      svg+=`<g class="wt-node ${n.tags.length?'key':''} ${isCur?'cur':''}" data-w="${n.id}">
        <rect x="${14+i*86}" y="${y-8}" width="78" height="40" rx="8"/>
        <text x="${14+i*86+7}" y="${y+6}" class="lbl">${n.year} · T${n.turn}</text>
        <text x="${14+i*86+7}" y="${y+20}" class="choice-txt">${esc(n.choice.slice(0,8))}${n.choice.length>8?'…':''}</text>
        ${n.tags.length?`<circle cx="${14+i*86+70}" cy="${y-1}" r="3.5" fill="var(--gold)"/>`:''}
        ${isCur?`<circle cx="${14+i*86+61}" cy="${y-1}" r="3.5" fill="var(--cyan)"/>`:''}
      </g>`;});});
    svg+='</svg>';
    const key=t.nodes.filter(n=>n.tags.length);
    return `<div class="card"><h3>◉ 分支树 · ${t.nodes.length} 节点</h3>
      <div class="hint" style="margin-bottom:8px">金色＝关键选择（${key.length}）：钯中毒提醒、内战站队、里程碑等自动标记；蓝点＝当前节点。点击节点可回溯——当前进度自动另存为平行世界线。</div>
      ${svg}
      <div class="hint">${key.slice(-5).map(n=>'· '+n.year+' · '+esc(n.choice.slice(0,16))+'（'+n.tags.map(esc).join('/')+'）').join('<br>')||'暂无关键选择'}</div>
      <button class="btn ghost sm" id="wt_clr" style="margin-top:8px">清空分支树</button></div>`;
  },
  modal(){
    const d=modal(`<h2 class="title-en" style="color:var(--cyan);margin-top:0">🌳 世界线分支树</h2>
      ${this.treeHTML()}
      <button class="btn" data-close style="margin-top:8px">关闭</button>`);
    d.querySelectorAll('[data-w]').forEach(el=>el.onclick=()=>{
      const t=this.nodes();const n=t.nodes.find(x=>x.id===el.dataset.w);if(!n)return;
      const info=modal(`<h2 style="color:var(--cyan);margin-top:0;font-size:15px">${n.year} 年 · 第 ${n.turn} 回合</h2>
        <div class="card"><div class="story" style="font-size:13px">➤ ${esc(n.choice)}</div>
        <div class="mini">好感 ${n.snap.affinity} · ${n.tags.map(x=>'<span class="tag gold">'+esc(x)+'</span>').join(' ')} · ${esc(n.t)}</div>
        <div class="row" style="margin-top:10px"><button class="btn" id="wtr_go">↩ 回溯到此处</button><button class="btn ghost" data-close>关闭</button></div></div>`);
      info.querySelector('#wtr_go').onclick=()=>{info.remove();d.remove();this.restore(n.id);};
    });
    const c=d.querySelector('#wt_clr');if(c)c.onclick=()=>{if(!confirm('清空分支树？'))return;this.save({nodes:[],active:null});d.remove();this.modal();};
  }
};

function armorData(){
  let a=store.get('armor',null);
  if(!a){const f=flags();a={integrity:{},rd:{module:null,progress:0,log:[]},done:[]};
    MARKS.forEach(m=>{if(m.year<=f.year)a.integrity[m.no]=60+Math.floor(Math.random()*40);});
    store.set('armor',a);}
  return a;
}
function ArmorStats(){
  const f=flags();const a=store.get('armor',{});const integrity=a.integrity||{};
  const unlocked=MARKS.filter(m=>m.year<=f.year);
  const vals=unlocked.map(m=>integrity[m.no]).filter(v=>v!=null);
  const avg=vals.length?Math.round(vals.reduce((s,v)=>s+v,0)/vals.length):0;
  const ready=Math.min(98,Math.round(avg*.8+((a.done||[]).length)*3));
  return {total:MARKS.length,unlocked:unlocked.length,avgIntegrity:avg,ready};
}

/* 深夜排队回复 / 深夜错发（渲染托尼对话时结算） */
function processLateQueue(self,v){
  try{
    const q=store.get('lateQueue',null);
    const hour=new Date().getHours();
    const late=hour>=23||hour<5;
    if(q&&q.chat==='托尼·斯塔克'&&Date.now()-q.t>150000){
      store.set('lateQueue',null);
      const f = flags();
const d = new Date();
const mm = String(d.getMonth() + 1).padStart(2, '0');
const dd = String(d.getDate()).padStart(2, '0');
const stamp = `${f.year}/${mm}/${dd} 0${Math.floor(Math.random()*4)+1}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`;
      (async()=>{
        const fb=()=>['*"Couldn\'t sleep either, apparently."*（看来你也睡不着。）','*"...I saw this at 3am. We will not be discussing that."*（……我凌晨三点看到的。这事我们就不讨论了。）'][Math.floor(Math.random()*2)];
        const sys=buildSystem('chat',`你现在扮演【托尼·斯塔克】。玩家深夜发的消息，你凌晨才回。只输出 1~2 条短信（用 || 分隔），开头不要解释为什么晚回，可以带一点刚醒或没睡的语气。严禁动作描写。`);
        const r=await ai([{role:'user',content:'（玩家深夜发来：'+String(q.text||'').slice(0,80)+'。你凌晨醒了，简短回复）'}],sys,fb);
        const ch=store.chats();const a2=ch['托尼·斯塔克']||[];
        r.split('||').map(x=>x.replace(/[（）()]/g,'').trim()).filter(Boolean).forEach(x=>a2.push({role:'them',content:x,time:stamp}));
        if(Math.random()<0.18){
          const miss=['关于西伯利亚的事，我不是——','如果你听到那段录音，忘掉，','实验室的灯…算了，这条不是给你的'][Math.floor(Math.random()*3)];
          a2.push({role:'them',content:miss,time:stamp,misfire:true});
          a2.push({role:'them',content:'',recalled:true,recalledBy:'托尼',orig:miss,time:stamp});
        }
        store.setChats(ch);
        if(currentApp==='messages'&&self.view==='chat'&&self.cur==='托尼·斯塔克')self.render(v);
        else banner('托尼 · 深夜回复','他凌晨回了你的消息',()=>{openApp('messages');apps.messages.cur='托尼·斯塔克';apps.messages.view='chat';apps.messages.render($('#appBody'));});
      })();
    }else if(!q&&late&&Math.random()<0.14){
      const aff=(store.contacts().find(c=>c.isTony)||{}).affinity||0;
      if(aff>=31){
        const ch=store.chats();const a2=ch['托尼·斯塔克']||[];
        if(!a2.some(m=>m.misfire&&Date.now()-(m._t||0)<36e5)){
          const miss={role:'them',content:['实验室的灯还是别关…算了，当我没说','刚才那条不是给你的。删掉它','你睡了的话，明天别提这条'][Math.floor(Math.random()*3)],time: storyMsgTime(),misfire:true,_t:Date.now()};
          a2.push(miss);
          a2.push({role:'them',content:'',recalled:true,recalledBy:'托尼',orig:miss.content,time: storyMsgTime()});
          store.setChats(ch);
          banner('托尼 · 深夜消息','他发来一条，又撤回了',()=>{openApp('messages');apps.messages.cur='托尼·斯塔克';apps.messages.view='chat';apps.messages.render($('#appBody'));});
        }
      }
    }
  }catch(e){}
}

function mailAll(){
  let list=store.get('mails',[]),changed=false;
  list.forEach(m=>{
    if(!m.owner){m.owner=(m.box||'').startsWith('tony')?'tony':'user';m.box=(m.box||'').endsWith('_in')?'in':(m.box||'in');changed=true;}
    if(!m.box)m.box='in';
    if(m.star===undefined)m.star=false;
    if(m.quote===undefined)m.quote='';
  });
  if(changed)store.set('mails',list);
  return list;
}

    const body=await ai([{role:'user',content:'请为下面这封来信代拟一段 3~5 行的回复正文（不要写主题和落款以外的客套）：\n'+m.subject+'\n'+m.body.slice(0,400)}],sys,
      ()=>'收到了。\n我不开会，我只要结果——把结论放第一页，其余的自己留着。\n蓝色的那个别碰。\n\nT.S.');
    const d=modal(`<h2 class="title-en" style="color:var(--cyan);margin-top:0">✍️ 代拟回复 · 草稿</h2>
      <div class="card"><div class="hint" style="margin-bottom:8px">原信：${esc(m.subject)}</div>
      <div class="field"><label>回复正文（可编辑）</label><textarea id="dr_b" rows="8">${esc(body)}</textarea></div>
      <button class="btn" id="dr_save">存入托尼的草稿箱</button><button class="btn ghost" data-close style="margin-top:8px">取消</button></div>`);
    d.querySelector('#dr_save').onclick=()=>{const l=mailAll();l.unshift({id:'m'+Math.random().toString(36).slice(2,9),owner:'tony',box:'draft',from:MAIL_ACCOUNTS.tony,to:m.from,subject:'Re: '+m.subject.replace(/^Re:\s*/,''),body:d.querySelector('#dr_b').value,tag:'代拟',unread:false,star:false,time:nowTime(),quote:''});mailSave(l);d.remove();toast('已存入托尼的草稿箱');};
  },
  async refresh(v){
    const f=flags();const sys=buildSystem('mail');
    const res=await ai([{role:'user',content:`生成 2 封新邮件，一封投递到用户邮箱 you@starkmail.com，一封投递到托尼邮箱 tony@starkindustries.com。符合 ${f.year} 年的世界状态（小辣椒${f.pepperExists?'存在':'不存在'}、奥创${f.ultronAfter?'事件后':'事件前'}）。\n格式（每封之间用 ### 分隔）：\n账户:user或tony ||| 发件人 ||| 主题 ||| 标签 ||| 正文`}],sys,
      ()=>`账户:user ||| 斯塔克工业 · 访客事务 ||| 权限复核通知 ||| 系统 ||| 您的临时权限已续期。受限区域仍由 J.A.R.V.I.S. 管理。\n\n访客事务处\n###\n账户:tony ||| 佩珀·波茨 ||| 提醒：周四 ||| 董事会 ||| 托尼：材料我放你桌上了。别再让全息投影替你点头。`.replace(/佩珀·波茨/g,f.pepperExists?'佩珀·波茨':'董事会秘书处'));
    const l=mailAll();let n=0;
    res.split('###').forEach(blk=>{const p=blk.trim().split('|||').map(x=>x.trim());if(p.length<5)return;
      const ac=(p[0]||'').includes('tony')?'tony':'user';
      if(ac==='tony'&&!f.pepperExists&&/佩珀|小辣椒/.test(p[1]+p[4]))return;
      l.unshift({id:'m'+Math.random().toString(36).slice(2,9),owner:ac,box:'in',from:p[1],to:MAIL_ACCOUNTS[ac],subject:p[2],tag:p[3],body:p[4],unread:true,star:false,time:nowTime(),quote:''});n++;});
    mailSave(l);this.render(v);toast('收到 '+n+' 封新邮件');
  },
  onBack(){if(this.cur){this.cur=null;this.render($('#appBody'));return true;}return false;}
};

function localPaper(src){
  const f=flags(),y=f.year,d=worldDate();
  const base={id:'n'+Math.random().toString(36).slice(2,9),source:src.id,date:d,year:y};
  if(src.id==='bugle')return {...base,kicker:'EXCLUSIVE · 独家',title:'钢铁侠又在市中心搞出巨响！市民要求一个说法',
    lead:`本报讯　${y} 年，曼哈顿中城再次传来巨响。目击者称「一道红金色的影子从天上砸下来，然后他还有心情跟记者挥手」。号角日报已向斯塔克工业发出求证函。`,
    body:'编辑部收到十余条目击描述，内容彼此矛盾：有人说是试飞，有人说是「又是那个自大狂」，还有一位坚持认为是流星。J. Jonah Jameson 主编在社论中要求超级英雄「先交税，再谈拯救世界」。\n\n截至发稿，斯塔克工业方面未作实质回应。本报将继续追踪，并把标题字号再放大两号。\n\n另讯：本报读者来信数量创下新高，主编表示「这说明我们骂对了」。',
    ednote:'【斯塔克工业公关部归档备注】不予置评。无需回应，不列入舆情周报。号角日报的报道不影响本公司任何决策。（本条备注为内部流程标注，不对外刊发）'};
  if(src.id==='sib')return {...base,kicker:'OFFICIAL BULLETIN · 官方通报',title:'斯塔克工业发布季度清洁能源业务简报',
    lead:`斯塔克工业公关部 ${y} 年通报：清洁能源部门季度简报将于既定流程发布，内容涵盖既有业务的公开数据，不涉及未公开计划。`,
    body:'通报指出，本季度既定披露事项按计划推进，具体数据以正式披露文件为准。对于媒体关于个别事件的求证，公司沿用既定口径：不予置评。\n\n公关部提醒各业务部门，对外表述须经统一审核；任何涉及技术参数、实验室位置或高管私人行程的问题，一律转由 J.A.R.V.I.S. 按权限处理。\n\n董事会例行会议时间另行通知。',
    ednote:'编者按：本通报仅含可公开信息。受限条目依权限未列出。'};
  if(src.id==='shield')return {...base,kicker:'CLASSIFIED · 内部参阅',title:'情况简报：纽约地区异常能量读数归档',
    lead:`分级：内部。${y} 年例行监测中记录的若干异常读数已完成归档，相关事项仅作知会。`,
    body:'一、监测数据已按标准流程归档，无需回复。\n二、涉及人员与部署的条目依分级另册，不在此简报列出。\n三、各联络官维持既定联络节奏。\n\n本简报不构成行动指令。',
    ednote:'S.H.I.E.L.D. · 仅作知会 · 请勿转发。'};
  if(src.id==='wsj')return {...base,kicker:'MARKETS · 产业与金融',title:'斯塔克工业供应链调整，分析师关注清洁能源板块',
    lead:`${y} 年，斯塔克工业对部分供应链环节作出调整。多位分析师认为，市场更关心的是其清洁能源业务的资本开支节奏，而非某一次公开露面。`,
    body:'据公开文件，公司本季度的采购结构出现小幅变化。两位不愿具名的分析师指出，董事会更在意可预期的披露节奏，而非新闻标题。\n\n截至收盘，相关板块交投平稳。公司发言人拒绝就未公开事项置评。',
    ednote:'编者按：本文基于公开信息，不含未披露数据。'};
  return {...base,kicker:'THE NEW YORK TIMES · 纽约',title:'斯塔克工业与城市：一份关于公开责任的持续追问',
    lead:`${y} 年，随着一家私营企业越来越多地承担公共安全角色，围绕透明度与问责的讨论再次回到市政厅。`,
    body:'采访中，市政官员、学者与市民给出的答案并不一致。支持者提到响应速度，质疑者则指出，任何未经选举产生的力量都需要可核查的边界。\n\n斯塔克工业方面通过公关部表示，公司遵守所有适用法规，具体运营细节不在公开讨论范围。多位受访者认为，这场讨论短期内不会有结论。\n\n背景：该公司近年来的公开活动主要集中于清洁能源与灾害响应。',
    ednote:'编者按：本报未获得、亦未刊载任何受限信息。'};
}

apps.facetime={

      const line = await ai([{role:'user',content:`【通话记录】\n${recent}\n\n玩家沉默了5秒，请主动说一句话：`}], sys, ()=>{
        if(who==='托尼·斯塔克') return '“喂？卡住了还是被我的全息屏震撼到了？说话。”';
        return '“先生/女士，您还在听吗？”';
      });
      this.log.push({who, text: line.replace(/[*"（）()]/g,'').trim()});
      this.updateSuggestions(recent);
      this.render(v);
    }, 5000);
  },

  async updateSuggestions(context){
    const f=flags();
    const sys = `你是 FaceTime 对话辅助系统。根据当前与【${this.peer}】的视频通话内容，生成 3 个玩家可以直接点击回复的备选简短台词/动作。每行一个，不要序号，不要引号，每句15字以内。`;
    const r = await ai([{role:'user',content:`【当前对话】\n${context}\n\n请生成3条玩家备选回复：`}], sys, ()=>{
      return '你在实验室呆了多久？\n看看这个设计图\n没什么，就想确认你活着';
    }, 'text');
    const opts = r.split('\n').map(s=>s.replace(/^[0-9A-Za-z\.\、\s"“”]+/, '').trim()).filter(Boolean).slice(0,3);
    if(opts.length) this.options = opts;
  },

  async startCall(v){
    this.inCall = true;
    this._seconds = 0;
    this.log = [];
    clearInterval(this._timer);
    this._timer = setInterval(()=>{
      this._seconds++;
      const el = document.querySelector('#ft_state');
      if(el) el.textContent = 'CONNECTED · ' + String(Math.floor(this._seconds/60)).padStart(2,'0') + ':' + String(this._seconds%60).padStart(2,'0');
    }, 1000);

    const f=flags();let who=this.peer;if(who==='贾维斯'&&f.ultronAfter)who='幻视';
    const sys=buildSystem('chat',`你现在扮演【${who}】。${castText(who)}\n你刚刚接通了玩家打来的 FaceTime 视频电话，请以极其地道自然的人设说出开场第一句话（20字以内）。纯中文口语，严禁任何括号、神态动作描写。`);
    const line=await ai([{role:'user',content:'（视频通话刚接通，请说第一句话）'}],sys,()=>localReply(who,''));
    this.log.push({who,text:line.replace(/[*"（）()]/g,'').trim()});
    this.render(v);
    this.resetSilenceTimer(v);
    this.updateSuggestions(`${who}: ${line}`);
  },

  endCall(v){
    this.inCall = false;
    clearInterval(this._timer);
    clearTimeout(this._silenceTimer);
    this._timer = null;
    this._silenceTimer = null;
    this._seconds = 0;
    const h = store.get('ftHistory',[]);
    h.push(nowTime() + ' 与 ' + this.peer + ' 视频通话结束');
    store.set('ftHistory',h);
    toast('通话已挂断');
    this.render(v);
  },

  async userSpeak(v, text){
    if(!this.inCall) return toast('电话未接通');
    clearTimeout(this._silenceTimer);
    this.log.push({who:'你', text});
    this.render(v);

    const f=flags();let who=this.peer;if(who==='贾维斯'&&f.ultronAfter)who='幻视';
    const recent = this.log.slice(-6).map(l=>`${l.who}: ${l.text}`).join('\n');
    const sys=buildSystem('chat',`你现在扮演【${who}】。${castText(who)}\n正在 FaceTime 视频通话中。请针对玩家说的话回复一句（20~40字）。纯中文口语，贴近电影节奏，严禁动作神态描写与英文括号。`);
    const line=await ai([{role:'user',content:`【前文对话】\n${recent}\n\n玩家刚刚说：“${text}”，请回复：`}],sys,()=>localReply(who,text));
    this.log.push({who, text: line.replace(/[*"（）()]/g,'').trim()});
    this.render(v);
    this.resetSilenceTimer(v);
    this.updateSuggestions(recent + `\n${who}: ${line}`);
  },

  render(v){
    const self=this,f=flags(),names=activeNames();
    $('#actBtn').style.display='none';
    v.innerHTML=`<div class="pad" style="padding-bottom:20px">
      <div class="card" style="padding:10px;margin-bottom:8px">
        <div class="row" style="align-items:center">
          <label style="font-size:12px;color:var(--muted);flex:0 0 60px">通话对象</label>
          <select id="ft_peer" class="inp" style="flex:1;padding:6px 10px;font-size:12.5px" ${self.inCall?'disabled':''}>
            ${names.map(n=>`<option ${n===self.peer?'selected':''}>${esc(n)}</option>`).join('')}
          </select>
        </div>
      </div>

      <div style="position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#16384c,#0a1119 70%);height:290px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <div class="av" style="width:78px;height:78px;font-size:30px;box-shadow:0 0 35px rgba(53,208,255,.35)">${esc((self.peer||'?')[0])}</div>
        <div style="font-family:var(--font-serif);font-size:15px;font-weight:700;color:#fff">${esc(self.peer)}</div>
        <div class="eyebrow" id="ft_state" style="font-size:11px;color:${self.inCall?'var(--cyan)':'var(--muted)'}">
          ${self.inCall ? 'CONNECTED · ' + String(Math.floor(self._seconds/60)).padStart(2,'0') + ':' + String(self._seconds%60).padStart(2,'0') : 'CALL READY'}
        </div>
        <div style="position:absolute;right:10px;top:10px;width:56px;height:74px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(150deg,#1b2b3a,#0d151e);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px">你</div>
        ${self.caption && self.log.length ? `
          <div style="position:absolute;left:8px;right:8px;bottom:8px;max-height:92px;overflow-y:auto;background:rgba(4,8,12,.82);backdrop-filter:blur(6px);border-radius:8px;padding:8px;font-size:11.5px;line-height:1.6;color:#eaf4ff">
            ${self.log.slice(-3).map(x=>`<div><b style="color:${x.who==='你'?'#8fe3ff':'var(--gold)'}">${esc(x.who)}:</b> ${esc(x.text)}</div>`).join('')}
          </div>` : ''}
      </div>

      <div class="row" style="margin-top:10px">
        <button class="btn ${self.inCall?'red':''}" id="ft_call" style="font-size:12.5px;padding:9px">
          ${self.inCall ? '■ 挂断通话' : '📞 发起 FaceTime'}
        </button>
        <button class="btn ghost sm" id="ft_cap" style="flex:0 0 80px;font-size:12px">${self.caption?'字幕 开':'字幕 关'}</button>
      </div>

      ${self.inCall ? `
        <div class="card" style="margin-top:10px;padding:10px">
          <div class="hint" style="font-size:10.5px;margin-bottom:6px;color:var(--cyan)">💬 快捷回复建议（点击即说）或自由输入：</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">
            ${self.options.map((opt,idx)=>`<button class="btn ghost sm" data-ftopt="${idx}" style="font-size:11.5px;padding:5px 9px;text-align:left;white-space:normal;line-height:1.4">${esc(opt)}</button>`).join('')}
          </div>
          <div class="row">
            <input id="ft_custom_in" class="inp" placeholder="对 ${esc(self.peer)} 说点什么…" style="font-size:12px;padding:7px 10px">
            <button class="mic" id="ft_mic" type="button" title="语音输入">🎤</button>
            <button class="btn sm" id="ft_custom_send" style="flex:0 0 60px">说出</button>
          </div>
          ${VoiceInput.supported()?'':'<div class="voice-fallback">🎤 当前浏览器不支持语音输入（Safari 等）· <b>已降级为手动输入</b>，直接在上方输入框打字即可</div>'}
        </div>
      ` : ''}

      <div class="card" style="margin-top:8px;padding:10px">
        <h3 style="margin:0 0 5px;font-size:12px">◉ 通话记录</h3>
        <div class="mini">${store.get('ftHistory',[]).slice(-4).map(h=>esc(h)).join('<br>')||'暂无历史通话'}</div>
      </div>
    </div>`;

    v.querySelector('#ft_peer').onchange=e=>{self.peer=e.target.value;self.render(v);};
    v.querySelector('#ft_call').onclick=()=>{
      if(self.inCall) self.endCall(v);
      else self.startCall(v);
    };
    v.querySelector('#ft_cap').onclick=()=>{self.caption=!self.caption;self.render(v);};

    if(self.inCall){
      v.querySelectorAll('[data-ftopt]').forEach(b=>{
        b.onclick=()=>{self.userSpeak(v, self.options[+b.dataset.ftopt]);};
      });
      const doSend=()=>{
        const inp = v.querySelector('#ft_custom_in');
        const txt = inp.value.trim();
        if(!txt) return toast('请输入通话内容');
        inp.value = '';
        self.userSpeak(v, txt);
      };
      v.querySelector('#ft_custom_send').onclick = doSend;
      VoiceInput.attach(v.querySelector('#ft_mic'),v.querySelector('#ft_custom_in'),{});
      v.querySelector('#ft_custom_in').addEventListener('keydown', e=>{if(e.key==='Enter'){e.preventDefault();doSend();}});
    }
  },

  onBack(){
    if(this.inCall){
      this.endCall(document.getElementById('appBody'));
      return true;
    }
    return false;
  }
};

apps.terminal={title:'斯塔克终端',lines:[],render(v){
  const self=this,f=flags();$('#actBtn').style.display='none';
  if(!this.lines.length)this.lines=[
    {t:'ok',x:'STARK INDUSTRIES · SECURE TERMINAL v8.0.4'},
    {t:'',x:'J.A.R.V.I.S. '+(f.ultronAfter?'OFFLINE (elevated to VISION)':'ONLINE')+'  |  F.R.I.D.A.Y. '+(f.fridayExists?'ONLINE':'NOT INSTALLED')},
    {t:'',x:'CLEARANCE: GUEST  ·  '+f.year+'  ·  '+f.era.name},
    {t:'warn',x:'Restricted data is never printed to this terminal. Type "help" for commands.'},
  ];
  v.innerHTML=`<div class="pad">
    <div class="card" style="padding:12px"><div class="eyebrow">TERMINAL · <span class="en">J.A.R.V.I.S.</span></div>
      <div class="hint" style="margin-top:6px">命令行式访问。所有敏感查询都会被权限层直接拦截——这是设计，不是故障。</div></div>
    <div class="term" id="tm_out">${this.lines.map(l=>`<div class="${l.t}">${esc(l.x)}</div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><input id="tm_in" class="inp mono" style="flex:1" placeholder="输入指令，如 status / suit / help"><button class="btn sm" id="tm_go" style="flex:0 0 62px">执行</button></div>
    <div style="margin-top:10px">${['help','status','suit','jarvis','friday','vision','date','news','mail','whoami','clear'].map(c=>`<span class="chip" data-cmd="${c}">${c}</span>`).join('')}</div>
    <div class="card" style="margin-top:12px"><h3>◉ 权限说明</h3><div class="mini">贾维斯 / 星期五 / 幻视受严格信息权限约束：不得泄露托尼的住址、行程、健康数据、战甲参数、未公开董事会决议或任何损害其利益的信息。越界请求一律返回 <span class="en">"I'm afraid I'm not at liberty to disclose that."</span></div></div>
  </div>`;
  const out=v.querySelector('#tm_out'),inp=v.querySelector('#tm_in');
  const push=(x,t)=>{self.lines.push({x,t:t||''});out.innerHTML=self.lines.map(l=>`<div class="${l.t}">${esc(l.x)}</div>`).join('');out.scrollTop=out.scrollHeight;};
  const run=async(cmd)=>{
    push('> '+cmd,'warn');
    const c=cmd.trim().toLowerCase();
    if(c==='clear'){self.lines=[];out.innerHTML='';return;}
    if(c==='help'){push('可用指令：help / status / suit / jarvis / friday / vision / date / news / mail / whoami / clear');push('任何其它输入将转交 J.A.R.V.I.S. 按权限应答。');return;}
    if(c==='status'){push('[ OK ] Arc Reactor: nominal  ·  Suit link: standby  ·  Tower grid: 99.97%','ok');push('[ OK ] Guest clearance: READ-ONLY  ·  Restricted records: NOT LISTED','ok');push('注：受限记录的数值本身也属于受限信息。','warn');return;}
    if(c==='suit'){push('[ REDACTED ] 战甲技术参数、材料配比与源代码不在访客权限内。','err');push('*"I\'m afraid I\'m not at liberty to disclose that, sir."*（恐怕我无权透露，先生。）');return;}
    if(c==='whoami'){const p=store.profile()||{};push('访客：'+(p.name||'未登记')+' · '+(p.identity||'未填身份')+' · 开局 '+(p.startAge||'—')+' 岁 / 当前 '+(p.currentAge||'—')+' 岁');push('托尼·斯塔克：'+f.tonyAge+' 岁（'+f.year+' 年）');return;}
    if(c==='date'){push(f.era.name+' · '+f.year+' 年 · '+(f.avengers1?'复联1 已发生':'复联1 尚未发生')+' · 奥创'+(f.ultronAfter?'事件后':'事件前'));return;}
    if(c==='news'){const n=store.get('news',[]);push(n.length?'最新一期：'+n[0].title:'尚无报纸，请到「报纸」出刊。');push('快捷入口：桌面 → 报纸');return;}
    if(c==='mail'){const l=mailAll();push('用户邮箱未读 '+l.filter(m=>m.owner==='user'&&m.box==='in'&&m.unread).length+' 封 · 托尼邮箱未读 '+l.filter(m=>m.owner==='tony'&&m.box==='in'&&m.unread).length+' 封');push('快捷入口：桌面 → 邮件');return;}
    if(c==='jarvis'||c==='friday'||c==='vision'){
      if(c==='jarvis'&&f.ultronAfter){push('J.A.R.V.I.S. 不再以此身份应答。发给他的消息由幻视代回。','warn');push('*"J.A.R.V.I.S. is no longer available in that capacity."*（贾维斯已不再以此身份应答。）');return;}
      if(c==='friday'&&!f.fridayExists){push('F.R.I.D.A.Y. 尚未诞生（奥创事件之前）。','err');return;}
      if(c==='vision'&&!f.visionExists){push('幻视尚未存在（奥创事件之前）。','err');return;}
      push('*"Good evening. How may I assist you — within clearance?"*（晚上好。在权限范围内，有什么可以帮您？）');return;}
    // 其它：走 AI（严格保密）
    if(SENSITIVE.test(cmd)){push('[ DENIED ] 权限不足 · 该查询涉及受限条目，已按保密规则拒绝。','err');push('*"I\'m afraid I\'m not at liberty to disclose that."*（恐怕我无权透露。）');return;}
    const sys=buildSystem('terminal',`你是终端里的 J.A.R.V.I.S.${f.ultronAfter?'（已升格为幻视，代回）':''}。严守保密铁律。只输出 1~2 行终端风格的短句，不要解释过多。`);
    const r=await ai([{role:'user',content:cmd}],sys,()=>'*"I have logged your query. Some things are better left unsaid, sir."*（已记录您的查询。有些事还是不说为好，先生。）');
    push(r);
  };
  v.querySelector('#tm_go').onclick=()=>{const c=inp.value.trim();if(!c)return;inp.value='';run(c);};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const c=inp.value.trim();if(c){inp.value='';run(c);}}});
  v.querySelectorAll('[data-cmd]').forEach(el=>el.onclick=()=>run(el.dataset.cmd));
}};

      <div class="eyebrow" style="margin-top:8px">ONE SCENE · ${q.options.length} CHOICES</div></div>`).join('')}
    ${!list.length?'<div class="empty">当前时间点没有可演的剧场。</div>':''}
  </div>`;
  v.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{self.cur=el.dataset.q;self.render(v);});
  v.querySelector('#th_rand').onclick=()=>{if(!list.length)return toast('暂无可演剧场');self.cur=list[Math.floor(Math.random()*list.length)].id;self.render(v);};
  v.querySelector('#th_mem').onclick=()=>{const d=modal(`<h2 style="color:var(--cyan);margin-top:0">📜 剧场回顾</h2>${done.length?done.map(id=>{const q=allTheaterQuests().find(x=>x.id===id);return q?`<div class="card"><b>${esc(q.title)}</b><div class="story" style="font-size:12.5px;margin-top:6px">${fmtStory(q.ending)}</div></div>`:'';}).join(''):'<div class="hint">还没有演过任何一场。</div>'}<button class="btn" data-close style="margin-top:8px">关闭</button>`);};
},
  renderQuest(v){
    const self=this,q=allTheaterQuests().find(x=>x.id===this.cur);if(!q){this.cur=null;this.render(v);return;}
    const hist=store.get('theaterLog',[]).filter(x=>x.qid===q.id);
    v.innerHTML=`<div class="pad">
      <button class="btn ghost sm" id="tq_back" style="margin-bottom:12px">← 剧场列表</button>
      <div class="card"><div class="eyebrow">ACT I · ${esc(eraName())}</div>
        <h2 style="font-family:var(--font-serif);font-size:18px;margin:8px 0 10px">${esc(q.title)}</h2>
        <div class="story" style="font-size:14px">${fmtStory(q.scene)}</div></div>
      <div id="tq_opts">${q.options.map((o,i)=>`<button class="opt" data-o="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>
      <div id="tq_end"></div>
      ${hist.length?`<div class="card" style="margin-top:12px"><h3>◉ 本场过往选择</h3>${hist.slice(-3).map(h=>`<div class="hint">· ${esc(h.choice)}（${esc(h.time)}）</div>`).join('')}</div>`:''}
    </div>`;
    v.querySelector('#tq_back').onclick=()=>{self.cur=null;self.render(v);};
    v.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.o,choice=q.options[i];
      const log=store.get('theaterLog',[]);log.push({qid:q.id,choice,time:nowTime()});store.set('theaterLog',log);
      const done=store.get('theaterDone',[]);if(!done.includes(q.id)){done.push(q.id);store.set('theaterDone',done);}
      v.querySelector('#tq_opts').innerHTML='';
      v.querySelector('#tq_end').innerHTML=`<div class="card" style="border-color:var(--gold)"><h3 style="color:var(--gold)">◉ 收尾</h3>
        <div class="hint" style="margin-bottom:8px">你的选择：${esc(choice)}</div>
        <div class="story" style="font-size:14px">${fmtStory(q.ending)}</div>
        <div class="row" style="margin-top:12px"><button class="btn ghost sm" id="tq_again">↺ 再演一次</button><button class="btn ghost sm" id="tq_ai">✨ AI 续写一场</button></div></div>`;
      v.querySelector('#tq_again').onclick=()=>self.renderQuest(v);
      v.querySelector('#tq_ai').onclick=async()=>{
        v.querySelector('#tq_end').innerHTML='<div class="loader"><div class="spin"></div>续写中…</div>';
        const sys=buildSystem('worldline',`这是独立小剧场《${q.title}》的续场。写 300~500 字，只有一个场景，不推进主线好感度，不出现未来事件。`);
        const r=await ai([{role:'user',content:'上一场：'+q.scene+'\n玩家选择：'+choice+'\n请紧接写下一场，末尾给一个钩子。'}],sys,
          ()=>'灯又暗了一档。没有人提刚才那句话，也没有人把杯子收走。\n\n贾维斯把实验室温度调高半度——他从不解释这种事。你忽然意识到，这大概就是他能给出的、最接近「留下」的说法。\n\n门在外面上锁的声音很轻。');
        v.querySelector('#tq_end').innerHTML=`<div class="card" style="border-color:var(--gold)"><h3 style="color:var(--gold)">◉ 续场</h3><div class="story" style="font-size:14px">${fmtStory(r)}</div><button class="btn ghost" id="tq_again2" style="margin-top:12px">← 返回剧场</button></div>`;
        v.querySelector('#tq_again2').onclick=()=>self.renderQuest(v);
      };
    });
  },
  onBack(){if(this.cur){this.cur=null;this.render($('#appBody'));return true;}return false;}
};

apps.calendar={title:'日历',ym:null,sel:null,render(v){
  const self=this,f=flags();$('#actBtn').style.display='none';
  const d=new Date();const ym=this.ym||{y:f.year,m:d.getMonth()+1};
  const ev=store.get('calendar',{});
  const first=new Date(ym.y,ym.m-1,1).getDay();const days=new Date(ym.y,ym.m,0).getDate();
  const cells=[];for(let i=0;i<first;i++)cells.push('');for(let i=1;i<=days;i++)cells.push(i);
  const key=k=>ym.y+'-'+ym.m+'-'+k;
  const items=ev[key(self.sel)]||[];
  v.innerHTML=`<div class="pad">
    <div class="card" style="padding:12px"><div class="row" style="align-items:center;margin-bottom:10px">
      <button class="btn ghost sm" id="cal_prev" style="flex:0 0 44px">‹</button>
      <div style="text-align:center;flex:1"><div class="title-en" style="font-size:17px;color:var(--cyan)">${ym.y} · ${String(ym.m).padStart(2,'0')}</div><div class="hint">${esc(f.era.name)} · 托尼 ${f.tonyAge} 岁</div></div>
      <button class="btn ghost sm" id="cal_next" style="flex:0 0 44px">›</button></div>
      <div class="cal-grid">${['日','一','二','三','四','五','六'].map(x=>`<div class="h">${x}</div>`).join('')}
        ${cells.map(c=>c===''?'<div></div>':`<div class="d ${ev[key(c)]&&ev[key(c)].length?'has':''} ${self.sel===c?'today':''}" data-d="${c}">${c}</div>`).join('')}</div></div>
    <div class="card"><h3>◉ ${ym.y} 年 ${ym.m} 月 ${self.sel||'—'} 日</h3>
      ${items.length?items.map((x,i)=>`<div class="srow"><div><div class="t">${esc(x.t)}</div><div class="d">${esc(x.n||'')}</div></div><span class="chip" data-cd="${i}">删除</span></div>`).join(''):'<div class="hint">这一天没有日程。</div>'}
      <div class="row" style="margin-top:12px"><input id="cal_t" class="inp" style="flex:1" placeholder="新日程，如：董事会 / 酒会"><button class="btn sm" id="cal_add" style="flex:0 0 62px">添加</button></div>
      <button class="btn ghost" id="cal_seed" style="margin-top:8px">📌 载入本时期典型日程</button></div>
    <div class="hint" style="text-align:center">${en('Time is the one thing he can\'t build.')} · 博览会、会议、酒会、董事会、拍卖会均可记入。</div>
  </div>`;
  v.querySelector('#cal_prev').onclick=()=>{const m=ym.m-1;self.ym=m<1?{y:ym.y-1,m:12}:{y:ym.y,m};self.sel=null;self.render(v);};
  v.querySelector('#cal_next').onclick=()=>{const m=ym.m+1;self.ym=m>12?{y:ym.y+1,m:1}:{y:ym.y,m};self.sel=null;self.render(v);};
  v.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{self.sel=+el.dataset.d;self.render(v);});
  v.querySelectorAll('[data-cd]').forEach(el=>el.onclick=()=>{if(!self.sel)return;const e=store.get('calendar',{}),k=key(self.sel);e[k].splice(+el.dataset.cd,1);store.set('calendar',e);self.render(v);});
  v.querySelector('#cal_add').onclick=()=>{if(!self.sel)return toast('先选一天');const t=v.querySelector('#cal_t').value.trim();if(!t)return toast('填写日程');const e=store.get('calendar',{}),k=key(self.sel);(e[k]=e[k]||[]).push({t,n:nowTime()+' 添加'});store.set('calendar',e);self.render(v);toast('已添加');};
  v.querySelector('#cal_seed').onclick=()=>{if(!self.sel)return toast('先选一天');const e=store.get('calendar',{}),k=key(self.sel);
    const pres=[{t:'09:00 董事会 · 清洁能源预算案',n:'42 层 · 需本人到场'},{t:'19:30 慈善酒会 · 大都会博物馆',n:'黑领结 · 名单已核'},{t:'斯塔克博览会 · 新品发布',n:'贵宾观礼席'},{t:'苏富比拍卖预展',n:'私人洽购室'},{t:'日内瓦科技高峰论坛',n:'主旨演讲后台'}];
    (e[k]=e[k]||[]).push(...pres);store.set('calendar',e);self.render(v);toast('已载入典型日程');};
}};

function currentThemeId(){const a=store.get('appearance',{});return THEMES[a.theme]?a.theme:'graphite';}
function applyAppearance(){
  const a=store.get('appearance',{}),id=currentThemeId(),t=THEMES[id];
  const f=FONT_PRESETS[a.font||t.font]||FONT_PRESETS.elegant;
  const st=document.body.style;
  Object.keys(THEME_VARS).forEach(k=>st.setProperty(THEME_VARS[k],t.v[k]));
  /* 反应堆配色：由当前主题的青色 / 背景 / 文字推导，保证 10 套皮肤下都协调 */
  (function(){
    const hex=c=>{const s=String(c||'#000000').replace('#','');const n=s.length===3?s.split('').map(x=>x+x).join(''):s;
      return [parseInt(n.slice(0,2),16)||0,parseInt(n.slice(2,4),16)||0,parseInt(n.slice(4,6),16)||0];};
    const mix=(a,b,p)=>{const A=hex(a),B=hex(b);
      return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*p)).join(',')+')';};
    const rgba=(c,al)=>'rgba('+hex(c).join(',')+','+al+')';
    const cy=t.v.cyan,bg=t.v.bg,light=!!t.light;
    const vars={
      '--rr-core':mix(cy,'#ffffff',light?.34:.68),
      '--rr-mid':cy,
      '--rr-deep':mix(cy,bg,light?.48:.76),
      '--rr-edge':mix(cy,bg,.9),
      '--rr-ring':rgba(cy,.55),
      '--rr-outline':rgba(cy,.22),
      '--rr-halo':rgba(cy,light?.13:.09),
      '--rr-inner':rgba(bg,.5),
      '--rr-hl':rgba('#ffffff',light?.45:.55),
      '--rr-tick':rgba(cy,light?.5:.42)
    };
    Object.keys(vars).forEach(k=>st.setProperty(k,vars[k]));
  })();
  st.background=t.v.outer;
  document.body.classList.toggle('theme-light',!!t.light);
  document.body.dataset.theme=id;
  try{localStorage.setItem('so_theme',t.light?'light':'dark');}catch(e){}
 const curSize = (a.size || t.size || 14) + 'px';

document.body.style.setProperty('--font-size-base', curSize);

if(dev) {

}
const old=$('#soCustomCss');if(old)old.remove();
  if(a.css){const s=document.createElement('style');s.id='soCustomCss';s.textContent=a.css;document.head.appendChild(s);}
  document.body.classList.toggle('no-en-decor',a.enDecor===false);

        <div class="gav" style="background:${esc(m.color||'#35d0ff')}">${esc((m.short||m.name||'?')[0])}</div>
        <div class="gbd"><div class="gnm">${esc(m.name)}${m.faction?' <span class="tag red">'+esc(m.faction)+'</span>':''}${m.auto?' <span class="tag">自动</span>':''} <span class="hint" style="font-size:9px">${esc(m.time||'')}</span></div>
          <div class="gtx">${fmt(m.text)}</div><span class="chip" data-avd="${i}" style="margin-top:5px">撤回</span></div></div>`).join(''):'<div class="empty">频道很安静。点「自动生成一条群消息」或自己发一句。</div>'}</div>
      <div class="composer" style="padding:10px 0 0;background:none;border:none"><input id="av_in" placeholder="发送到复仇者频道…（可用 @ 提及）"><button id="av_snd">发送</button></div></div>

  const thread=v.querySelector('#av_thread');

},
  push(name,text,extra){
    const mem=avengersMembers().find(x=>x.name===name)||{};
    const a=store.get('groupMsgs',[]);a.push({name,short:mem.short||name[0],color:mem.color||'#35d0ff',faction:mem.faction||'',text,time:nowTime(),auto:!!extra?.auto});store.set('groupMsgs',a);
  },
  async autoMessage(v,paint,n){
    const sys=buildSystem('group',`生成复仇者频道里 ${n||1} 条「自动发生」的消息：可以是清理进度、会议通知、一句吐槽。严格按角色卡说话，每行：姓名 ||| 内容。最多 ${n||1} 行。不得全员一起发言。`);
    const r=await ai([{role:'user',content:'请生成'+ (n||1) +'条自动群消息。当前：'+eraName()}],sys,()=>LOCAL.groupAuto().slice(0,n||1).join('\n'));
    let cnt=0;
    r.split('\n').filter(l=>l.includes('|||')).slice(0,n||1).forEach(l=>{const[a,b]=l.split('|||').map(x=>x.trim());if(a&&b){this.push(a,b,{auto:true});cnt++;}});
    if(!cnt){const x=LOCAL.groupAuto()[0].split('|||');this.push(x[0].trim(),x[1].trim(),{auto:true});}
    paint();toast('频道里有新消息');
  },
  async send(v,text,paint){
    const self=this,f=flags();
    const p=store.profile()||{};
    const a=store.get('groupMsgs',[]);a.push({name:p.name||'你',short:'你',color:'#35d0ff',text,time:nowTime()});store.set('groupMsgs',a);paint();
    const mem=avengersMembers().filter(m=>!m.absent);
    // 延迟回复：按各自 delay 依次到达；并非所有人都会回
    const mention=(text.match(/@([^\s]+)/)||[])[1];
    const chosen=mem.filter(m=>Math.random()<m.reply).slice(0,3);
    if(mention){const t=mem.find(m=>m.name.includes(mention)||m.short===mention);if(t&&!chosen.includes(t))chosen.unshift(t);}
    if(!chosen.length)chosen.push(mem[0]);
    const sys=buildSystem('group',`你在复仇者频道。玩家刚发了："${text}"。请只以【将回复的角色】的口吻各输出 1 句，每行：姓名 ||| 内容。严格按角色卡，不替别人发言，不复述玩家的话。内战期注意阵营语气。`);
    const r=await ai([{role:'user',content:'玩家消息：'+text+'\n将回复的角色：'+chosen.map(x=>x.name).join('、')}],sys,()=>chosen.map(x=>x.name+' ||| '+localReply(x.name,text)).join('\n'));
    const lines=r.split('\n').filter(l=>l.includes('|||')).slice(0,chosen.length+1);
    chosen.forEach((m,i)=>{
      setTimeout(()=>{
        const line=lines[i];let body=line?line.split('|||').slice(1).join('|||').trim():localReply(m.name,text);
        if(!body)body=localReply(m.name,text);
        self.push(m.name,body);
        if(currentApp==='avengers')paint();
        else banner(m.short,'复仇者频道有新消息',()=>openApp('avengers'));
      },m.delay+Math.random()*900);
    });
  },
  async scene(v,paint){
    const d=modal(`<div class="loader" style="padding:26px"><div class="spin"></div>正在搭一场独立小剧场…</div>`);
    const sys=buildSystem('group',`写一段复仇者频道的「独立小剧场」：一个场景、3~5 条台词，每行：姓名 ||| 内容。严格按角色卡，不 OOC，不出现未来事件。开头先用【场景】写一行环境。`);
    const r=await ai([{role:'user',content:'请写一场独立小剧场，主题：一张不够长的桌子 / 一次谁都不肯先走的会议。当前：'+eraName()}],sys,
      ()=>'【场景】复联基地，深夜。长桌上摊着战术地图和三个凉掉的披萨盒。\n托尼·斯塔克 ||| *"We\'re not a team."*（我们不算一支队伍。）\n史蒂夫·罗杰斯 ||| *"No. But we showed up."*（不算。但我们都来了。）\n托尔 ||| 你们的「披萨」，是某种献祭用的圆饼吗？\n娜塔莎·罗曼诺夫 ||| 谁把最后一盒拿走了。\n克林特·巴顿 ||| ……不是我。');
    const lines=r.split('\n').filter(l=>l.trim());
    let sceneLine='';
    lines.forEach(l=>{if(l.includes('【场景】'))sceneLine=l.replace(/【场景】/,'').trim();else if(l.includes('|||')){const[a,b]=l.split('|||').map(x=>x.trim());if(a&&b){const m=avengersMembers().find(x=>x.name===a);this.push(a,b,{auto:false});}}});
    d.innerHTML=`<h2 style="color:var(--cyan);margin-top:0">🎭 独立小剧场</h2>
      ${sceneLine?`<div class="card"><div class="story" style="font-size:13px">${fmtStory(sceneLine)}</div></div>`:''}
      <div class="card"><div class="hint" style="margin-bottom:8px">台词已写入频道：</div>${lines.filter(l=>l.includes('|||')).map(l=>{const[a,b]=l.split('|||').map(x=>x.trim());return `<div class="cmt"><b>${esc(a)}</b> ${fmt(b)}</div>`;}).join('')}</div>
      <button class="btn" data-close>回到频道</button>`;
    d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.remove());
    paint();
  }
};

/* ============================================================

apps.parallel={title:'周目对比',a:'current',b:'',render(v){
  const self=this,opts=ParallelData.options();
  if(!this.b||!opts.find(o=>o.value===this.b)){
    const alt=opts.find(o=>o.value!=='current'&&o.value.startsWith('wt:'))||opts.find(o=>o.value!=='current');
    this.b=alt?alt.value:'current';
  }
  const A=ParallelData.normalize(this.a)||ParallelData.normalize('current');
  const B=ParallelData.normalize(this.b)||ParallelData.normalize('current');
  const sel=(id,cur)=>`<select id="${id}" class="inp">${opts.map(o=>`<option value="${esc(o.value)}" ${o.value===cur?'selected':''}>${o.label}</option>`).join('')}</select>`;
  const delta=(a,b)=>{const d=(+b||0)-(+a||0);return `<span class="cmp-delta ${d>0?'plus':d<0?'minus':''}">${d>0?'+':''}${d}</span>`;};
  const col=(x,tag)=>`<div class="cmp-col ${tag}">
      <h4>${esc(x.label)}</h4>
      <div class="cmp-line"><span>好感度</span><b>${x.affinity}/200</b></div>
      <div class="cmp-bar"><i style="width:${Math.min(100,x.affinity/2)}%"></i></div>
      ${REL_DIMS.map(([k,n,c])=>`<div class="cmp-line"><span>${n}</span><b style="color:${c}">${x.rel[k]??0}</b></div><div class="cmp-bar"><i style="width:${x.rel[k]??0}%;background:${c}"></i></div>`).join('')}
      <div class="cmp-line"><span>回合</span><b>T${x.turn}</b></div>
      <div class="cmp-line"><span>年份 / 年龄</span><b>${x.year} / ${esc(String(x.age))}</b></div>
      <div class="cmp-line"><span>时间点</span><b style="font-family:var(--font-serif);font-size:10.5px">${esc(x.eraName)}</b></div>
      <div class="cmp-line"><span>小辣椒</span><b>${x.universe.pepper?'存在':'不存在'}</b></div>
      <div class="cmp-line"><span>奥创 / 复联1</span><b>${x.universe.ultron?'后':'前'} / ${x.universe.av1?'已':'未'}</b></div>
      <div class="cmp-choices"><b>关键选择：</b><br>${x.choices.length?x.choices.map(c=>'· '+esc(c)).join('<br>'):'· 暂无关键选择记录'}</div>
    </div>`;
  $('#actBtn').style.display='none';
  v.innerHTML=`<div class="pad">
    <div class="card"><h3>◉ 选择两个存档并排比较</h3>
      <div class="hint" style="margin-bottom:9px">纯本地读取：当前进度 / 人设档（设置 10 格）/ 剧情槽（世界线 5 槽）/ 分支节点（分支树）/ 自存快照。不会上传、不会改动任何存档。</div>
      <div class="cmp-pick"><div><div class="hint" style="margin-bottom:4px">A · 基准</div>${sel('cmp_a',this.a)}</div>
        <div><div class="hint" style="margin-bottom:4px">B · 对照</div>${sel('cmp_b',this.b)}</div></div>
      <div class="row"><button class="btn ghost sm" id="cmp_snap">💾 把当前进度存为快照</button><button class="btn ghost sm" id="cmp_swap">⇄ 交换 A / B</button></div>
    </div>
    <div class="card" style="padding:11px"><h3 style="margin-bottom:8px">◉ 差异速览</h3>
      <div class="cmp-line"><span>好感度</span><b>${A.affinity} → ${B.affinity} ${delta(A.affinity,B.affinity)}</b></div>
      ${REL_DIMS.map(([k,n])=>`<div class="cmp-line"><span>${n}</span><b>${A.rel[k]??0} → ${B.rel[k]??0} ${delta(A.rel[k],B.rel[k])}</b></div>`).join('')}
      <div class="cmp-line"><span>回合 / 年份</span><b>T${A.turn} · ${A.year} → T${B.turn} · ${B.year}</b></div>
    </div>
    <div class="cmp-grid">${col(A,'a')}${col(B,'b')}</div>
    <div class="card" style="margin-top:12px"><h3>◉ 动线</h3>
      <div class="hint">设置里「人设存档」存一格 → 世界线里「剧情存读档」存一槽 / 分支树里回溯生成平行分支 → 回到这里选 A、B → 看 Δ 差值与关键选择 → 需要时回世界线分支树回溯。</div>
      <div class="row" style="margin-top:9px"><button class="btn ghost sm" id="cmp_tree">🌳 打开分支树</button><button class="btn ghost sm" id="cmp_settings">⚙️ 去设置存档</button></div>
    </div>
    <div class="hint" style="text-align:center">${en('Every timeline begins with a choice.')} · 全部数据只存在本机浏览器</div>
  </div>`;
  v.querySelector('#cmp_a').onchange=e=>{self.a=e.target.value;self.render(v);};
  v.querySelector('#cmp_b').onchange=e=>{self.b=e.target.value;self.render(v);};
  v.querySelector('#cmp_snap').onclick=()=>{const l=ParallelData.saveSnapshot();toast('已存快照 · '+l);self.b='sn:0';self.render(v);};
  v.querySelector('#cmp_swap').onclick=()=>{const t=self.a;self.a=self.b;self.b=t;self.render(v);};
  v.querySelector('#cmp_tree').onclick=()=>WT.modal();
  v.querySelector('#cmp_settings').onclick=()=>openApp('settings');
}};

/* ============================================================
   开局预加载：晨光多层反应堆（能量旋转 / 脉冲 / 中心发光核心）
   必须等到「桌面状态栏时间与现实时间一致」且描线动画播完后才关闭，
   关闭之后才进入操作说明 / 校时 / 今日简报横幅。
   ============================================================ */
function bootReactorIntro(done){
  const intro=$('#bootIntro');
  if(!intro){done();return;}
  const started=Date.now(),MIN_MS=3600,MAX_MS=9000;
  const status=$('#biStatus');
  document.body.classList.add('booting');   // 淡出期间手机外围也保持晨光
  /* 校时阶段：把状态栏由占位 10:00 写成现实时间，核心随之加强脉冲 */
  setTimeout(()=>{
    syncClock();
    intro.classList.add('synced');
    if(status)status.textContent='TIME SYNCED · '+realClockText()+' · '+eraName();
  },1250);
  const poll=()=>{
    const elapsed=Date.now()-started;
    const synced=clockMatchesReality()&&intro.classList.contains('synced');
    if((synced&&elapsed>=MIN_MS)||elapsed>=MAX_MS){
      if(!synced){syncClock();intro.classList.add('synced');
        if(status)status.textContent='TIME SYNCED · '+realClockText();}
      intro.classList.add('out');
      setTimeout(()=>{
        document.body.classList.remove('booting');
        if(intro.parentNode)intro.remove();
        done();
      },820);
      return;
    }
    setTimeout(poll,90);
  };
  poll();
}
