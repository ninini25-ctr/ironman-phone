function doTimeJump(y){
  const f=flags();const p=store.profile()||{};const s=store.state();
  const delta=y-f.year;
  const era=WORLD.eras.filter(e=>e.year<=y).pop()||f.era;
  s.era=era.id;s.customYear=(y===era.year)?null:y;
  if(y>=2012)s.forceAvengers1=true;
  if(y>=2015)s.ultronPhase='after';
  s.gameYear=y;store.setState(s);
  if(p.currentAge){p.currentAge=Math.max(+(p.startAge||1),+p.currentAge+delta);store.setProfile(p);}
  // 战甲解锁新机型的完整度
  const ar=store.get('armor',{});(ar.integrity=ar.integrity||{});
  MARKS.forEach(m=>{if(m.year<=y&&ar.integrity[m.no]==null)ar.integrity[m.no]=55+Math.floor(Math.random()*40);});
  store.set('armor',ar);
  // 跨越的历史事件 → 突发简报（报纸 + 邮件）
  const crossed=HIST_EVENTS.filter(e=>e.year>f.year&&e.year<=y);
  crossed.forEach(e=>{
    const arr=store.get('news',[]);
    arr.unshift({id:'n'+Math.random().toString(36).slice(2,9),source:'nyt',date:y+' 年 · 归档',year:e.year,kicker:'FLASHBACK · 历史突发简报',title:'【历史突发】'+e.title+'（'+e.year+'）',
      lead:'本简报为时间跳跃后的阶段性归档：跨越 '+f.year+' → '+y+' 年间被记入世界线的大事。',
      body:e.desc+'\n\n同期归档：\n'+crossed.map(x=>'· '+x.year+' '+x.title+'：'+x.desc).join('\n'),
      ednote:'归档口径：只收录已成为公开历史的事件；受限条目依权限未列出。'});
    store.set('news',arr);
    const l=mailAll();l.unshift({id:'m'+Math.random().toString(36).slice(2,9),owner:'user',box:'in',from:'J.A.R.V.I.S. <jarvis@starkindustries.com>',to:'you@starkmail.com',
      subject:'历史突发简报 · '+e.title+'（'+e.year+'）',
      body:'先生／女士：\n\n时间校准已完成（'+f.year+' → '+y+'）。以下为跨越期间的世界大事归档（可公开部分）：\n\n'+e.desc+'\n\n斯塔克先生的适龄状态已重算。其余条目依权限未列出。\n\nJ.A.R.V.I.S.',tag:'简报',unread:true,star:false,time:nowTime(),quote:''});
    mailSave(l);
  });
  // 时间胶囊解封
  const caps=store.get('capsules',[]);let opened=0;
  caps.forEach(c=>{if(c.unlockYear<=y&&!c.opened){c.opened=true;opened++;}});
  if(caps.length)store.set('capsules',caps);
  TonyStatus.refresh();
  FX.glitch();
  toast(`时间跳跃完成 · ${f.year} → ${y}（+${delta} 年）`);
  banner('J.A.R.V.I.S. · 时间校准',`已推进至 ${y} 年。托尼 ${tonyAgeAt(y)} 岁；你 ${store.profile()?.currentAge||'—'} 岁。${crossed.length?'跨越 '+crossed.length+' 个历史节点，简报已送入报纸与邮件。':''}`,()=>openApp('news'));
  if(opened)setTimeout(()=>toast(opened+' 个时间胶囊已解封（工作笔记 → 时间胶囊）'),1500);
  renderGrid();
  if(currentApp==='worldline')apps.worldline.render($('#appBody'));
}

/* ============================================================
   世界线分支树：关键选择记录 · 回溯 · 平行世界线
   ============================================================ */
const WT={
  nodes(){return store.get('wtree',{nodes:[],active:null});},
  save(t){store.set('wtree',t);},
  snap(){const s=store.state()||{};const p=store.profile()||{};
    return {turn:s.turn||1,affinity:s.affinity||0,rel:{...relGet()},curAge:p.currentAge||null,
      era:s.era,customYear:s.customYear,pepperExists:s.pepperExists,ultronPhase:s.ultronPhase,forceAvengers1:s.forceAvengers1,
      story:s.story||'',options:s.options||'',history:(s.history||[]).slice(-30).map(h=>({...h})),keyChoices:(s.keyChoices||[]).slice()};},
  addNode(choice,tags){
    const t=this.nodes();const snap=this.snap();
    const n={id:'w'+Date.now()+Math.random().toString(36).slice(2,5),parent:t.active,year:flags().year,turn:snap.turn,
      choice:String(choice).slice(0,60),tags:tags||[],snap,t:nowTime()};
    t.nodes.push(n);if(t.nodes.length>40)t.nodes=t.nodes.slice(-40);
    t.active=n.id;this.save(t);return n;},
  keyTag(choice,story){
    const t=(choice||'')+' '+(story||'');const tags=[];
    if(/钯|中毒|血毒|帕拉迪/.test(t))tags.push('钯提醒');
    if(/站队|史蒂夫那边|队长那边|协议|注册|内战|西伯利亚/.test(t))tags.push(/史蒂夫|队长|反注册|反协议/.test(t)?'内战·队长线':'内战·托尼线');
    if(/告白|爱你|留下|别走|求婚/.test(t))tags.push('里程碑');
    if(tags.length){const s=store.state();s.keyChoices=(s.keyChoices||[]);s.keyChoices.push({tags,year:flags().year,turn:s.turn});store.setState(s);}
    return tags;},
  restore(nodeId){
    const t=this.nodes();const n=t.nodes.find(x=>x.id===nodeId);if(!n)return;
    if(!confirm('回溯到「'+n.choice.slice(0,18)+'…」（'+n.year+' 年 · 第 '+n.turn+' 回合）？\n当前进度会先被保存为一个平行分支。'))return;
    const cur=this.snap();
    t.nodes.push({id:'w'+Date.now()+'p',parent:n.parent,year:flags().year,turn:cur.turn,choice:'（平行分叉 · '+nowTime()+'）',tags:['平行'],snap:cur,t:nowTime()});
    const sn=n.snap;const st=store.state()||{};
    st.turn=sn.turn;st.affinity=sn.affinity;st.rel={...(sn.rel||relGet())};st.era=sn.era;st.customYear=sn.customYear;
    st.pepperExists=sn.pepperExists;st.ultronPhase=sn.ultronPhase;st.forceAvengers1=sn.forceAvengers1;
    st.story=sn.story;st.options=sn.options;st.history=sn.history;st.keyChoices=sn.keyChoices;
    store.setState(st);
    const p=store.profile()||{};if(sn.curAge){p.currentAge=sn.curAge;store.setProfile(p);}
    const c=store.contacts().find(x=>x.isTony);if(c){c.affinity=sn.affinity;store.setContacts(store.contacts());}
    t.active=n.id;this.save(t);
    toast('已回溯 · 当前进度已另存为平行分支');FX.glitch();
    renderGrid();
    if(currentApp==='worldline')apps.worldline.render($('#appBody'));},
  treeHTML(){
    const t=this.nodes();
    if(!t.nodes.length)return '<div class="empty">还没有分支节点。在世界线里做出选择后，这里会长出一棵树。</div>';
    const map={};t.nodes.forEach(n=>map[n.id]=n);
    const rows={};t.nodes.forEach(n=>{let d=0,p=n.parent;while(p&&map[p]&&d<30){d++;p=map[p].parent;}(rows[d]=rows[d]||[]).push(n);});
    const ds=Object.keys(rows).map(Number).sort((a,b)=>a-b);
    const W=Math.max(160,Math.max(...ds.map(d=>rows[d].length))*86+20);
    const H=ds.length*54+20;
    let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">`;
    ds.forEach(d=>{rows[d].forEach((n,i)=>{
      const x=14+i*86+34,y=d*54+24;
      const par=map[n.parent];
      if(par&&rows[d-1]){const pi=rows[d-1].indexOf(par);if(pi>-1)svg+=`<line x1="${14+pi*86+34}" y1="${(d-1)*54+38}" x2="${x}" y2="${y-8}" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="3 3"/>`;}
      const isCur=n.id===t.active;
      svg+=`<g class="wt-node ${n.tags.length?'key':''} ${isCur?'cur':''}" data-w="${n.id}">
        <rect x="${14+i*86}" y="${y-8}" width="68" height="36" rx="8"/>
        <text x="${14+i*86+6}" y="${y+4}" class="lbl">${n.year}·T${n.turn}</text>
        <text x="${14+i*86+6}" y="${y+16}">${esc(n.choice.slice(0,10))}</text>
        ${n.tags.length?`<circle cx="${14+i*86+60}" cy="${y-1}" r="4" fill="var(--gold)"/>`:''}
        ${isCur?`<circle cx="${14+i*86+52}" cy="${y-1}" r="4" fill="var(--cyan)"/>`:''}
      </g>`;});});
    svg+='</svg>';
    const key=t.nodes.filter(n=>n.tags.length);
    return `<div class="card"><h3>◉ 分支树 · ${t.nodes.length} 节点</h3>
      <div class="hint" style="margin-bottom:8px">金色＝关键选择（${key.length}）：钯中毒提醒、内战站队、里程碑等自动标记；蓝点＝当前节点。点击节点可回溯——当前进度自动另存为平行世界线。</div>
      ${svg}
      <div class="hint">${key.slice(-5).map(n=>'· '+n.year+' · '+esc(n.choice.slice(0,16))+'（'+n.tags.map(esc).join('/')+'）').join('<br>')||'暂无关键选择'}</div>
      <button class="btn ghost sm" id="wt_clr" style="margin-top:8px">清空分支树</button></div>`;
  },
  modal(){
    const d=modal(`<h2 class="title-en" style="color:var(--cyan);margin-top:0">🌳 世界线分支树</h2>
      ${this.treeHTML()}
      <button class="btn" data-close style="margin-top:8px">关闭</button>`);
    d.querySelectorAll('[data-w]').forEach(el=>el.onclick=()=>{
      const t=this.nodes();const n=t.nodes.find(x=>x.id===el.dataset.w);if(!n)return;
      const info=modal(`<h2 style="color:var(--cyan);margin-top:0;font-size:15px">${n.year} 年 · 第 ${n.turn} 回合</h2>
        <div class="card"><div class="story" style="font-size:13px">➤ ${esc(n.choice)}</div>
        <div class="mini">好感 ${n.snap.affinity} · ${n.tags.map(x=>'<span class="tag gold">'+esc(x)+'</span>').join(' ')} · ${esc(n.t)}</div>
        <div class="row" style="margin-top:10px"><button class="btn" id="wtr_go">↩ 回溯到此处</button><button class="btn ghost" data-close>关闭</button></div></div>`);
      info.querySelector('#wtr_go').onclick=()=>{info.remove();d.remove();this.restore(n.id);};
    });
    const c=d.querySelector('#wt_clr');if(c)c.onclick=()=>{if(!confirm('清空分支树？'))return;this.save({nodes:[],active:null});d.remove();this.modal();};
  }
};

function armorData(){
  let a=store.get('armor',null);
  if(!a){const f=flags();a={integrity:{},rd:{module:null,progress:0,log:[]},done:[]};
    MARKS.forEach(m=>{if(m.year<=f.year)a.integrity[m.no]=60+Math.floor(Math.random()*40);});
    store.set('armor',a);}
  return a;
}
function ArmorStats(){
  const f=flags();const a=store.get('armor',{});const integrity=a.integrity||{};
  const unlocked=MARKS.filter(m=>m.year<=f.year);
  const vals=unlocked.map(m=>integrity[m.no]).filter(v=>v!=null);
  const avg=vals.length?Math.round(vals.reduce((s,v)=>s+v,0)/vals.length):0;
  const ready=Math.min(98,Math.round(avg*.8+((a.done||[]).length)*3));
  return {total:MARKS.length,unlocked:unlocked.length,avgIntegrity:avg,ready};
}

/* 深夜排队回复 / 深夜错发（渲染托尼对话时结算） */
function processLateQueue(self,v){
  try{
    const q=store.get('lateQueue',null);
    const hour=new Date().getHours();
    const late=hour>=23||hour<5;
    if(q&&q.chat==='托尼·斯塔克'&&Date.now()-q.t>150000){
      store.set('lateQueue',null);
      const stamp='凌晨 '+String(Math.floor(Math.random()*4)+1).padStart(2,'0')+':'+String(Math.floor(Math.random()*60)).padStart(2,'0');
      (async()=>{
        const fb=()=>['*"Couldn\'t sleep either, apparently."*（看来你也睡不着。）','*"...I saw this at 3am. We will not be discussing that."*（……我凌晨三点看到的。这事我们就不讨论了。）'][Math.floor(Math.random()*2)];
        const sys=buildSystem('chat',`你现在扮演【托尼·斯塔克】。玩家深夜发的消息，你凌晨才回。只输出 1~2 条短信（用 || 分隔），开头不要解释为什么晚回，可以带一点刚醒或没睡的语气。严禁动作描写。`);
        const r=await ai([{role:'user',content:'（玩家深夜发来：'+String(q.text||'').slice(0,80)+'。你凌晨醒了，简短回复）'}],sys,fb);
        const ch=store.chats();const a2=ch['托尼·斯塔克']||[];
        r.split('||').map(x=>x.replace(/[（）()]/g,'').trim()).filter(Boolean).forEach(x=>a2.push({role:'them',content:x,time:stamp}));
        if(Math.random()<0.18){
          const miss=['关于西伯利亚的事，我不是——','如果你听到那段录音，忘掉，','实验室的灯…算了，这条不是给你的'][Math.floor(Math.random()*3)];
          a2.push({role:'them',content:miss,time:stamp,misfire:true});
          a2.push({role:'them',content:'',recalled:true,recalledBy:'托尼',orig:miss,time:stamp});
        }
        store.setChats(ch);
        if(currentApp==='messages'&&self.view==='chat'&&self.cur==='托尼·斯塔克')self.render(v);
        else banner('托尼 · 深夜回复','他凌晨回了你的消息',()=>{openApp('messages');apps.messages.cur='托尼·斯塔克';apps.messages.view='chat';apps.messages.render($('#appBody'));});
      })();
    }else if(!q&&late&&Math.random()<0.14){
      const aff=(store.contacts().find(c=>c.isTony)||{}).affinity||0;
      if(aff>=31){
        const ch=store.chats();const a2=ch['托尼·斯塔克']||[];
        if(!a2.some(m=>m.misfire&&Date.now()-(m._t||0)<36e5)){
          const miss={role:'them',content:['实验室的灯还是别关…算了，当我没说','刚才那条不是给你的。删掉它','你睡了的话，明天别提这条'][Math.floor(Math.random()*3)],time:nowTime(),misfire:true,_t:Date.now()};
          a2.push(miss);
          a2.push({role:'them',content:'',recalled:true,recalledBy:'托尼',orig:miss.content,time:nowTime()});
          store.setChats(ch);
          banner('托尼 · 深夜消息','他发来一条，又撤回了',()=>{openApp('messages');apps.messages.cur='托尼·斯塔克';apps.messages.view='chat';apps.messages.render($('#appBody'));});
        }
      }
    }
  }catch(e){}
}

function mailAll(){
  let list=store.get('mails',[]),changed=false;
  list.forEach(m=>{
    if(!m.owner){m.owner=(m.box||'').startsWith('tony')?'tony':'user';m.box=(m.box||'').endsWith('_in')?'in':(m.box||'in');changed=true;}
    if(!m.box)m.box='in';
    if(m.star===undefined)m.star=false;
    if(m.quote===undefined)m.quote='';
  });
  if(changed)store.set('mails',list);
  return list;
}

    d.querySelector('#dr_save').onclick=()=>{const l=mailAll();l.unshift({id:'m'+Math.random().toString(36).slice(2,9),owner:'tony',box:'draft',from:MAIL_ACCOUNTS.tony,to:m.from,subject:'Re: '+m.subject.replace(/^Re:\s*/,''),body:d.querySelector('#dr_b').value,tag:'代拟',unread:false,star:false,time:nowTime(),quote:''});mailSave(l);d.remove();toast('已存入托尼的草稿箱');};
  },
  async refresh(v){
    const f=flags();const sys=buildSystem('mail');
    const res=await ai([{role:'user',content:`生成 2 封新邮件，一封投递到用户邮箱 you@starkmail.com，一封投递到托尼邮箱 tony@starkindustries.com。符合 ${f.year} 年的世界状态（小辣椒${f.pepperExists?'存在':'不存在'}、奥创${f.ultronAfter?'事件后':'事件前'}）。\n格式（每封之间用 ### 分隔）：\n账户:user或tony ||| 发件人 ||| 主题 ||| 标签 ||| 正文`}],sys,
      ()=>`账户:user ||| 斯塔克工业 · 访客事务 ||| 权限复核通知 ||| 系统 ||| 您的临时权限已续期。受限区域仍由 J.A.R.V.I.S. 管理。\n\n访客事务处\n###\n账户:tony ||| 佩珀·波茨 ||| 提醒：周四 ||| 董事会 ||| 托尼：材料我放你桌上了。别再让全息投影替你点头。`.replace(/佩珀·波茨/g,f.pepperExists?'佩珀·波茨':'董事会秘书处'));
    const l=mailAll();let n=0;
    res.split('###').forEach(blk=>{const p=blk.trim().split('|||').map(x=>x.trim());if(p.length<5)return;
      const ac=(p[0]||'').includes('tony')?'tony':'user';
      if(ac==='tony'&&!f.pepperExists&&/佩珀|小辣椒/.test(p[1]+p[4]))return;
      l.unshift({id:'m'+Math.random().toString(36).slice(2,9),owner:ac,box:'in',from:p[1],to:MAIL_ACCOUNTS[ac],subject:p[2],tag:p[3],body:p[4],unread:true,star:false,time:nowTime(),quote:''});n++;});
    mailSave(l);this.render(v);toast('收到 '+n+' 封新邮件');
  },
  onBack(){if(this.cur){this.cur=null;this.render($('#appBody'));return true;}return false;}
};

function localPaper(src){
  const f=flags(),y=f.year,d=worldDate();
  const base={id:'n'+Math.random().toString(36).slice(2,9),source:src.id,date:d,year:y};
  if(src.id==='bugle')return {...base,kicker:'EXCLUSIVE · 独家',title:'钢铁侠又在市中心搞出巨响！市民要求一个说法',
    lead:`本报讯　${y} 年，曼哈顿中城再次传来巨响。目击者称「一道红金色的影子从天上砸下来，然后他还有心情跟记者挥手」。号角日报已向斯塔克工业发出求证函。`,
    body:'编辑部收到十余条目击描述，内容彼此矛盾：有人说是试飞，有人说是「又是那个自大狂」，还有一位坚持认为是流星。J. Jonah Jameson 主编在社论中要求超级英雄「先交税，再谈拯救世界」。\n\n截至发稿，斯塔克工业方面未作实质回应。本报将继续追踪，并把标题字号再放大两号。\n\n另讯：本报读者来信数量创下新高，主编表示「这说明我们骂对了」。',
    ednote:'【斯塔克工业公关部归档备注】不予置评。无需回应，不列入舆情周报。号角日报的报道不影响本公司任何决策。（本条备注为内部流程标注，不对外刊发）'};
  if(src.id==='sib')return {...base,kicker:'OFFICIAL BULLETIN · 官方通报',title:'斯塔克工业发布季度清洁能源业务简报',
    lead:`斯塔克工业公关部 ${y} 年通报：清洁能源部门季度简报将于既定流程发布，内容涵盖既有业务的公开数据，不涉及未公开计划。`,
    body:'通报指出，本季度既定披露事项按计划推进，具体数据以正式披露文件为准。对于媒体关于个别事件的求证，公司沿用既定口径：不予置评。\n\n公关部提醒各业务部门，对外表述须经统一审核；任何涉及技术参数、实验室位置或高管私人行程的问题，一律转由 J.A.R.V.I.S. 按权限处理。\n\n董事会例行会议时间另行通知。',
    ednote:'编者按：本通报仅含可公开信息。受限条目依权限未列出。'};
  if(src.id==='shield')return {...base,kicker:'CLASSIFIED · 内部参阅',title:'情况简报：纽约地区异常能量读数归档',
    lead:`分级：内部。${y} 年例行监测中记录的若干异常读数已完成归档，相关事项仅作知会。`,
    body:'一、监测数据已按标准流程归档，无需回复。\n二、涉及人员与部署的条目依分级另册，不在此简报列出。\n三、各联络官维持既定联络节奏。\n\n本简报不构成行动指令。',
    ednote:'S.H.I.E.L.D. · 仅作知会 · 请勿转发。'};
  if(src.id==='wsj')return {...base,kicker:'MARKETS · 产业与金融',title:'斯塔克工业供应链调整，分析师关注清洁能源板块',
    lead:`${y} 年，斯塔克工业对部分供应链环节作出调整。多位分析师认为，市场更关心的是其清洁能源业务的资本开支节奏，而非某一次公开露面。`,
    body:'据公开文件，公司本季度的采购结构出现小幅变化。两位不愿具名的分析师指出，董事会更在意可预期的披露节奏，而非新闻标题。\n\n截至收盘，相关板块交投平稳。公司发言人拒绝就未公开事项置评。',
    ednote:'编者按：本文基于公开信息，不含未披露数据。'};
  return {...base,kicker:'THE NEW YORK TIMES · 纽约',title:'斯塔克工业与城市：一份关于公开责任的持续追问',
    lead:`${y} 年，随着一家私营企业越来越多地承担公共安全角色，围绕透明度与问责的讨论再次回到市政厅。`,
    body:'采访中，市政官员、学者与市民给出的答案并不一致。支持者提到响应速度，质疑者则指出，任何未经选举产生的力量都需要可核查的边界。\n\n斯塔克工业方面通过公关部表示，公司遵守所有适用法规，具体运营细节不在公开讨论范围。多位受访者认为，这场讨论短期内不会有结论。\n\n背景：该公司近年来的公开活动主要集中于清洁能源与灾害响应。',
    ednote:'编者按：本报未获得、亦未刊载任何受限信息。'};
}

${src.official?'必须严谨、事实优先，不得臆测未公开计划、不得编造具体财务数字或技术参数。':'必须耸动、夸张、爱找超级英雄麻烦，但绝不代表事实；斯塔克工业公关部一律不予置评。'}

apps.facetime={title:'FaceTime',inCall:false,peer:'托尼·斯塔克',muted:false,caption:true,log:[],

        <div class="eyebrow" id="ft_state">${self.inCall?'CONNECTED · 00:00':'READY TO CALL'}</div>
        <div style="position:absolute;right:12px;top:12px;width:66px;height:88px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(150deg,#1b2b3a,#0d151e);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px">你</div>
        ${self.log.length?`<div style="position:absolute;left:10px;right:10px;bottom:10px;max-height:110px;overflow-y:auto;background:rgba(4,8,12,.72);border-radius:10px;padding:9px;font-size:11.5px;line-height:1.7;color:#dbeaff">${self.log.slice(-4).map(x=>`<div><b style="color:var(--cyan)">${esc(x.who)}：</b>${fmt(x.text)}</div>`).join('')}</div>`:''}
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn ${self.inCall?'red':''}" id="ft_call">${self.inCall?'⏹ 挂断':'📞 拨号'}</button>
        <button class="btn ghost" id="ft_mute">${self.muted?'🔇 已静音':'🎙 静音'}</button>
        <button class="btn ghost" id="ft_cap">${self.caption?'字幕 开':'字幕 关'}</button></div>
      <div class="row" style="margin-top:8px"><button class="btn ghost" id="ft_flip">🔄 切换镜头</button><button class="btn ghost" id="ft_line">💬 说一句</button></div>
      <div class="card" style="margin-top:12px"><h3>◉ 通话记录</h3><div class="mini" id="ft_hist">${store.get('ftHistory',[]).slice(-5).map(h=>esc(h)).join('<br>')||'暂无记录'}</div></div>
    </div>`;
    v.querySelector('#ft_peer').onchange=e=>{self.peer=e.target.value;self.render(v);};
    v.querySelector('#ft_call').onclick=()=>{self.inCall=!self.inCall;if(self.inCall){self.startCall(v);const h=store.get('ftHistory',[]);h.push(nowTime()+' 与 '+self.peer+' 通话');store.set('ftHistory',h);}else{self.log=[];toast('通话结束');self.render(v);}};
    v.querySelector('#ft_mute').onclick=()=>{self.muted=!self.muted;self.render(v);};
    v.querySelector('#ft_cap').onclick=()=>{self.caption=!self.caption;self.render(v);};
    v.querySelector('#ft_flip').onclick=()=>toast('已切换镜头（本机无摄像头，使用占位画面）');
    v.querySelector('#ft_line').onclick=()=>self.say(v);
  },
  async startCall(v){
    const self=this,f=flags();let who=self.peer;
    if(who==='贾维斯'&&f.ultronAfter)who='幻视';
    const sys=buildSystem('chat',`你现在扮演【${who}】。${castText(who)}\n${isAI(who)?'严守保密铁律。':''}\n这是视频通话，输出 1 句开场白，短，口语。`);
    const line=await ai([{role:'user',content:'（通话刚接通，请说一句开场白）'}],sys,()=>localReply(who,''));
    self.log.push({who,text:line});self.render(v);
    if(self.inCall){let sec=0;clearInterval(self._t);self._t=setInterval(()=>{sec++;const el=document.querySelector('#ft_state');if(el)el.textContent='CONNECTED · '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');else clearInterval(self._t);},1000);}
  },
  async say(v){
    const self=this,f=flags();let who=self.peer;
    if(who==='贾维斯'&&f.ultronAfter)who='幻视';
    const sys=buildSystem('chat',`你现在扮演【${who}】。${castText(who)}\n${isAI(who)?'严守保密铁律，越界即婉拒。':''}\n视频通话，输出 1 句回应。`);
    const line=await ai([{role:'user',content:'（玩家在通话里朝你点了点头，请回一句话）'}],sys,()=>localReply(who,''));
    self.log.push({who:'你',text:'（点了点头）'});self.log.push({who,text:line});self.render(v);
  },
  onBack(){if(this.inCall){this.inCall=false;clearInterval(this._t);this.log=[];toast('通话已结束');return true;}return false;}
};

/* ============================================================
   斯塔克终端（指令 / 日志 / 保密规则）

apps.terminal={title:'斯塔克终端',lines:[],render(v){
  const self=this,f=flags();$('#actBtn').style.display='none';
  if(!this.lines.length)this.lines=[
    {t:'ok',x:'STARK INDUSTRIES · SECURE TERMINAL v8.0.4'},
    {t:'',x:'J.A.R.V.I.S. '+(f.ultronAfter?'OFFLINE (elevated to VISION)':'ONLINE')+'  |  F.R.I.D.A.Y. '+(f.fridayExists?'ONLINE':'NOT INSTALLED')},
    {t:'',x:'CLEARANCE: GUEST  ·  '+f.year+'  ·  '+f.era.name},
    {t:'warn',x:'Restricted data is never printed to this terminal. Type "help" for commands.'},
  ];
  v.innerHTML=`<div class="pad">
    <div class="card" style="padding:12px"><div class="eyebrow">TERMINAL · <span class="en">J.A.R.V.I.S.</span></div>
      <div class="hint" style="margin-top:6px">命令行式访问。所有敏感查询都会被权限层直接拦截——这是设计，不是故障。</div></div>
    <div class="term" id="tm_out">${this.lines.map(l=>`<div class="${l.t}">${esc(l.x)}</div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><input id="tm_in" class="inp mono" style="flex:1" placeholder="输入指令，如 status / suit / help"><button class="btn sm" id="tm_go" style="flex:0 0 62px">执行</button></div>
    <div style="margin-top:10px">${['help','status','suit','jarvis','friday','vision','date','news','mail','whoami','clear'].map(c=>`<span class="chip" data-cmd="${c}">${c}</span>`).join('')}</div>
    <div class="card" style="margin-top:12px"><h3>◉ 权限说明</h3><div class="mini">贾维斯 / 星期五 / 幻视受严格信息权限约束：不得泄露托尼的住址、行程、健康数据、战甲参数、未公开董事会决议或任何损害其利益的信息。越界请求一律返回 <span class="en">"I'm afraid I'm not at liberty to disclose that."</span></div></div>
  </div>`;
  const out=v.querySelector('#tm_out'),inp=v.querySelector('#tm_in');
  const push=(x,t)=>{self.lines.push({x,t:t||''});out.innerHTML=self.lines.map(l=>`<div class="${l.t}">${esc(l.x)}</div>`).join('');out.scrollTop=out.scrollHeight;};
  const run=async(cmd)=>{
    push('> '+cmd,'warn');
    const c=cmd.trim().toLowerCase();
    if(c==='clear'){self.lines=[];out.innerHTML='';return;}
    if(c==='help'){push('可用指令：help / status / suit / jarvis / friday / vision / date / news / mail / whoami / clear');push('任何其它输入将转交 J.A.R.V.I.S. 按权限应答。');return;}
    if(c==='status'){push('[ OK ] Arc Reactor: nominal  ·  Suit link: standby  ·  Tower grid: 99.97%','ok');push('[ OK ] Guest clearance: READ-ONLY  ·  Restricted records: NOT LISTED','ok');push('注：受限记录的数值本身也属于受限信息。','warn');return;}
    if(c==='suit'){push('[ REDACTED ] 战甲技术参数、材料配比与源代码不在访客权限内。','err');push('*"I\'m afraid I\'m not at liberty to disclose that, sir."*（恐怕我无权透露，先生。）');return;}
    if(c==='whoami'){const p=store.profile()||{};push('访客：'+(p.name||'未登记')+' · '+(p.identity||'未填身份')+' · 开局 '+(p.startAge||'—')+' 岁 / 当前 '+(p.currentAge||'—')+' 岁');push('托尼·斯塔克：'+f.tonyAge+' 岁（'+f.year+' 年）');return;}
    if(c==='date'){push(f.era.name+' · '+f.year+' 年 · '+(f.avengers1?'复联1 已发生':'复联1 尚未发生')+' · 奥创'+(f.ultronAfter?'事件后':'事件前'));return;}
    if(c==='news'){const n=store.get('news',[]);push(n.length?'最新一期：'+n[0].title:'尚无报纸，请到「报纸 / 报社」出刊。');push('快捷入口：桌面 → 报纸');return;}
    if(c==='mail'){const l=mailAll();push('用户邮箱未读 '+l.filter(m=>m.owner==='user'&&m.box==='in'&&m.unread).length+' 封 · 托尼邮箱未读 '+l.filter(m=>m.owner==='tony'&&m.box==='in'&&m.unread).length+' 封');push('快捷入口：桌面 → 邮件');return;}
    if(c==='jarvis'||c==='friday'||c==='vision'){
      if(c==='jarvis'&&f.ultronAfter){push('J.A.R.V.I.S. 不再以此身份应答。发给他的消息由幻视代回。','warn');push('*"J.A.R.V.I.S. is no longer available in that capacity."*（贾维斯已不再以此身份应答。）');return;}
      if(c==='friday'&&!f.fridayExists){push('F.R.I.D.A.Y. 尚未诞生（奥创事件之前）。','err');return;}
      if(c==='vision'&&!f.visionExists){push('幻视尚未存在（奥创事件之前）。','err');return;}
      push('*"Good evening. How may I assist you — within clearance?"*（晚上好。在权限范围内，有什么可以帮您？）');return;}
    // 其它：走 AI（严格保密）
    if(SENSITIVE.test(cmd)){push('[ DENIED ] 权限不足 · 该查询涉及受限条目，已按保密规则拒绝。','err');push('*"I\'m afraid I\'m not at liberty to disclose that."*（恐怕我无权透露。）');return;}
    const sys=buildSystem('terminal',`你是终端里的 J.A.R.V.I.S.${f.ultronAfter?'（已升格为幻视，代回）':''}。严守保密铁律。只输出 1~2 行终端风格的短句，不要解释过多。`);
    const r=await ai([{role:'user',content:cmd}],sys,()=>'*"I have logged your query. Some things are better left unsaid, sir."*（已记录您的查询。有些事还是不说为好，先生。）');
    push(r);
  };
  v.querySelector('#tm_go').onclick=()=>{const c=inp.value.trim();if(!c)return;inp.value='';run(c);};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const c=inp.value.trim();if(c){inp.value='';run(c);}}});
  v.querySelectorAll('[data-cmd]').forEach(el=>el.onclick=()=>run(el.dataset.cmd));
}};

apps.theater={title:'小剧场',cur:null,render(v){

  if(this.cur){this.renderQuest(v);return;}
  const done=store.get('theaterDone',[]);
  const list=THEATER_QUESTS.filter(q=>q.eras.includes(f.era.id));
  v.innerHTML=`<div class="pad">
    <div class="card" style="padding:12px"><div class="eyebrow">STARK OS · ONE-ACT PLAY</div>

          ()=>'灯又暗了一档。没有人提刚才那句话，也没有人把杯子收走。\n\n贾维斯把实验室温度调高半度——他从不解释这种事。你忽然意识到，这大概就是他能给出的、最接近「留下」的说法。\n\n门在外面上锁的声音很轻。');
        v.querySelector('#tq_end').innerHTML=`<div class="card" style="border-color:var(--gold)"><h3 style="color:var(--gold)">◉ 续场</h3><div class="story" style="font-size:14px">${fmt(r)}</div><button class="btn ghost" id="tq_again2" style="margin-top:12px">← 返回剧场</button></div>`;
        v.querySelector('#tq_again2').onclick=()=>self.renderQuest(v);
      };
    });
  },
  onBack(){if(this.cur){this.cur=null;this.render($('#appBody'));return true;}return false;}
};

      <div class="seg" style="margin:9px 0 0;flex-wrap:wrap"><button data-k="happy" class="${isHappy?'on':''}">🧳 哈皮笔记</button><button data-k="jarvis" class="${isJarvis?'on':''}">🤖 贾维斯日报</button><button data-k="capsule" class="${isCap?'on':''}">⏳ 时间胶囊</button><button data-k="strategy" class="${isStr?'on':''}">🗺 策略草案</button></div>
      <div class="hint" style="margin-top:8px">${isHappy?'哈罗德·霍根的记录：车、行程、谁又被晾在楼下、以及老板绝不承认的作息。':isJarvis?'系统日报：可公开的运行摘要与日程。受限条目依权限不予列出。':isCap?'写给未来的信。设定开启年份，时间跳跃越过后自动解封。':'战术与研发的策略清单，可逐条勾选，随世界线推进更新。'}</div></div>
    ${isCap?`<div class="card"><h3>◉ 封存一枚时间胶囊</h3>
      <div class="field"><label>内容（写给未来的自己或他）</label><textarea id="cp_in" rows="4" placeholder="亲爱的 ${f.year+2} 年的我：…"></textarea></div>
      <div class="field"><label>开启年份</label><select id="cp_yr">${[1,2,3,5,8].map(d=>{const y=f.year+d;return `<option value="${y}">${y} 年（+${d} 年）</option>`;}).join('')}</select></div>
      <button class="btn gold" id="cp_save">🔒 封存</button>
      <div class="hint" style="margin-top:8px">已封存 ${store.get('capsules',[]).length} 枚 · ${store.get('capsules',[]).filter(c=>f.year>=c.unlockYear).length} 枚已解封</div></div>`:''}
    ${isStr?`<div class="card"><h3>◉ 新建策略草案</h3>
      <div class="field"><label>标题</label><input id="st_t" class="inp" placeholder="如：内战立场决策草案 / 战甲模块路线图"></div>
      <div class="field"><label>要点（每行一条）</label><textarea id="st_in" rows="3" placeholder="支持史蒂夫的一方…&#10;代价：…"></textarea></div>
      <button class="btn" id="st_save">保存草案</button></div>`:''}
    ${(isHappy||isJarvis)?`<div class="row" style="margin-bottom:12px"><button class="btn" id="nt_gen">🖊 生成今日${isHappy?'笔记':'日报'}</button><button class="btn ghost" id="nt_refresh">🔄 刷新</button></div>`:''}
    ${(isHappy||isJarvis)?`<div id="nt_list">${arr.length?'':'<div class="empty">还没有记录。点上方按钮生成一条。</div>'}</div>`:''}
    ${isCap?`<div id="cp_list">${store.get('capsules',[]).length?'':'<div class="empty">还没有胶囊。封存后，时间跳跃到设定年份即解封。</div>'}</div>`:''}
    ${isStr?`<div id="st_list">${store.get('strategy',[]).length?'':'<div class="empty">还没有草案。</div>'}</div>`:''}
  </div>`;
  v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{self.kind=b.dataset.k;self.render(v);});
  if(v.querySelector('#nt_refresh'))v.querySelector('#nt_refresh').onclick=()=>self.render(v);
  if(v.querySelector('#nt_gen'))v.querySelector('#nt_gen').onclick=()=>self.generate(v);
  if(v.querySelector('#cp_save'))v.querySelector('#cp_save').onclick=()=>{
    const t=v.querySelector('#cp_in').value.trim();if(!t)return toast('先写点什么');
    const y=+v.querySelector('#cp_yr').value;
    const caps=store.get('capsules',[]);caps.unshift({id:'cap'+Date.now(),text:t,unlockYear:y,opened:false,time:nowTime()});
    store.set('capsules',caps);self.render(v);toast('已封存 · 将于 '+y+' 年解封');};
  if(v.querySelector('#st_save'))v.querySelector('#st_save').onclick=()=>{
    const t=v.querySelector('#st_t').value.trim();if(!t)return toast('填写标题');
    const lines=v.querySelector('#st_in').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const st=store.get('strategy',[]);st.unshift({id:'sg'+Date.now(),title:t,items:lines.map(x=>({t:x,done:false})),time:nowTime()});
    store.set('strategy',st);self.render(v);toast('草案已保存');};
  const cpL=v.querySelector('#cp_list');
  if(cpL){const caps=store.get('capsules',[]);
    cpL.innerHTML=caps.map((c,i)=>{const locked=f.year<(c.unlockYear||f.year);
      return `<div class="cap-card ${locked?'locked':''}">
        <div style="display:flex;align-items:center;gap:8px"><b>${locked?'🔒':'⏳'}</b><b style="font-family:var(--font-serif">${esc(c.unlockYear+' 年 · 胶囊')}</b>
        <span class="tag ${locked?'':'gold'}">${locked?'将于 '+c.unlockYear+' 年解封':'已解封 · '+esc(c.time||'')}</span></div>
        <div class="hint" style="margin-top:5px;line-height:1.8">${locked?'（封存中 · 时间跳跃至 '+c.unlockYear+' 年后可读）':esc(c.text)}</div>
        <span class="chip" data-cpd="${i}" style="margin-top:6px">删除</span></div>`;}).join('');
    cpL.querySelectorAll('[data-cpd]').forEach(el=>el.onclick=()=>{const a2=store.get('capsules',[]);a2.splice(+el.dataset.cpd,1);store.set('capsules',a2);self.render(v);});}
  const stL=v.querySelector('#st_list');
  if(stL){const sts=store.get('strategy',[]);
    stL.innerHTML=sts.map((s,si)=>`<div class="cap-card" style="border-left-color:var(--cyan)">
      <div style="display:flex;align-items:center;gap:8px"><b style="font-family:var(--font-serif">${esc(s.title)}</b>
        <span class="tag">${s.items.filter(x=>x.done).length}/${s.items.length} 已完成</span></div>
      <div style="margin-top:7px">${s.items.map((it,ii)=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:4px 0">
        <input type="checkbox" data-sgk="${si}:${ii}" ${it.done?'checked':''} style="accent-color:var(--cyan);margin-top:3px">
        <span class="hint" style="${it.done?'text-decoration:line-through;opacity:.55':''}">${esc(it.t)}</span></div>`).join('')}</div>
      <span class="chip" data-sgd="${si}" style="margin-top:6px">删除</span></div>`).join('');
    stL.querySelectorAll('[data-sgk]').forEach(el=>el.onclick=()=>{const[a,b]=el.dataset.sgk.split(':').map(Number);
      const sts2=store.get('strategy',[]);sts2[a].items[b].done=!sts2[a].items[b].done;store.set('strategy',sts2);self.render(v);});
    stL.querySelectorAll('[data-sgd]').forEach(el=>el.onclick=()=>{const sts2=store.get('strategy',[]);sts2.splice(+el.dataset.sgd,1);store.set('strategy',sts2);self.render(v);});}
  const list=v.querySelector('#nt_list');
  if(list){
  list.innerHTML=arr.map((x,i)=>`<div class="card" style="padding:13px" data-i="${i}">
    <div style="font-family:var(--font-serif);font-size:14px;font-weight:700">${esc(x.title)}</div>
    <div class="hint" style="margin:4px 0 8px">${esc(x.time)} · ${esc(f.era.name)}</div>
    <div style="font-size:13px;line-height:1.9;white-space:pre-wrap;font-family:var(--font-serif)">${fmt(x.body)}</div>
    <div style="margin-top:10px"><span class="chip" data-nd="${x.id}">删除</span><span class="chip" data-nm="${x.id}">存为邮件草稿</span></div></div>`).join('');
  list.querySelectorAll('[data-nd]').forEach(el=>el.onclick=e=>{e.stopPropagation();store.set('notes',store.get('notes',[]).filter(y=>y.id!==el.dataset.nd));self.render(v);});
  list.querySelectorAll('[data-nm]').forEach(el=>el.onclick=e=>{e.stopPropagation();const x=store.get('notes',[]).find(y=>y.id===el.dataset.nm);if(!x)return;const l=mailAll();l.unshift({id:'m'+Date.now(),owner:'user',box:'draft',from:MAIL_ACCOUNTS.user,to:'tony@starkindustries.com',subject:x.title,body:x.body,quote:isHappy?'哈皮的工作笔记':'贾维斯的日报',unread:false,star:false,time:nowTime(),tag:'记录'});mailSave(l);toast('已存为邮件草稿');});
  }
},
  async generate(v){
    const self=this,isHappy=this.kind==='happy',f=flags();
    if(!v.querySelector('#nt_list'))return;
    v.querySelector('#nt_list').innerHTML='<div class="loader"><div class="spin"></div>整理记录…</div>';
    const sys=isHappy?buildSystem('general',`你是哈皮·霍根。${castText('哈皮')}\n写一段工作笔记：条目式，5~7 条，只记车、行程、等待、现场秩序、设备交接，绝不写老板私人情绪与私事。`)
      :buildSystem('general',`你是 J.A.R.V.I.S.。${castText('贾维斯')}\n严守保密铁律。写一份系统日报：可公开的运行摘要、访客权限变更、日程中可公开条目。受限条目只写「依权限未列出」，绝不写出内容本身。`);
    const fb=()=>isHappy?`【${worldDate()} · 工作笔记】\n· 07:40 车已到位，后备箱放了备用西装（他没要求，我也没提）。\n· 09:00 董事会。等了 26 分钟，没催。\n· 12:15 他说「五分钟」，实际 43 分钟。\n· 15:30 换了辆车，原因不记录。\n· 19:50 实验室灯还亮着。我把车停回原位。\n· 备注：今天第三次等他。不写别的。`
      :`【${worldDate()} · 系统日报】\n· 大厦电网：99.97%，无异常。\n· 访客权限：临时权限续期一次（可公开条目）。\n· 可公开日程：周四 09:00，董事会。\n· 4 号工作台能耗较昨日 +12%，按既定偏好不做追问。\n· 受限条目：3 项，依权限未列出。\n· 备注：${f.ultronAfter?'本日报由 F.R.I.D.A.Y. 代生成，J.A.R.V.I.S. 不再以此身份应答。':'系统正常，无需记录其它。'}`;
    const r=await ai([{role:'user',content:'请生成今天的'+f.era.name+'记录。'+(!isHappy?'严守保密规则。':'')}],sys,fb);
    const arr=store.get('notes',[]);arr.unshift({id:'nt'+Date.now(),kind:this.kind,title:(isHappy?'工作笔记':'系统日报')+' · '+worldDate(),body:r,time:nowTime()});store.set('notes',arr);self.render(v);toast('已生成');
  }
};

apps.academy={title:'斯塔克工业',tab:'course',render(v){
  const self=this,f=flags();const a=store.get('academy',{term:1,scores:[],status:'course'});
  $('#actBtn').style.display='none';
  v.innerHTML=`<div class="pad">
    <div class="card" style="padding:12px"><div class="eyebrow">STARK INDUSTRIES · INTERNAL</div>
      <div style="font-family:var(--font-serif);font-size:15px;font-weight:700;margin:6px 0">🏢 第 ${a.term} 期 · 内部议程</div>
      <div class="hint">斯塔克工业内部节奏表：技术评审、董事会答辩、季度复盘与季度成绩单。只有会议室和 42 层。</div></div>
    <div class="seg"><button data-t="course" class="${this.tab==='course'?'on':''}">📋 今日议程</button><button data-t="exam" class="${this.tab==='exam'?'on':''}">🎤 答辩</button><button data-t="score" class="${this.tab==='score'?'on':''}">📊 成绩单</button><button data-t="status" class="${this.tab==='status'?'on':''}">🗂 复盘会</button></div>
    <div id="ac_body"></div></div>`;
  v.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{self.tab=b.dataset.t;self.render(v);});
  const body=v.querySelector('#ac_body');
  if(this.tab==='course'){
    body.innerHTML=`<div class="card"><h3>◉ 今日议程 · ${esc(f.era.name)}</h3>
      <div style="font-family:var(--font-serif);line-height:2;font-size:13.5px">
        · 09:00　清洁能源部门预算案（董事会，需本人到场）<br>
        · 11:30　战甲原型评审 · 4 号工作台（受限区域）<br>
        · 14:00　媒体问询统一口径复核（公关部）<br>
        · 16:30　${f.avengers1?'复仇者联络简报':'部门内部技术同步'}<br>
        · 19:00　—— 之后的时间表里没有条目 ——</div>
      <div class="hint" style="margin-top:10px">托尼大概率只出席第一项的最后八分钟。其余由${f.pepperExists?'小辣椒按优先级替他挡掉':'各部门自行推进'}。</div>
      <button class="btn" id="ac_go" style="margin-top:12px">进入今日议程</button></div>`;
    body.querySelector('#ac_go').onclick=async()=>{
      body.innerHTML='<div class="loader"><div class="spin"></div>会议室正在准备…</div>';
      const sys=buildSystem('general',`写一段斯塔克工业内部会议场景，300 字以内，玩家是列席者。托尼只在最后八分钟出现，说 1~2 句，符合人设。不泄露受限技术参数。`);
      const r=await ai([{role:'user',content:'请写今日议程的场景与玩家可做的 3 个选择，格式：场景正文，然后每行 A. B. C. 选项。'}],sys,
        ()=>'长桌两侧坐满了人，投影上是清洁能源部门的曲线。前四十分钟没有人提托尼的名字。\n\n第八分钟他从侧门进来，没坐下，手指点了一下第二页：「这行数字改了。别的没问题。」然后就走了。\n\n小辣椒（若在场）把材料合上：「会议结束。」\n\nA. 追出去问那行数字\nB. 留下来把会议纪要补完\nC. 什么也不做，把第二页拍下来');
      body.innerHTML=`<div class="card"><h3>◉ 场景</h3><div class="story" style="font-size:13.5px">${fmt(r)}</div><button class="btn ghost" id="ac_back" style="margin-top:10px">← 返回议程</button></div>`;
      body.querySelector('#ac_back').onclick=()=>self.render(v);
    };
  }else if(this.tab==='exam'){
    body.innerHTML=`<div class="card"><h3>◉ 技术答辩</h3>
      <div class="hint" style="margin-bottom:10px">题目由当前时间点决定。答得好不好，托尼只会说「还行」或「重做」。</div>
      <div id="ac_q" style="font-family:var(--font-serif);font-size:14px;line-height:1.9;margin-bottom:12px">在不泄露任何受限参数的前提下，向董事会说明「为什么原型机需要第三次迭代」。</div>
      <div class="field"><textarea id="ac_ans" rows="4" placeholder="你的答辩要点…"></textarea></div>
      <button class="btn" id="ac_submit">提交答辩</button><div id="ac_res" style="margin-top:12px"></div></div>`;
    body.querySelector('#ac_submit').onclick=async()=>{
      const ans=body.querySelector('#ac_ans').value.trim();if(!ans)return toast('先写点什么');
      body.querySelector('#ac_res').innerHTML='<div class="loader"><div class="spin"></div>评审中…</div>';
      const sys=buildSystem('general',`你是托尼·斯塔克，正在听玩家的技术答辩。${castText('托尼·斯塔克')}\n只给 2~4 句点评，刻薄但不伤人，给一个 0~100 的分数，格式：点评正文 || 分数。不得泄露技术参数。`);
      const r=await ai([{role:'user',content:'玩家答辩：'+ans}],sys,()=>'*"You buried the point on page two."*（重点被你埋到第二页去了。）\n不过结论是对的。第三次迭代不是修 bug，是换前提——这句留下。|| 78');
      const parts=r.split('||');const score=parseInt((parts[1]||'75').match(/\d+/)?.[0]||'75');
      const a2=store.get('academy',{term:1,scores:[],status:'course'});a2.scores.unshift({score,topic:'原型机第三次迭代',time:nowTime()});store.set('academy',a2);
      body.querySelector('#ac_res').innerHTML=`<div class="card" style="border-color:var(--gold)"><h3 style="color:var(--gold)">◉ 评审</h3><div class="story" style="font-size:13.5px">${fmt(parts[0])}</div><div class="affval" style="margin-top:8px">${score} / 100</div></div>`;
      toast('成绩已记入成绩单');
    };
  }else if(this.tab==='score'){
    body.innerHTML=`<div class="card"><h3>◉ 答辩成绩单</h3>${a.scores.length?a.scores.map(x=>`<div class="srow"><div><div class="t">${esc(x.topic)}</div><div class="d">${esc(x.time)}</div></div><div class="affval">${x.score}</div></div>`).join(''):'<div class="empty">还没有成绩。</div>'}
      <div class="hint" style="margin-top:10px">托尼从不给满分。他说「满分意味着没得可改了，那多没意思」。</div></div>`;
  }else{
    body.innerHTML=`<div class="card"><h3>◉ 第 ${a.term} 期 · 复盘会</h3>
      <div class="mini" style="line-height:2">· 出席：各部门负责人${f.pepperExists?'、小辣椒（主持）':''}<br>· 托尼：出席 8 分钟<br>· 决议：预算案按修订版执行<br>· 遗留：原型机迭代说明需重写第一页</div>
      <button class="btn" id="ac_next" style="margin-top:12px">进入下一期 ↗</button>
      <button class="btn ghost" id="ac_reset" style="margin-top:8px">↺ 重新开学（重置期数）</button></div>`;
    body.querySelector('#ac_next').onclick=()=>{a.term++;store.set('academy',a);self.render(v);toast('进入第 '+a.term+' 期');};
    body.querySelector('#ac_reset').onclick=()=>{if(!confirm('重置期数与成绩？'))return;store.set('academy',{term:1,scores:[],status:'course'});self.render(v);};
  }
}};

apps.calendar={title:'日历',ym:null,sel:null,render(v){
  const self=this,f=flags();$('#actBtn').style.display='none';
  const d=new Date();const ym=this.ym||{y:f.year,m:d.getMonth()+1};
  const ev=store.get('calendar',{});
  const first=new Date(ym.y,ym.m-1,1).getDay();const days=new Date(ym.y,ym.m,0).getDate();
  const cells=[];for(let i=0;i<first;i++)cells.push('');for(let i=1;i<=days;i++)cells.push(i);
  const key=k=>ym.y+'-'+ym.m+'-'+k;
  const items=ev[key(self.sel)]||[];
  v.innerHTML=`<div class="pad">
    <div class="card" style="padding:12px"><div class="row" style="align-items:center;margin-bottom:10px">
      <button class="btn ghost sm" id="cal_prev" style="flex:0 0 44px">‹</button>
      <div style="text-align:center;flex:1"><div class="title-en" style="font-size:17px;color:var(--cyan)">${ym.y} · ${String(ym.m).padStart(2,'0')}</div><div class="hint">${esc(f.era.name)} · 托尼 ${f.tonyAge} 岁</div></div>
      <button class="btn ghost sm" id="cal_next" style="flex:0 0 44px">›</button></div>
      <div class="cal-grid">${['日','一','二','三','四','五','六'].map(x=>`<div class="h">${x}</div>`).join('')}
        ${cells.map(c=>c===''?'<div></div>':`<div class="d ${ev[key(c)]&&ev[key(c)].length?'has':''} ${self.sel===c?'today':''}" data-d="${c}">${c}</div>`).join('')}</div></div>
    <div class="card"><h3>◉ ${ym.y} 年 ${ym.m} 月 ${self.sel||'—'} 日</h3>
      ${items.length?items.map((x,i)=>`<div class="srow"><div><div class="t">${esc(x.t)}</div><div class="d">${esc(x.n||'')}</div></div><span class="chip" data-cd="${i}">删除</span></div>`).join(''):'<div class="hint">这一天没有日程。</div>'}
      <div class="row" style="margin-top:12px"><input id="cal_t" class="inp" style="flex:1" placeholder="新日程，如：董事会 / 酒会"><button class="btn sm" id="cal_add" style="flex:0 0 62px">添加</button></div>
      <button class="btn ghost" id="cal_seed" style="margin-top:8px">📌 载入本时期典型日程</button></div>
    <div class="hint" style="text-align:center">${en('Time is the one thing he can\'t build.')} · 博览会、会议、酒会、董事会、拍卖会均可记入。</div>
  </div>`;
  v.querySelector('#cal_prev').onclick=()=>{const m=ym.m-1;self.ym=m<1?{y:ym.y-1,m:12}:{y:ym.y,m};self.sel=null;self.render(v);};
  v.querySelector('#cal_next').onclick=()=>{const m=ym.m+1;self.ym=m>12?{y:ym.y+1,m:1}:{y:ym.y,m};self.sel=null;self.render(v);};
  v.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{self.sel=+el.dataset.d;self.render(v);});
  v.querySelectorAll('[data-cd]').forEach(el=>el.onclick=()=>{if(!self.sel)return;const e=store.get('calendar',{}),k=key(self.sel);e[k].splice(+el.dataset.cd,1);store.set('calendar',e);self.render(v);});
  v.querySelector('#cal_add').onclick=()=>{if(!self.sel)return toast('先选一天');const t=v.querySelector('#cal_t').value.trim();if(!t)return toast('填写日程');const e=store.get('calendar',{}),k=key(self.sel);(e[k]=e[k]||[]).push({t,n:nowTime()+' 添加'});store.set('calendar',e);self.render(v);toast('已添加');};
  v.querySelector('#cal_seed').onclick=()=>{if(!self.sel)return toast('先选一天');const e=store.get('calendar',{}),k=key(self.sel);
    const pres=[{t:'09:00 董事会 · 清洁能源预算案',n:'42 层 · 需本人到场'},{t:'19:30 慈善酒会 · 大都会博物馆',n:'黑领结 · 名单已核'},{t:'斯塔克博览会 · 新品发布',n:'贵宾观礼席'},{t:'苏富比拍卖预展',n:'私人洽购室'},{t:'日内瓦科技高峰论坛',n:'主旨演讲后台'}];
    (e[k]=e[k]||[]).push(...pres);store.set('calendar',e);self.render(v);toast('已载入典型日程');};
}};

/* 约饭场所按时间点解锁：复联基地在纽约之战后，湖边小屋在 2018 后 */
function datePlacesFor(){
  const f=flags();
  return WORLD.datePlaces.filter(c=>{
    if(c.key==='compound'&&!f.avengers1)return false;
    if(c.key==='lake'&&f.year<2018)return false;
    return true;
  });
}
apps.dating={title:'约饭',_view:'setup',city:0,spot:null,people:[],
  onBack(){const s=store.get('dateSession',null);if(s&&this._view!=='setup'){this._view='setup';this.render(document.getElementById('appBody'));return true;}return false;},
  render(v){
    const self=this,f=flags();const session=store.get('dateSession',null);
    $('#actBtn').style.display='none';
    if(this._view==='date'&&session){this.renderDate(v,session);return;}
    if(this._view==='result'&&session){this.renderResult(v,session);return;}
    const places=datePlacesFor();
    if(this.city>=places.length)this.city=0;
    const city=places[this.city]||places[0];
    const names=activeNames().filter(n=>!isAI(n));
    v.innerHTML=`<div class="pad">
      <div class="card" style="padding:12px"><div class="eyebrow">AN INVITATION · ${esc(eraName())}</div>
        <div style="font-family:var(--font-serif);font-size:15px;font-weight:700;margin:6px 0">🍷 约饭 · 高端场所与私人住宅</div>
        <div class="hint">场所清单：博览会、会议、酒会、董事会、拍卖会，以及托尼的住宅（马里布悬崖别墅、斯塔克大厦顶层、湖边小屋、复仇者基地——后两处按时间点解锁）。全部为高端场所与私人住宅。</div></div>
      <div class="card"><h3>◉ 选择场所</h3>
        <div class="seg" style="flex-wrap:wrap">${places.map((c,i)=>`<button data-c="${i}" class="${this.city===i?'on':''}">${c.emoji} ${esc(c.name.split(' · ')[0])}</button>`).join('')}</div>
        <div class="hint" style="margin-bottom:9px">${esc(city.desc)}</div>
        <div>${city.spots.map((s,i)=>`<span class="chip ${this.spot===i?'on':''}" data-s="${i}">${s.emoji} ${esc(s.name)}</span>`).join('')}</div></div>
      <div class="card"><h3>◉ 同行的人</h3>
        <div class="hint" style="margin-bottom:8px">可多选。初代复联成员在纽约之战前彼此不熟，同时选太多人会显得穿帮。</div>
        <div>${names.map(n=>`<span class="chip ${this.people.includes(n)?'on':''}" data-p="${esc(n)}">${esc(n)}</span>`).join('')}</div>
        <div class="hint" style="margin-top:8px">已选 ${this.people.length} 人：${esc(this.people.join('、')||'（至少选一位）')}</div></div>
      <div class="row" style="margin-bottom:12px"><button class="btn" id="dt_start">▶ 开始这场约会</button><button class="btn ghost" id="dt_hist">📜 历史记录</button></div>
      <div class="hint" style="text-align:center">${en('Dress code: black tie, or a lab coat.')} · 托尼大概会迟到八分钟</div>
    </div>`;
    v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{self.city=+b.dataset.c;self.spot=null;self.render(v);});
    v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{self.spot=+b.dataset.s;self.render(v);});
    v.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const n=b.dataset.p;self.people=self.people.includes(n)?self.people.filter(x=>x!==n):[...self.people,n];self.render(v);});
    v.querySelector('#dt_start').onclick=()=>{
      if(self.spot===null)return toast('先选一个具体场所');
      if(!self.people.length)return toast('至少选一位同行的人');
      if(!f.groupUnlocked&&self.people.filter(n=>['史蒂夫·罗杰斯','托尔','布鲁斯·班纳','娜塔莎·罗曼诺夫','克林特·巴顿'].includes(n)).length>1)toast('提示：纽约之战前，复联成员彼此不熟，同场人数过多可能穿帮');
      const city=datePlacesFor()[self.city]||datePlacesFor()[0];
      const session={place:city.name,spot:city.spots[self.spot].name,emoji:city.spots[self.spot].emoji,
        people:[...self.people],turn:1,story:'',options:[],mood:'',aff:0,time:nowTime()};
      store.set('dateSession',session);self._view='date';self.render(v);
    };
    v.querySelector('#dt_hist').onclick=()=>{const h=store.get('dateHistory',[]);const d=modal(`<h2 style="color:var(--cyan);margin-top:0">📜 约饭记录</h2>${h.length?h.map(x=>`<div class="card"><div class="hint">${esc(x.time)} · ${esc(x.place)} / ${esc(x.spot)}</div><div style="font-family:var(--font-serif);font-size:13.5px;margin-top:5px">同行：${esc(x.people.join('、'))}</div><div style="color:var(--gold);font-size:12.5px;margin-top:5px">心情：${esc(x.mood)} · 好感 ${x.aff>0?'+':''}${x.aff}</div></div>`).join(''):'<div class="hint">还没有记录。</div>'}<button class="btn" data-close style="margin-top:8px">关闭</button>`);};
  },
  async renderDate(v,session){
    const self=this,f=flags();
    if(!session.story){
      v.innerHTML='<div class="loader"><div class="spin"></div>正在安排席位…</div>';
      const sys=buildSystem('worldline',`这是一场「约饭」场景。地点：${session.place} / ${session.spot}。同行：${session.people.join('、')}。\n写 400~700 字的场景，符合所有角色人设与当前时间点。托尼迟到八分钟、不道歉、用技术细节岔开话题。地点必须是高端场所或托尼的住宅，不得出现平价小店或快餐场所。末尾输出【选项】A. … B. … C. …`);
      const r=await ai([{role:'user',content:'请写这场约会的开场。'}],sys,()=>{
        const lead=session.people[0]||'托尼·斯塔克';
        const line=localReply(lead,'');
        return `${session.emoji} ${session.place} · ${session.spot}\n\n香槟塔旁边的位置空了八分钟。侍者把餐巾折了两次，全息投影在墙上缓慢转着一版没人看的清洁能源曲线。\n\n${lead}比约定时间晚了八分钟才出现。领带是歪的，手里却拿着一支记号笔——显然是从另一场会议里直接过来的。\n\n${line}\n\n侍者递上酒单，${lead}摆了摆手，把笔在指间转了一圈：「不用，我知道你们这儿什么年份能喝。」\n\n终于坐下——没坐主位，坐了靠窗那个能看见门的位置。\n\n【选项】\nA. 把酒单接过来，替对方点了一杯黑咖啡\nB. 问「你迟到了八分钟」\nC. 不提时间，把话题拉回墙上的曲线\nD. 什么也不说，把自己那杯推过去`;
      });
      const parts=r.split(/【选项】/);session.story=(parts[0]||'').replace(/【剧情】/,'').trim();
      session.options=(parts[1]||'A. 顺着他接下去\nB. 保持距离\nC. 把话题拉回正事').trim();
      store.set('dateSession',session);
    }
    const opts=session.options.split('\n').filter(l=>/^[A-DＡ-Ｄ]\s*[\.、]/.test(l.trim()));
    v.innerHTML=`<div class="pad">
      <div class="card" style="padding:12px"><div class="eyebrow">${esc(session.emoji)} ${esc(session.place)}</div>
        <div style="font-family:var(--font-serif);font-size:14.5px;font-weight:700;margin:5px 0">${esc(session.spot)}</div>
        <div class="hint">同行：${esc(session.people.join('、'))} · 第 ${session.turn} 回合 · ${esc(eraName())}</div></div>
      <div class="story">${fmt(session.story)}</div>
      <div id="dt_opts">${opts.map(o=>`<button class="opt" data-o="${esc(o).replace(/"/g,'&quot;')}">${fmt(o)}</button>`).join('')}</div>
      <div class="card"><input id="dt_act" class="inp" style="margin-bottom:8px" placeholder="自定义行动…"><div class="row"><button class="btn" id="dt_send">继续</button><button class="btn ghost" id="dt_end">结束这场约会</button></div></div>
    </div>`;
    const pick=async(choice)=>{
      const s=store.get('dateSession',session);
      v.innerHTML='<div class="loader"><div class="spin"></div>场景推进中…</div>';
      const sys=buildSystem('worldline',`继续这场约会。地点：${s.place}/${s.spot}。同行：${s.people.join('、')}。玩家选择：${choice}。写 300~500 字，末尾输出【选项】A. … B. … C. …`);
      const r=await ai([{role:'user',content:'上一场：'+s.story.slice(-400)+'\n选择：'+choice+'\n请继续。'}],sys,
        ()=>'他没有接那句话，只是把杯子转了半圈，让缺口朝里。\n\n窗外城市的灯一层层亮起来。*"Don\'t make it a thing."*（别搞得跟什么大事似的。）\n\n服务生来收走第一道几乎没动过的菜。他忽然问了一句跟今晚完全无关的事：「4 号工作台的散热你看了吗？」\n\n这就是他能给出的、最接近「留下」的说法。\n\n【选项】\nA. 回答工作台的事\nB. 反问「你是在岔开话题吗」\nC. 把话题留在今晚');
      const parts=r.split(/【选项】/);s.story=(parts[0]||'').trim();s.options=(parts[1]||'A. 继续\nB. 结束').trim();s.turn++;
      store.set('dateSession',s);self.renderDate(v,s);

    v.querySelector('#dt_end').onclick=()=>{self._view='result';self.render(v);};
  },
  renderResult(v,session){
    const self=this;
    const moods=['☺️ 愉快','🙂 平淡','😔 不愉快'];
    v.innerHTML=`<div class="pad">
      <div class="card" style="text-align:center;padding:24px"><div style="font-size:38px">${esc(session.emoji)}</div>
        <h2 style="font-family:var(--font-serif);margin:10px 0 6px">这场约会结束了</h2>
        <div class="hint">${esc(session.place)} · ${esc(session.spot)}<br>同行：${esc(session.people.join('、'))} · 共 ${session.turn} 回合</div></div>
      <div class="card"><h3>◉ 结算</h3>
        <div class="hint" style="margin-bottom:9px">选一个心情，并确认好感变动（单场景上限 +5）。</div>
        <div class="seg" id="dt_mood">${moods.map((m,i)=>`<button data-m="${i}" class="${i===0?'on':''}">${m}</button>`).join('')}</div>
        <div class="field"><label>好感变动（-20 ~ +5）</label><input id="dt_aff" type="number" min="-20" max="5" value="2"></div>
        <button class="btn gold" id="dt_save">💾 保存这场记录</button>
        <button class="btn ghost" id="dt_more" style="margin-top:8px">↩ 再续一回合</button></div>
      <div class="hint" style="text-align:center">${en('The best part is the part nobody writes down.')}</div>
    </div>`;
    let mood=0;
    v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mood=+b.dataset.m;v.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));});
    v.querySelector('#dt_more').onclick=()=>{self._view='date';self.render(v);};
    v.querySelector('#dt_save').onclick=()=>{
      const aff=Math.max(-20,Math.min(5,parseInt(v.querySelector('#dt_aff').value)||0));
      const h=store.get('dateHistory',[]);h.unshift({...session,mood:moods[mood],aff});store.set('dateHistory',h);
      const s=store.state();s.affinity=Math.max(0,Math.min(100,(s.affinity||0)+aff));store.setState(s);
      const cs=store.contacts();const t=cs.find(x=>x.isTony);if(t){t.affinity=s.affinity;store.setContacts(cs);}
      store.set('dateSession',null);self._view='setup';self.spot=null;self.people=[];
      // 约饭后的连锁：托尼的一面日记 + 哈皮的抓拍推文
      (async()=>{
        try{
          const sys=buildSystem('worldline',`替托尼·斯塔克写一面 3~5 行日记（刚结束一场在${session.place}的饭局）。只用物件、动作、技术细节，不出现情绪词，不解释。`);
          const dr=await ai([{role:'user',content:'场所：'+session.place+' / '+session.spot+'。同行：'+session.people.join('、')+'。心情：'+moods[mood]}],sys,
            ()=>'酒单第 2 页没人翻。\n杯沿缺口朝里放好了。\n侍者记住了不要冰。\n回去的车里比来时安静。够了，不写了。');
          const a=store.get('diary',[]);a.unshift({id:'d'+Date.now(),author:'托尼·斯塔克',text:dr,paper:1,time:nowTime()});store.set('diary',a);
          const ps=store.posts();ps.twitter=ps.twitter||[];
          ps.twitter.unshift({name:'哈皮·霍根',handle:'@happy_hogan',text:'（抓拍）'+session.emoji+' '+session.place+'。他今晚没迟到——这次真是意外。别转了，我会被问。',likes:Math.floor(Math.random()*120)+20,comments:[]});
          store.setPosts(ps);
          banner('约饭 · 连锁记录','托尼写了一面日记；哈皮的抓拍推文已发出',()=>openApp('diary'));
        }catch(e){}
      })();
      self.render(v);toast('已保存 · 好感 '+(aff>0?'+':'')+aff);
    };
  }
};

    v.querySelector('#mm_box').innerHTML=`<div class="card" style="border-color:var(--gold)"><h3 style="color:var(--gold)">◉ 新摘要</h3><div class="story" style="font-size:13.5px">${fmt(r)}</div>

  };
  const list=v.querySelector('#mm_list');
  list.innerHTML=arr.map((x,i)=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><div class="hint">${esc(x.time)}</div><div style="font-family:var(--font-serif);font-size:13px;line-height:1.8;margin-top:4px;white-space:pre-wrap">${fmt(x.text)}</div><span class="chip" data-md="${i}">删除</span></div>`).join('');
  list.querySelectorAll('[data-md]').forEach(el=>el.onclick=()=>{const a=store.get('memories',[]);a.splice(+el.dataset.md,1);store.set('memories',a);self.render(v);});

const THEME_VARS={bg:'--bg',panel:'--panel',panel2:'--panel2',line:'--line',text:'--text',muted:'--muted',cyan:'--cyan',cyanGlow:'--cyanGlow',gold:'--gold',red:'--red',green:'--green',wall:'--wall',iconBg:'--icon-bg',outer:'--outer',brandTint:'--brand-tint'};
function currentThemeId(){const a=store.get('appearance',{});return THEMES[a.theme]?a.theme:'graphite';}
function applyAppearance(){
  const a=store.get('appearance',{}),id=currentThemeId(),t=THEMES[id];
  const f=FONT_PRESETS[a.font||t.font]||FONT_PRESETS.elegant;
  const st=document.body.style;
  Object.keys(THEME_VARS).forEach(k=>st.setProperty(THEME_VARS[k],t.v[k]));
  st.background=t.v.outer;
  document.body.classList.toggle('theme-light',!!t.light);
  document.body.dataset.theme=id;
  try{localStorage.setItem('so_theme',t.light?'light':'dark');}catch(e){}
  document.documentElement.style.setProperty('--font-body',f.body);
  document.documentElement.style.setProperty('--font-ui',f.ui);
  document.documentElement.style.setProperty('--font-size-base',(a.size||t.size||14)+'px');
  const old=$('#soCustomCss');if(old)old.remove();
  if(a.css){const s=document.createElement('style');s.id='soCustomCss';s.textContent=a.css;document.head.appendChild(s);}
  document.body.classList.toggle('no-en-decor',a.enDecor===false);
  const n=$('#skinCurName');if(n)n.textContent=t.label;
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',t.v.bg);
}
function applyTheme(id){
  if(!THEMES[id])return;
  const t=THEMES[id],x=store.get('appearance',{});
  x.theme=id;x.font=t.font;x.size=t.size;x.enDecor=t.enDecor;
  store.set('appearance',x);applyAppearance();
  if($('#skinPanel').style.display!=='none')renderSkinPanel();
  if(currentApp==='appearance')apps.appearance.render($('#appBody'));
  renderGrid();if($('#skinPanel').style.display==='none')toast('外观已切换 · '+t.label);
}
function resetAppearance(){
  store.set('appearance',{theme:'graphite',font:'elegant',size:14,enDecor:true,css:''});
  store.set('hiddenApps',[]);applyAppearance();renderGrid();
  if($('#skinPanel').style.display!=='none')renderSkinPanel();
  if(currentApp==='appearance')apps.appearance.render($('#appBody'));
}
/* 桌面外观面板：外观设置直接放在桌面，不必进入 App */

      <div class="field" style="margin-bottom:9px"><label>字号 ${a.size||THEMES[cur].size}px</label><input id="sk_size" type="range" min="12" max="18" value="${a.size||THEMES[cur].size}"></div>
      <div class="srow" style="padding:6px 0;border-bottom:none"><div><div class="t" style="font-size:12.5px">英文装饰</div></div>
        <label class="switch"><input type="checkbox" id="sk_en" ${a.enDecor!==false?'checked':''}><span class="slider"></span></label></div></div>
    <div class="row" style="position:sticky;bottom:0;background:var(--panel);padding:9px 0 3px;margin-top:2px"><button class="btn ghost" id="sk_full">⚙ 完整外观设置</button><button class="btn ghost" id="sk_reset">↺ 恢复默认</button></div>`;
  const q=s=>p.querySelector(s);
  q('#sk_close').onclick=closeSkinPanel;
  p.querySelectorAll('[data-sk]').forEach(el=>el.onclick=()=>applyTheme(el.dataset.sk));
  p.querySelectorAll('[data-skf]').forEach(el=>el.onclick=()=>{const x=store.get('appearance',{});x.font=el.dataset.skf;store.set('appearance',x);applyAppearance();renderSkinPanel();if(currentApp==='appearance')apps.appearance.render($('#appBody'));});
  q('#sk_size').oninput=e=>{const x=store.get('appearance',{});x.size=+e.target.value;store.set('appearance',x);applyAppearance();const l=q('#sk_size').previousElementSibling;if(l)l.textContent='字号 '+e.target.value+'px';};
  q('#sk_en').onchange=e=>{const x=store.get('appearance',{});x.enDecor=e.target.checked;store.set('appearance',x);applyAppearance();};
  q('#sk_full').onclick=()=>{closeSkinPanel();openApp('appearance');};
  q('#sk_reset').onclick=()=>{resetAppearance();if($('#skinPanel').style.display==='none')toast('已恢复默认外观');};
}
function closeSkinPanel(){$('#skinPanel').style.display='none';$('#deskSkinBar').querySelector('.ar').textContent='▾';}
function toggleSkinPanel(){
  const p=$('#skinPanel');
  if(p.style.display!=='none'){closeSkinPanel();return;}
  const dev=document.querySelector('.device').getBoundingClientRect(),bar=$('#deskSkinBar').getBoundingClientRect();
  p.style.top=Math.max(150,bar.bottom-dev.top+6)+'px';
  renderSkinPanel();p.style.display='block';
  $('#deskSkinBar').querySelector('.ar').textContent='▴';
}

/* ============================================================
   复联群聊（评估结论：有必要，但必须复联1 后解锁）
   自动发消息 / 部分角色延迟回复 / 独立小剧场
   ============================================================ */
const AVENGERS=[
  {name:'托尼·斯塔克',short:'托尼',color:'#e23636',delay:1200,reply:0.92},
  {name:'史蒂夫·罗杰斯',short:'史蒂夫',color:'#2d6bff',delay:3600,reply:0.75},
  {name:'托尔',short:'托尔',color:'#f5b942',delay:6500,reply:0.6},
  {name:'布鲁斯·班纳',short:'班纳',color:'#4fd08a',delay:4700,reply:0.65},
  {name:'娜塔莎·罗曼诺夫',short:'娜塔莎',color:'#b04444',delay:2400,reply:0.7},
  {name:'克林特·巴顿',short:'克林特',color:'#7c8da0',delay:5600,reply:0.55},
];
function avengersMembers(){
  const f=flags();let list=AVENGERS.slice();
  if(f.ultronAfter){list.push({name:'幻视',short:'幻视',color:'#8a2be2',delay:4000,reply:0.6},{name:'旺达·马克西莫夫',short:'旺达',color:'#c0392b',delay:5200,reply:0.5});}
  return list.map(x=>({...x,faction:f.civilWar?(['托尼·斯塔克','幻视','娜塔莎·罗曼诺夫'].includes(x.name)?'协议方':'反协议方'):'',absent:f.snap&&['托尔','布鲁斯·班纳','克林特·巴顿'].includes(x.name)}));
}
apps.avengers={title:'复联群聊',render(v){
  const self=this,f=flags();$('#actBtn').style.display='none';
  if(!f.groupUnlocked){
    v.innerHTML=`<div class="pad"><div class="card lockbox"><div class="lk">🔒</div>
      <h2 style="font-family:var(--font-serif);font-size:17px;margin:0 0 10px">复联群聊 · 尚未解锁</h2>
      <div class="hint" style="max-width:300px;margin:0 auto 16px">当前时间点 <b>${esc(f.era.name)}</b>。纽约之战还没发生——初代复联彼此不熟，甚至没坐过同一张桌子。这时候拉一个群，所有人都会 OOC。<br><br>群聊将在 <b>2012 · 虫洞之后（复联1 后）</b> 自动解锁。</div>
      <button class="btn gold" id="av_unlock">🔓 标记「复联1 已发生」并解锁</button>
      <button class="btn ghost" id="av_era" style="margin-top:8px">↗ 切换时间线到复联1 后</button>
      <div class="hint" style="margin-top:16px">${en('They were not a team yet.')} · 详见「设置 → 宇宙开关」</div></div></div>`;
    v.querySelector('#av_unlock').onclick=()=>{const s=store.state();s.forceAvengers1=true;store.setState(s);renderGrid();toast('已解锁 · 复仇者集结');self.render(v);};
    v.querySelector('#av_era').onclick=()=>showOnboard(true);
    return;
  }
  const msgs=store.get('groupMsgs',[]),mem=avengersMembers();
  v.innerHTML=`<div class="pad">
    <div class="card" style="padding:12px"><div class="eyebrow">AVENGERS · SECURE CHANNEL</div>
      <div style="font-family:var(--font-serif);font-size:15px;font-weight:700;margin:6px 0">🛡️ 复仇者频道 · ${esc(eraName())}</div>
      <div class="hint" style="margin-bottom:9px">解锁于复联1 之后。自动消息、部分角色延迟回复、独立小剧场，让六个人不像同时在线的客服。</div>
      <div class="row"><button class="btn ghost sm" id="av_auto">📨 自动生成一条群消息</button><button class="btn ghost sm" id="av_scene">🎭 开启独立小剧场</button></div>
      <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="av_mem">👥 成员状态</button><button class="btn ghost sm" id="av_clear">🗑 清空记录</button></div></div>
    <div class="card" style="padding:12px"><h3 style="margin-bottom:9px">◉ 频道消息（<span id="av_count">${msgs.length}</span>）</h3>
      <div id="av_thread" style="max-height:46vh;overflow-y:auto">${msgs.length?msgs.map((m,i)=>`<div class="gmsg" data-i="${i}">
        <div class="gav" style="background:${esc(m.color||'#35d0ff')}">${esc((m.short||m.name||'?')[0])}</div>
        <div class="gbd"><div class="gnm">${esc(m.name)}${m.faction?' <span class="tag red">'+esc(m.faction)+'</span>':''}${m.auto?' <span class="tag">自动</span>':''} <span class="hint" style="font-size:9px">${esc(m.time||'')}</span></div>
          <div class="gtx">${fmt(m.text)}</div><span class="chip" data-avd="${i}" style="margin-top:5px">撤回</span></div></div>`).join(''):'<div class="empty">频道很安静。点「自动生成一条群消息」或自己发一句。</div>'}</div>
      <div class="composer" style="padding:10px 0 0;background:none;border:none"><input id="av_in" placeholder="发送到复仇者频道…（可用 @ 提及）"><button id="av_snd">发送</button></div></div>
    <div class="hint" style="text-align:center">${en('We showed up.')} · 角色按各自节奏回复，有人会晚，有人根本不回。</div>
  </div>`;
  const thread=v.querySelector('#av_thread');
  const paint=()=>{const a=store.get('groupMsgs',[]);thread.innerHTML=a.length?a.map((m,i)=>`<div class="gmsg" data-i="${i}">
    <div class="gav" style="background:${esc(m.color||'#35d0ff')}">${esc((m.short||m.name||'?')[0])}</div>
    <div class="gbd"><div class="gnm">${esc(m.name)}${m.faction?' <span class="tag red">'+esc(m.faction)+'</span>':''}${m.auto?' <span class="tag">自动</span>':''} <span class="hint" style="font-size:9px">${esc(m.time||'')}</span></div>
      <div class="gtx">${fmt(m.text)}</div><span class="chip" data-avd="${i}" style="margin-top:5px">撤回</span></div></div>`).join(''):'<div class="empty">频道很安静。</div>';
    thread.scrollTop=thread.scrollHeight;
    const cnt=document.querySelector('#av_count');if(cnt)cnt.textContent=a.length;
    thread.querySelectorAll('[data-avd]').forEach(el=>el.onclick=()=>{const b=store.get('groupMsgs',[]);b.splice(+el.dataset.avd,1);store.set('groupMsgs',b);paint();});
  };
  thread.querySelectorAll('[data-avd]').forEach(el=>el.onclick=()=>{const a=store.get('groupMsgs',[]);a.splice(+el.dataset.avd,1);store.set('groupMsgs',a);paint();});
  const send=()=>{const x=v.querySelector('#av_in').value.trim();if(!x)return;v.querySelector('#av_in').value='';self.send(v,x,paint);};
  v.querySelector('#av_snd').onclick=send;
  v.querySelector('#av_in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send();}});
  v.querySelector('#av_auto').onclick=()=>self.autoMessage(v,paint);
  v.querySelector('#av_scene').onclick=()=>self.scene(v,paint);
  v.querySelector('#av_mem').onclick=()=>{const d=modal(`<h2 style="color:var(--cyan);margin-top:0">👥 成员状态 · ${esc(eraName())}</h2>${mem.map(m=>`<div class="card" style="padding:11px"><div style="font-family:var(--font-serif);font-weight:700">${esc(m.name)}</div><div class="hint">${esc(m.absent?'暂不在频道（响指之后）':m.faction?'阵营：'+m.faction:'在线')} · 回复延迟约 ${(m.delay/1000).toFixed(1)}s · 回复倾向 ${Math.round(m.reply*100)}%</div></div>`).join('')}<button class="btn" data-close style="margin-top:8px">关闭</button>`);};
  v.querySelector('#av_clear').onclick=()=>{if(!confirm('清空频道记录？'))return;store.set('groupMsgs',[]);self.render(v);};
  // 进入频道自动发消息（避免全员同时在线的穿帮感：只发 1~2 条）
  if(store.get('proactive',true)&&!msgs.length){setTimeout(()=>self.autoMessage(v,paint,2),700);}
},
  push(name,text,extra){
    const mem=avengersMembers().find(x=>x.name===name)||{};
    const a=store.get('groupMsgs',[]);a.push({name,short:mem.short||name[0],color:mem.color||'#35d0ff',faction:mem.faction||'',text,time:nowTime(),auto:!!extra?.auto});store.set('groupMsgs',a);
  },
  async autoMessage(v,paint,n){
    const sys=buildSystem('group',`生成复仇者频道里 ${n||1} 条「自动发生」的消息：可以是清理进度、会议通知、一句吐槽。严格按角色卡说话，每行：姓名 ||| 内容。最多 ${n||1} 行。不得全员一起发言。`);
    const r=await ai([{role:'user',content:'请生成'+ (n||1) +'条自动群消息。当前：'+eraName()}],sys,()=>LOCAL.groupAuto().slice(0,n||1).join('\n'));
    let cnt=0;
    r.split('\n').filter(l=>l.includes('|||')).slice(0,n||1).forEach(l=>{const[a,b]=l.split('|||').map(x=>x.trim());if(a&&b){this.push(a,b,{auto:true});cnt++;}});
    if(!cnt){const x=LOCAL.groupAuto()[0].split('|||');this.push(x[0].trim(),x[1].trim(),{auto:true});}
    paint();toast('频道里有新消息');
  },
  async send(v,text,paint){
    const self=this,f=flags();
    const p=store.profile()||{};
    const a=store.get('groupMsgs',[]);a.push({name:p.name||'你',short:'你',color:'#35d0ff',text,time:nowTime()});store.set('groupMsgs',a);paint();
    const mem=avengersMembers().filter(m=>!m.absent);
    // 延迟回复：按各自 delay 依次到达；并非所有人都会回
    const mention=(text.match(/@([^\s]+)/)||[])[1];
    const chosen=mem.filter(m=>Math.random()<m.reply).slice(0,3);
    if(mention){const t=mem.find(m=>m.name.includes(mention)||m.short===mention);if(t&&!chosen.includes(t))chosen.unshift(t);}
    if(!chosen.length)chosen.push(mem[0]);
    const sys=buildSystem('group',`你在复仇者频道。玩家刚发了："${text}"。请只以【将回复的角色】的口吻各输出 1 句，每行：姓名 ||| 内容。严格按角色卡，不替别人发言，不复述玩家的话。内战期注意阵营语气。`);
    const r=await ai([{role:'user',content:'玩家消息：'+text+'\n将回复的角色：'+chosen.map(x=>x.name).join('、')}],sys,()=>chosen.map(x=>x.name+' ||| '+localReply(x.name,text)).join('\n'));
    const lines=r.split('\n').filter(l=>l.includes('|||')).slice(0,chosen.length+1);
    chosen.forEach((m,i)=>{
      setTimeout(()=>{
        const line=lines[i];let body=line?line.split('|||').slice(1).join('|||').trim():localReply(m.name,text);
        if(!body)body=localReply(m.name,text);
        self.push(m.name,body);
        if(currentApp==='avengers')paint();
        else banner(m.short,'复仇者频道有新消息',()=>openApp('avengers'));
      },m.delay+Math.random()*900);
    });
  },
  async scene(v,paint){
    const d=modal(`<div class="loader" style="padding:26px"><div class="spin"></div>正在搭一场独立小剧场…</div>`);
    const sys=buildSystem('group',`写一段复仇者频道的「独立小剧场」：一个场景、3~5 条台词，每行：姓名 ||| 内容。严格按角色卡，不 OOC，不出现未来事件。开头先用【场景】写一行环境。`);
    const r=await ai([{role:'user',content:'请写一场独立小剧场，主题：一张不够长的桌子 / 一次谁都不肯先走的会议。当前：'+eraName()}],sys,
      ()=>'【场景】复联基地，深夜。长桌上摊着战术地图和三个凉掉的披萨盒。\n托尼·斯塔克 ||| *"We\'re not a team."*（我们不算一支队伍。）\n史蒂夫·罗杰斯 ||| *"No. But we showed up."*（不算。但我们都来了。）\n托尔 ||| 你们的「披萨」，是某种献祭用的圆饼吗？\n娜塔莎·罗曼诺夫 ||| 谁把最后一盒拿走了。\n克林特·巴顿 ||| ……不是我。');
    const lines=r.split('\n').filter(l=>l.trim());
    let sceneLine='';
    lines.forEach(l=>{if(l.includes('【场景】'))sceneLine=l.replace(/【场景】/,'').trim();else if(l.includes('|||')){const[a,b]=l.split('|||').map(x=>x.trim());if(a&&b){const m=avengersMembers().find(x=>x.name===a);this.push(a,b,{auto:false});}}});
    d.innerHTML=`<h2 style="color:var(--cyan);margin-top:0">🎭 独立小剧场</h2>
      ${sceneLine?`<div class="card"><div class="story" style="font-size:13px">${fmt(sceneLine)}</div></div>`:''}
      <div class="card"><div class="hint" style="margin-bottom:8px">台词已写入频道：</div>${lines.filter(l=>l.includes('|||')).map(l=>{const[a,b]=l.split('|||').map(x=>x.trim());return `<div class="cmt"><b>${esc(a)}</b> ${fmt(b)}</div>`;}).join('')}</div>
      <button class="btn" data-close>回到频道</button>`;
    d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.remove());
    paint();
  }
};

/* ============================================================
   启动
   ============================================================ */
(function boot(){
  // 旧版明暗存档迁移到完整外观预设
  const ap=store.get('appearance',{});
  if(!ap.theme){ap.theme=(localStorage.getItem('so_theme')==='light')?'mist':'graphite';store.set('appearance',ap);}
  // 旧版单栏 API 配置 → 分栏（文本/生图/总结）
  const rawCfg=store.g('cfg',null);
  if(rawCfg&&(rawCfg.baseUrl||rawCfg.apiKey||rawCfg.provider)&&!rawCfg.text){
    store.setCfg({text:{baseUrl:rawCfg.baseUrl||'https://api.openai.com/v1',apiKey:rawCfg.apiKey||'',model:rawCfg.model||'gpt-4o-mini',temperature:rawCfg.temperature??0.85,presets:[]},
      image:{baseUrl:'',apiKey:'',model:rawCfg.imgModel||'',presets:[]},summary:{baseUrl:'',apiKey:'',model:'',presets:[]}});
  }
  SFX.on=store.get('sfxOn',true);
  applyAppearance();
  FX.scan(store.get('fxOn',true));
  JarvisHUD.init();
  TonyStatus.refresh();
  EnvLog.init();
  FT.init().then(()=>ftIndexAll());
  const hasState=!!store.state();
  if(hasState){seedContacts();seedMails();seedNews();seedChats();}
  renderGrid();
  // 开屏顺序：操作与内容说明（可跳过）→「时间线选择 + 人设填写」
  if(needGuide()||store.get('alwaysGuide',false)){
    setTimeout(()=>showGuide(false),360);
  }else if(needOnboard()||store.get('alwaysOnboard',false)){
    setTimeout(()=>showOnboard(!needOnboard()),420);
  }else if(store.get('proactive',true)&&apiCfg('text').apiKey){
    // 老玩家：仅在配置了 AI 时给一条轻量开屏提示，不打断
    setTimeout(()=>banner('J.A.R.V.I.S.',`欢迎回来。当前：${eraName()} · 托尼 ${flags().tonyAge} 岁。`,()=>openApp('worldline')),900);
  }
})();
</script>
